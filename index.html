  <style>
    /* Anti-Inspection & Copy Protection */
    *, *::before, *::after {
      -webkit-user-select: none !important;
      user-select: none !important;
      -webkit-user-drag: none !important;
      -webkit-touch-callout: none !important;
    }
    input, textarea {
      -webkit-user-select: auto !important;
      user-select: auto !important;
    }

    /* Dark Background & Transparent Canvas Container */
    html, body {
      background: #121418 !important;
      color-scheme: dark;
    }
    #app {
      background: transparent !important;
    }
    /* Remove Sign In buttons, cues, and legacy bottom-left penchip tin box */
    .signintop,
    .boardbtn.signintop,
    .howlink.presentcue,
    [data-act="present"],
    #pf-corridor-signin,
    .corridorsigninchip,
    .corridorhi-nudge,
    .corridor-signin-wrap,
    a[href*="google"],
    button[data-act="present"],
    .penchip,
    button.penchip,
    [data-act="box"],
    .boxbtn,
    .pocketchip {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
      height: 0 !important;
      width: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    /* Modal & Room Flow Comic Styles */
    .count-grid-8 {
      grid-template-columns: repeat(4, 1fr) !important;
    }
    @media (max-width: 600px) {
      .count-grid-8 {
        grid-template-columns: repeat(2, 1fr) !important;
      }
    }

    .p-sub {
      font-size: 8px;
      font-weight: 700;
      color: var(--pf-ink-muted);
      text-transform: uppercase;
    }

    .room-lobby-body {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .room-share-card {
      background: var(--pf-paper);
      border: var(--pf-border);
      border-radius: var(--pf-radius-md);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--pf-shadow-flat);
    }

    .share-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .share-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--pf-ink-muted);
      text-transform: uppercase;
    }

    .share-url {
      font-family: var(--pf-font-body);
      font-size: 11px;
      font-weight: 700;
      color: var(--pf-teal-dark);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-copy-link {
      background: var(--pf-mustard);
      border: var(--pf-border-thin);
      border-radius: var(--pf-radius-sm);
      box-shadow: 2px 2px 0 var(--pf-ink);
      font-family: var(--pf-font-body);
      font-size: 11px;
      font-weight: 700;
      color: var(--pf-ink);
      padding: 6px 12px;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform var(--pf-duration-fast) ease;
    }
    .btn-copy-link:hover {
      transform: translateY(-1px);
      box-shadow: 3px 3px 0 var(--pf-ink);
    }

    .connected-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .connected-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .connected-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--pf-ink-muted);
      text-transform: uppercase;
    }

    .connected-pill {
      font-size: 9px;
      font-weight: 700;
      color: var(--pf-teal-dark);
      background: var(--pf-teal-light);
      border: 1px solid var(--pf-teal);
      border-radius: var(--pf-radius-sm);
      padding: 2px 6px;
    }

    .connected-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 160px;
      overflow-y: auto;
    }

    .connected-player-row {
      background: var(--pf-paper);
      border: var(--pf-border-thin);
      border-radius: var(--pf-radius-sm);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .connected-player-row.is-host {
      border-color: var(--pf-orange);
      background: var(--pf-orange-light);
    }

    .c-player-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .c-name {
      font-weight: 700;
      font-size: 12px;
      color: var(--pf-ink);
    }

    .c-role {
      font-size: 9px;
      color: var(--pf-ink-muted);

    .c-status-badge {
      font-size: 9px;
      font-weight: 700;
      color: var(--pf-teal-dark);
    }

    .btn-start-host {

      background: var(--pf-orange);
      color: var(--pf-paper-light);
      box-shadow: 3px 3px 0 var(--pf-ink), 6px 6px 0 var(--pf-orange-dark);
      font-size: 13px;
      padding: 12px;

    /* Pen Selection Flow in Lobby */
    .timer-countdown-box {
      background: var(--pf-mustard-light);
      border: var(--pf-border-thin);
      border-radius: var(--pf-radius-md);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .timer-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .timer-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--pf-ink);
    }

    .timer-number {
      font-family: var(--pf-font-display);
      font-size: 20px;
      color: var(--pf-orange);
    }

    .timer-bar-track {
      width: 100%;
      height: 8px;
      background: var(--pf-paper);
      border: 1.5px solid var(--pf-ink);
      border-radius: var(--pf-radius-pill);
      overflow: hidden;
    }

    .timer-bar-fill {
      height: 100%;
      background: var(--pf-orange);
      transition: width 1s linear;
    }

    .player-slots-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 10px 0;
    }
    @media (max-width: 500px) {
      .player-slots-grid {
        grid-template-columns: 1fr;
      }
    }

    .player-pen-slot {
      background: var(--pf-paper);
      border: var(--pf-border);
      border-radius: var(--pf-radius-md);
      padding: 8px 10px;
      box-shadow: 2px 2px 0 var(--pf-ink);
    }

    .slot-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .slot-badge {
      font-size: 9px;
      font-weight: 700;
      color: var(--pf-ink);
      background: var(--pf-mustard);
      border: 1px solid var(--pf-ink);
      padding: 1px 5px;
      border-radius: 4px;
    }

    .slot-sub {
      font-size: 8px;
      color: var(--pf-ink-muted);
    }

    .slot-content {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      background: var(--pf-paper-light);
      border: 1.5px solid var(--pf-ink);
      border-radius: var(--pf-radius-sm);
      padding: 6px 8px;
      transition: transform var(--pf-duration-fast) ease;
    }
    .slot-content:hover {
      transform: translateY(-1px);
      box-shadow: 2px 2px 0 var(--pf-ink);
    }

    .slot-pen-img {
      width: 44px;
      height: 28px;
      object-fit: contain;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
    }

    .slot-pen-name {
      font-size: 11px;
      font-weight: 700;
      color: var(--pf-ink);
      display: block;
    }

    .slot-pen-change {
      font-size: 9px;
      color: var(--pf-teal-dark);
      display: block;
    }

    .hub-random-btn {
      background: var(--pf-mustard);
      border: var(--pf-border-thin);
      border-radius: var(--pf-radius-sm);
      box-shadow: 2px 2px 0 var(--pf-ink);
      font-family: var(--pf-font-body);
      font-size: 10px;
      font-weight: 700;
      color: var(--pf-ink);
      padding: 4px 8px;

    }

    .btn-start-battle {
      width: 100%;
      background: var(--pf-orange);
      color: var(--pf-paper-light);
      box-shadow: 3px 3px 0 var(--pf-ink), 6px 6px 0 var(--pf-orange-dark);
      font-size: 13px;
      padding: 12px;
    }

    /* Pen Picker Modal */
    .picker-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 30000;
      background: rgba(0, 0, 0, 0.6);
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .picker-overlay.open {
      display: flex;
    }

    .picker-modal {
      background: var(--pf-paper-light);
      border: var(--pf-border-thick);
      border-radius: var(--pf-radius-lg);
      box-shadow: 6px 6px 0 var(--pf-ink), 10px 10px 0 var(--pf-orange);

      width: 100%;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      padding: 18px;
      box-sizing: border-box;
    }

    .picker-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--pf-ink);
    }

    .picker-title {
      font-family: var(--pf-font-display);
      font-size: 20px;
      color: var(--pf-ink);
    }

    .picker-close-btn {
      background: var(--pf-paper);
      border: var(--pf-border-thin);
      border-radius: var(--pf-radius-sm);
      box-shadow: 2px 2px 0 var(--pf-ink);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      padding: 2px 8px;
    }

    .picker-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 12px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .picker-item {
      background: var(--pf-paper);
      border: var(--pf-border-thin);
      border-radius: var(--pf-radius-sm);
      padding: 6px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 2px 2px 0 var(--pf-ink);
      transition: transform var(--pf-duration-fast) ease;
    }
    .picker-item:hover {
      transform: translateY(-2px);
      background: var(--pf-mustard-light);
    }

    .picker-item-img {
      width: 36px;
      height: 24px;
      object-fit: contain;
    }

    .picker-item-name {
      font-size: 11px;
      font-weight: 700;
      color: var(--pf-ink);
    }

    .pf-score-exit-btn {
      font-family: var(--pf-font-body);
      font-size: 11px;
      font-weight: 800;
      background: var(--pf-paper-light);
      color: var(--pf-color-danger, #C13B2E);
      border: 2px solid var(--pf-color-danger, #C13B2E);
      border-radius: var(--pf-radius-pill);
      padding: 4px 10px;
      box-shadow: 2px 2px 0 var(--pf-ink);
      cursor: pointer;
      display: none !important;
      align-items: center;
      gap: 4px;
      margin-left: 6px;
      transition: transform var(--pf-duration-fast) ease, background var(--pf-duration-fast) ease;
    }
    .pf-score-exit-btn.visible {
      display: inline-flex !important;
    }
    .pf-score-exit-btn:hover {
      background: #FFE8DF;
      transform: translateY(-1px);
    }

    .pf-btn-exit-match {
      display: none !important;
    }
    .pf-btn-exit-match.visible {
      display: inline-flex !important;
    }

    /* Exit Confirmation Modal */
    .exit-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 40000;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .exit-confirm-card {
      background: var(--pf-paper-light);
      border: var(--pf-border-thick);
      border-radius: var(--pf-radius-lg);
      box-shadow: 6px 6px 0 var(--pf-ink), 10px 10px 0 var(--pf-orange);
      max-width: 440px;
      width: 100%;
      padding: 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .exit-modal-badge {
      align-self: center;
      background: var(--pf-orange);
      color: var(--pf-paper-light);
      font-family: var(--pf-font-body);
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border: 1.5px solid var(--pf-ink);
      border-radius: 4px;
      box-shadow: 2px 2px 0 var(--pf-ink);
    }

    .exit-modal-title {
      font-family: var(--pf-font-display);
      font-size: 26px;
      color: var(--pf-ink);
      margin: 0;
    }

    .exit-modal-desc {
      font-family: var(--pf-font-body);
      font-size: 12px;
      line-height: 1.5;
      color: var(--pf-ink-soft);
      margin: 0;
    }

    .exit-modal-btn-row {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .btn-cancel-exit {
      flex: 1;
      background: var(--pf-teal);
      color: var(--pf-paper-light);
      border: var(--pf-border);
      border-radius: var(--pf-radius-pill);
      box-shadow: 3px 3px 0 var(--pf-ink);
      font-family: var(--pf-font-body);
      font-size: 11px;
      font-weight: 700;
      padding: 10px;
      cursor: pointer;
    }

    .btn-confirm-exit {
      flex: 1;
      background: var(--pf-orange);
      color: var(--pf-paper-light);
      border: var(--pf-border);
      border-radius: var(--pf-radius-pill);
      box-shadow: 3px 3px 0 var(--pf-ink);
      font-family: var(--pf-font-body);
      font-size: 11px;
      font-weight: 700;
      padding: 10px;
      cursor: pointer;
    }

    .game-over-hub {

    }
    .game-over-scorebox .s-divider {
      font-family: var(--pf-font-display);

      color: var(--pf-ink-muted);

    .game-over-actions {
      display: flex;
      flex-direction: column;

      margin-top: 4px;

    .btn-game-rematch {

      background: var(--pf-orange);
      color: #fff;
      border: var(--pf-border);
      border-radius: var(--pf-radius-pill);
      font-family: var(--pf-font-body);
      font-size: 13px;
      font-weight: 800;
      padding: 12px;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--pf-ink), 6px 6px 0 var(--pf-orange-dark);
      transition: transform var(--pf-duration-fast) ease;

      background: var(--pf-paper);
      color: var(--pf-ink);

      border-radius: var(--pf-radius-pill);
      font-family: var(--pf-font-body);

      font-weight: 700;
      color: var(--pf-ink);

    .join-room-hub {

      padding: 12px 14px;
      font-family: var(--pf-font-display);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 2px;
      text-align: center;
      color: var(--pf-orange);

      border-color: var(--pf-orange);
      box-shadow: inset 2px 2px 0 rgba(0,0,0,0.08), 0 0 0 3px var(--pf-mustard-light);

  <script>
    // Global Master 12 Pens Roster
    const ALL_12_PENS = [
      { id: "gripper", name: "Cello Gripper", short: "Gripper", img: "/assets/art/pen-gripper.webp", trait: "High Table Grip" },
      { id: "pilotV5", name: "Pilot V5", short: "Pilot V5", img: "/assets/art/pen-pilotV5.webp", trait: "Fast Speed Dart" },
      { id: "reynolds-trimax", name: "Reynolds Trimax", short: "Trimax", img: "/assets/art/pen-reynolds-trimax.webp", trait: "Anti-Roll Body" },

      { id: "parker", name: "Parker Vector", short: "Vector", img: "/assets/art/pen-parker.webp", trait: "Heavy Steel Momentum" },
      { id: "megatop", name: "Montex Megatop", short: "Megatop", img: "/assets/art/pen-megatop.webp", trait: "Curved Trick Shots" },

      { id: "cello-butterflow", name: "Cello Butterflow", short: "Butterflow", img: "/assets/art/pen-cello-butterflow.webp", trait: "Impact Shock Absorber" },
      { id: "linc-ocean", name: "Linc Ocean", short: "Ocean", img: "/assets/art/pen-linc-ocean.webp", trait: "Angle Ricochet Deflect" },
      { id: "reynolds-racer-gel", name: "Reynolds Racer Gel", short: "Racer Gel", img: "/assets/art/pen-reynolds-racer-gel.webp", trait: "Wide Bulldozer Body" }
    ];

    function getEquippedPenId() {
      return localStorage.getItem("pf_equipped_pen") || localStorage.getItem("pf_equipped") || "gripper";
    }

    function setEquippedPenId(penId) {
      if (!penId) return;
      localStorage.setItem("pf_equipped_pen", penId);
      localStorage.setItem("pf_equipped", penId);
      try {
        const col = JSON.parse(localStorage.getItem("pf_collection_v1") || "{}");
        col.equipped = penId;
        if (!col.owned || !Array.isArray(col.owned)) col.owned = ["reynolds045"];
        if (!col.owned.includes(penId)) col.owned.push(penId);
        localStorage.setItem("pf_collection_v1", JSON.stringify(col));
      } catch(e) {}
    }

    window.getEquippedPenId = getEquippedPenId;
    window.setEquippedPenId = setEquippedPenId;

    window.currentChosenPens = [getEquippedPenId(), "pilotV5", "reynolds-trimax", "reynolds045", "parker", "megatop", "addgel", "classmate-octane"];
    window.roomPlayerCount = 2;
    window.matchPlayerCount = 2;
    window.matchMode = "solo";
    window.currentRoomCode = "BENCH-7492";
    window.penSelectionTimerInterval = null;
    window.penSelectionSecondsRemaining = 8;
    window.selectingForSlot = null;

    var currentChosenPens = window.currentChosenPens;
    var roomPlayerCount = 2;
    var matchPlayerCount = 2;
    var matchMode = "solo";
    var currentRoomCode = "BENCH-7492";
    var penSelectionTimerInterval = null;
    var penSelectionSecondsRemaining = 8;
    var selectingForSlot = null;

    // Exit Button Logic (Only visible during active gameplay)
    window.isMatchActive = false;

    window.showMatchExitButton = function() {
      window.isMatchActive = true;
      const actions = document.getElementById("pf-arena-quick-actions");
      if (actions) actions.style.display = "none";
      const btn = document.getElementById("pf-btn-exit-match");
      if (btn) {
        btn.style.display = "inline-flex";
        btn.classList.add("visible");
      }
      const scoreBtn = document.getElementById("pf-score-exit-btn");
      if (scoreBtn) {
        scoreBtn.style.display = "inline-flex";
        scoreBtn.classList.add("visible");
      }
    };

    window.hideMatchExitButton = function() {
      window.isMatchActive = false;
      const actions = document.getElementById("pf-arena-quick-actions");
      if (actions) actions.style.display = "flex";
      const btn = document.getElementById("pf-btn-exit-match");
      if (btn) {
        btn.style.display = "none";
        btn.classList.remove("visible");
      }
      const scoreBtn = document.getElementById("pf-score-exit-btn");
      if (scoreBtn) {
        scoreBtn.style.display = "none";
        scoreBtn.classList.remove("visible");
      }
    };

    window.exitMatchToMainMenu = function() {
      window._matchLaunched = false;
      const modal = document.getElementById("pf-exit-confirm-modal");
      if (modal) {
        modal.classList.add("open");
        modal.style.display = "flex";
      } else {
        window.confirmExitAndLeaveMatch();
      }
    };

    window.closeExitConfirmModal = function() {
      const modal = document.getElementById("pf-exit-confirm-modal");
      if (modal) {
        modal.style.display = "none";
        modal.classList.remove("open");
      }
    };

    window.confirmExitAndLeaveMatch = function() {
      window.closeExitConfirmModal();
      window.hideMatchExitButton();

      // Clean up WebRTC multiplayer if in a room
      if (window.PF_MULTIPLAYER) {
        window.PF_MULTIPLAYER.disconnect();
      }
      if (window.PF_MULTIPLAYER_MATCH) {
        window.PF_MULTIPLAYER_MATCH.reset();
      }

      // Reset URL search parameters cleanly back to root
      try {
        window.history.pushState({}, '', window.location.pathname);
      } catch(e) {}

      // Pause singleplayer AI / game controller
      if (window.__pf && window.__pf.controller) {
        const ctrl = window.__pf.controller;
        ctrl.paused = true;
      }

      // Open Playbook Hub
      if (window.renderArcadeHub) {
        window.renderArcadeHub();
      }
      window.updateLiveScoreboard();
    };

    // =========================================================================
    // REMATCH & GAME OVER FLOW
    // =========================================================================
    window.myRematchVote = null;
    window.peerRematchVote = null;

    window.showGameOverModal = function(winnerRole, scores) {
      const { wrap, card } = ensureChitCard();
      card.className = "chit arcade-hub-chit";
      wrap.className = "chitwrap arcade-hub-wrap";
      window.myRematchVote = null;
      window.peerRematchVote = null;

      const isMulti = window.PF_MULTIPLAYER && window.PF_MULTIPLAYER.state === 'OPEN';
      const isHost = window.PF_MULTIPLAYER ? window.PF_MULTIPLAYER.isHost : true;
      const myRole = isHost ? "player" : "rival";
      const localName = (localStorage.getItem("pf_name") || (isHost ? "Host" : "Friend")).toUpperCase();
      const remoteName = (window.PF_MULTIPLAYER?.remoteName || (isHost ? "Friend" : "Host")).toUpperCase();

      const p1Name = isMulti ? (isHost ? localName : remoteName) : localName;
      const p2Name = isMulti ? (isHost ? remoteName : localName) : (window.__pf?.controller?.rivalName || "BUNTY").toUpperCase();

      const winnerName = (winnerRole === "player") ? p1Name : p2Name;
      const isMeWinner = (winnerRole === myRole);

      card.innerHTML = `
        <div class="arcade-hub game-over-hub">
          <div class="game-over-header">
            <span class="game-over-trophy">${isMeWinner ? "🏆" : "🥈"}</span>
            <h2 class="game-over-title">${winnerName} WON!</h2>
            <p class="game-over-sub">${isMeWinner ? "👑 Winner!" : "⚡ Play Rematch?"}</p>
          </div>

          <div class="game-over-scorebox">
            <div class="score-col">
              <span class="s-name">${p1Name}</span>
              <span class="s-num">${(scores && scores.player) ? scores.player : 0}</span>
            </div>
            <span class="s-divider">-</span>
            <div class="score-col">
              <span class="s-name">${p2Name}</span>
              <span class="s-num">${(scores && scores.rival) ? scores.rival : 0}</span>
            </div>
          </div>

          <div class="game-over-actions">
            <button type="button" class="btn-game-rematch" id="btn-rematch" onclick="window.requestRematch()">
              🔄 REMATCH (PLAY AGAIN)
            </button>
            <button type="button" class="btn-game-leave" onclick="window.requestLeaveMatch()">
              🚪 EXIT TO MAIN MENU
            </button>
          </div>

          <div class="rematch-status-pill" id="rematch-status-pill" style="display:none;"></div>
        </div>
      `;

      wrap.classList.add("show");
      wrap.removeAttribute("inert");
      wrap.removeAttribute("aria-hidden");
    };

    window.requestRematch = function() {
      window.myRematchVote = 'yes';
      const btn = document.getElementById("btn-rematch");
      const pill = document.getElementById("rematch-status-pill");

      const isMulti = window.PF_MULTIPLAYER && window.PF_MULTIPLAYER.state === 'OPEN';

      if (isMulti) {
        if (btn) {
          btn.textContent = "⏳ WAITING FOR OPPONENT (1/2 READY)...";
          btn.style.background = "var(--pf-mustard)";
          btn.style.color = "var(--pf-ink)";
          btn.disabled = true;
        }
        if (pill) {
          pill.style.display = "block";
          pill.textContent = "⏳ You voted for Rematch! Waiting for opponent...";
        }

        window.PF_MULTIPLAYER.sendRematchVote('yes');

        if (window.peerRematchVote === 'yes') {
          window.startRematchGame();
        }
      } else {
        window.startRematchGame();
      }
    };

    window.requestLeaveMatch = function() {
      window.myRematchVote = 'leave';
      const isMulti = window.PF_MULTIPLAYER && window.PF_MULTIPLAYER.state === 'OPEN';
      if (isMulti) {
        window.PF_MULTIPLAYER.sendRematchVote('leave');
      }
      window.confirmExitAndLeaveMatch();
    };

    window.startRematchGame = function() {
      window.myRematchVote = null;
      window.peerRematchVote = null;

      if (window.PF_MULTIPLAYER_MATCH) {
        window.PF_MULTIPLAYER_MATCH.reset();
      }

      if (window.__pf && window.__pf.controller) {
        const ctrl = window.__pf.controller;
        if (ctrl.wins) {
          ctrl.wins = { player: 0, rival: 0 };
        }
        ctrl.round = 0;
      }

      if (window.__pf?.controller?.hud) {
        window.__pf.controller.hud.showResult("🔥 REMATCH STARTING!", 2000);
      }

      window.closeHubAndPlay();

      if (window.PF_MULTIPLAYER && window.PF_MULTIPLAYER.state === 'OPEN') {
        if (window.PF_MULTIPLAYER.isHost && window.PF_MULTIPLAYER_MATCH) {
          window.PF_MULTIPLAYER_MATCH.startNextRoundAsHost(1, "player");
        }
      } else {
        if (window.setArenaPlayers) {
          window.setArenaPlayers(window.matchPlayerCount || 2, window.currentChosenPens);
        }
      }

      window.updateLiveScoreboard();
      window.PF_NET.updateTurnCue();
    };

    
    // Helper to calculate circular spawn coordinates for N players
    window.calculatePenSpawn = function(slotIndex, numPlayers, S) {
      const W = 0.46 * S;
      const D = 0.70 * S;
      const angle = (2 * Math.PI * slotIndex) / numPlayers - Math.PI / 2;
      const spawnX = ((W / 2) - 0.08) * Math.cos(angle);
      const spawnZ = ((D / 2) - 0.08) * Math.sin(angle);
      const yaw = -angle - Math.PI / 2;
      return { x: spawnX, z: spawnZ, yaw: yaw };
    };

    // Helper to get display name for any pen ID (player, rival, bot3..bot8)
    window.getPenDisplayName = function(penId) {
      const mp = window.PF_MULTIPLAYER;
      const ROSTER_KEYS = ["player", "rival", "bot3", "bot4", "bot5", "bot6", "bot7", "bot8"];
      const slot = ROSTER_KEYS.indexOf(penId);
      if (mp && mp.state === 'OPEN' && mp.players && slot >= 0) {
        const p = mp.players.find(x => x.slot === slot);
        if (p && p.name) return p.name.toUpperCase();
      }
      const defaultNames = {
        player: (localStorage.getItem("pf_name") || "YOU").toUpperCase(),
        rival: (mp?.remoteName || "BUNTY").toUpperCase(),
        bot3: "ARJUN",
        bot4: "MEERA",
        bot5: "DEV",
        bot6: "ROHAN",
        bot7: "SIMRAN",
        bot8: "KABIR"
      };
      return defaultNames[penId] || penId.toUpperCase();
    };

    
    // =========================================================================
    // 📱 MOBILE CAMERA SETTINGS (90-degree vertical table for phones!)
    // =========================================================================
    window.MOBILE_CAMERA_CONFIG = {
      rotated90: true, // Rotate table 90 degrees to vertically fill phone screens!
      distance: 0.38,  // Distance behind your pen
      height: 0.98,    // Height above desk
      fov: 64          // Field of view in degrees
    };

    // Live console helper: test changes instantly by typing setMobileCamera(distance, height, fov, rotated90)
    window.setMobileCamera = function(distance = 0.55, height = 1.35, fov = 74, rotated90 = true) {
      window.MOBILE_CAMERA_CONFIG.distance = distance;
      window.MOBILE_CAMERA_CONFIG.height = height;
      window.MOBILE_CAMERA_CONFIG.fov = fov;
      window.MOBILE_CAMERA_CONFIG.rotated90 = rotated90;
      if (window.updateArenaCamera) window.updateArenaCamera();
      console.log("📱 Current Mobile Camera Config:", window.MOBILE_CAMERA_CONFIG);
    };

    // Responsive Camera Framing for Mobile Portrait, Tablet, and Desktop
    window.updateArenaCamera = function(numPlayers = null, targetCam = null) {
      const pfCam = targetCam || (window.__pf && window.__pf.camera);
      if (!pfCam) return;
      const pf = window.__pf || {};
      const n = numPlayers || window.roomPlayerCount || window.matchPlayerCount || (pf.pens ? Object.keys(pf.pens).length : 2);
      const S = 1.0 + (Math.max(2, Math.min(8, n)) - 2) * 0.125;
      const w = window.innerWidth || 800;
      const h = window.innerHeight || 600;
      const aspect = w / h;

      let posX, posY, posZ, fov;

      if (aspect < 0.85) {
        // Mobile Portrait mode (e.g. iPhone 15 / Android smartphones in portrait)
        const cfg = window.MOBILE_CAMERA_CONFIG || { rotated90: true, distance: 0.55, height: 1.35, fov: 74 };
        if (cfg.rotated90) {
          // 90-degree rotated view: table runs vertically up the phone screen!
          posX = 0;
          posY = cfg.height * S;
          posZ = -cfg.distance * S;
        } else {
          posX = -cfg.distance * S;
          posY = cfg.height * S;
          posZ = 0;
        }
        fov = cfg.fov;

      } else if (aspect < 1.15) {
        // Square / Tablet mode (aspect 0.85 to 1.15)
        const distScale = 0.95;
        posX = -0.65 * S * distScale;
        posY = 0.84 * S * distScale;
        posZ = 0;
        fov = 68;

      } else {
        // Desktop Landscape mode (aspect >= 1.15)
        posX = -0.65 * S;
        posY = 0.84 * S;
        posZ = 0;
        fov = 52;
      }

      if (pf.baseCam) {
        pf.baseCam.x = posX;
        pf.baseCam.y = posY;
        pf.baseCam.z = posZ;
      }
      pfCam.position.set(posX, posY, posZ);
      pfCam.lookAt(0, 0, 0);
      pfCam.aspect = aspect;
      pfCam.fov = fov;
      pfCam.updateProjectionMatrix();
      pfCam.updateMatrixWorld(true);
    };

    window.addEventListener('resize', () => {
      if (window.updateArenaCamera) window.updateArenaCamera();
    });
    window.addEventListener('orientationchange', () => {
      setTimeout(() => { if (window.updateArenaCamera) window.updateArenaCamera(); }, 150);
    });

    window.setArenaPlayers = function(numPlayers, customPens = null) {
      numPlayers = Math.max(2, Math.min(8, parseInt(numPlayers) || 2));
      if (!window.__pf) return;
      const pf = window.__pf;

      const S = 1.0 + (numPlayers - 2) * 0.125;
      const baseW = 0.46;
      const baseD = 0.70;
      const W = baseW * S;
      const D = baseD * S;

      if (pf.deskRoot && pf.deskRoot.setTableScale) {
        pf.deskRoot.setTableScale(S);
      }

      if (pf.tableCollider) {
        pf.tableCollider.setHalfExtents({ x: W / 2, y: 0.03 / 2, z: D / 2 });
      }

      if (window.updateArenaCamera) {
        window.updateArenaCamera(numPlayers);
      }

      const QA = pf.physWorld;
      const aI = pf.scene;
      const zA = pf.pens;
      const wI = pf.visualPens;
      const TI = pf.tags;

      for (const id of Object.keys(zA)) {
        try {
          if (zA[id]?.body) QA.world.removeRigidBody(zA[id].body);
          if (wI[id]?.dispose) wI[id].dispose();
        } catch(e) {}
        delete zA[id];
        delete wI[id];
      }
      QA.tracked.length = 0;
      TI.clear();
      if (pf.tableCollider) TI.set(pf.tableCollider.handle, "desk");

      const ROSTER = [
        { id: "player", name: "You", pen: "gripper" },
        { id: "rival",  name: "Bunty", pen: "pilotV5" },
        { id: "bot3",   name: "Arjun", pen: "reynolds-trimax" },
        { id: "bot4",   name: "Meera", pen: "reynolds045" },
        { id: "bot5",   name: "Dev", pen: "megatop" },
        { id: "bot6",   name: "Rohan", pen: "parker" },
        { id: "bot7",   name: "Simran", pen: "addgel" },
        { id: "bot8",   name: "Kabir", pen: "classmate-octane" }
      ];

      const selected = ROSTER.slice(0, numPlayers);

      for (let k = 0; k < selected.length; k++) {
        const p = selected[k];
        const penId = (customPens && customPens[k]) ? customPens[k] : ((window.currentChosenPens && window.currentChosenPens[k]) ? window.currentChosenPens[k] : p.pen);
        const spec = pf.penSpecs[penId] || pf.penSpecs["reynolds045"];
        
        const angle = (2 * Math.PI * k) / numPlayers - Math.PI / 2;
        const spawnX = ((W / 2) - 0.08) * Math.cos(angle);
        const spawnZ = ((D / 2) - 0.08) * Math.sin(angle);
        const yaw = -angle - Math.PI / 2;

        const penPhys = pf.penBuilder(QA, pf.tuning, p.id, { x: spawnX, y: spec.radius + 0.002, z: spawnZ }, yaw, spec);
        zA[p.id] = penPhys;
        QA.track(penPhys.body);
        wI[p.id] = new pf.visualBuilder(aI, penPhys, spec.id);
        for (const col of penPhys.colliders) {
          TI.set(col.handle, "pen:" + p.id);
        }
      }

      const ctrl = pf.controller;
      if (ctrl) {
        ctrl.pens = zA;
        ctrl.outs = new Set();
        ctrl.striker = "player";
        if (window.PF_MULTIPLAYER && window.PF_MULTIPLAYER.state === 'OPEN') {
          ctrl.paused = true;
        } else {
          ctrl.phase = "player_aim";
          ctrl.phaseAt = performance.now();
          ctrl.paused = false;
        }
        if (ctrl.hud) ctrl.hud.showCue("your turn");
      }

      console.log(`Arena resized for ${numPlayers} players (Scale: ${S}x, Width: ${W.toFixed(2)}m, Depth: ${D.toFixed(2)}m)`);
      return { numPlayers, scale: S, width: W, depth: D };
    };

    function generateRoomCode() {
      const prefixes = ["BENCH", "CLASS", "DESK", "FIGHT", "DUEL", "ROYALE"];
      const p = prefixes[Math.floor(Math.random() * prefixes.length)];
      const num = Math.floor(1000 + Math.random() * 9000);
      return `${p}-${num}`;
    }

    function ensureChitCard() {
      let wrap = document.querySelector(".chitwrap");
      if (!wrap) {
        wrap = document.createElement("div");
        wrap.className = "chitwrap";
        document.body.appendChild(wrap);
      }
      let card = wrap.querySelector(".chit");
      if (!card) {
        card = document.createElement("div");
        card.className = "chit";
        wrap.appendChild(card);
      }
      if (!card._hasStopProp) {
        card._hasStopProp = true;
        card.addEventListener("click", (e) => {
          e.stopPropagation();
        });
      }
      return { wrap, card };
    }

    window.updatePlayerName = function(val) {
      const clean = (val || "").trim().toUpperCase().slice(0, 12);
      if (clean.length > 0) {
        localStorage.setItem("pf_name", clean);
        try {
          const col = JSON.parse(localStorage.getItem("pf_collection_v1") || "{}");
          col.name = clean;

    // =========================================================================
    // MULTIPLAYER MATCH REFEREE & ROUND SYNCHRONIZATION
    // =========================================================================
    window.PF_MULTIPLAYER_MATCH = {
      scores: {},
      round: 1,
      targetWins: 2,
      isRoundEnding: false,
      settleCooldownUntil: 0,
      outs: new Set(),

      reset: function() {
        this.scores = {};
        const count = window.roomPlayerCount || window.matchPlayerCount || 2;
        const ROSTER_KEYS = ["player", "rival", "bot3", "bot4", "bot5", "bot6", "bot7", "bot8"];
        for (let i = 0; i < count; i++) {
          this.scores[ROSTER_KEYS[i]] = 0;
        }
        this.round = 1;
        this.isRoundEnding = false;
        this.settleCooldownUntil = 0;
        this.outs.clear();
        window.updateLiveScoreboard();
      },

      checkOuts: function(forcedPOut = null, forcedROut = null) {
        if (!window.PF_MULTIPLAYER || window.PF_MULTIPLAYER.state !== 'OPEN') return;
        if (!window.__pf || !window.__pf.pens) return;
        const pf = window.__pf;
        const allPens = Object.keys(pf.pens);
        if (allPens.length === 0) return;

        const numPlayers = Math.max(2, Math.min(8, window.roomPlayerCount || window.matchPlayerCount || allPens.length));
        const S = 1.0 + (numPlayers - 2) * 0.125;
        const maxW = (0.46 * S) / 2 + 0.08;
        const maxD = (0.70 * S) / 2 + 0.08;

        // Guest reporting
        if (!window.PF_MULTIPLAYER.isHost) {
          if (!this.isRoundEnding && Date.now() >= this.settleCooldownUntil) {
            for (const penId of allPens) {
              if (this.outs.has(penId)) continue;
              const phys = pf.pens[penId];
              if (!phys || !phys.body) continue;
              const pos = phys.body.translation();
              const isOut = pos.y < -0.035 || Math.abs(pos.x) > maxW || Math.abs(pos.z) > maxD;
              if (isOut) {
                this.outs.add(penId);
                const allT = {};
                for (const [id, p] of Object.entries(pf.pens)) {
                  const t = p?.body?.translation(), r = p?.body?.rotation();
                  if (t && r) allT[id] = { p: [t.x, t.y, t.z], q: [r.x, r.y, r.z, r.w] };
                }
                window.PF_MULTIPLAYER.sendPenFallen(false, false, allT, penId);
              }
            }
          }
          return;
        }

        // Authoritative Host Referee
        if (this.isRoundEnding) return;
        if (Date.now() < this.settleCooldownUntil) return;

        let newlyOut = false;
        for (const penId of allPens) {
          if (this.outs.has(penId)) continue;
          const phys = pf.pens[penId];
          if (!phys || !phys.body) continue;
          const pos = phys.body.translation();
          const isOut = pos.y < -0.035 || Math.abs(pos.x) > maxW || Math.abs(pos.z) > maxD;
          if (isOut) {
            this.outs.add(penId);
            newlyOut = true;
            try {
              phys.body.setLinvel({ x: 0, y: 0, z: 0 }, true);
              phys.body.setAngvel({ x: 0, y: 0, z: 0 }, true);
            } catch(e) {}
            const fallenName = window.getPenDisplayName(penId);
            if (pf.controller && pf.controller.hud) {
              pf.controller.hud.showCue(`💥 ${fallenName} FELL OFF!`, "🚫");
            }
          }
        }

        const survivors = allPens.filter(id => !this.outs.has(id));

        // If 1 or 0 pens survive, round ends!
        if (survivors.length <= 1) {
          this.isRoundEnding = true;
          let winner = survivors.length === 1 ? survivors[0] : null;
          if (winner) {
            this.scores[winner] = (this.scores[winner] || 0) + 1;
          }

          const currentFinishedRound = this.round;
          let resultText = "⚖️ DRAW! ALL PENS FELL OFF!";
          if (winner) {
            const winnerName = window.getPenDisplayName(winner);
            resultText = `👑 ${winnerName} WON ROUND ${currentFinishedRound}!`;
          }

          if (pf.controller && pf.controller.hud) {
            pf.controller.hud.showResult(resultText, 2500);
          }

          const matchWinner = allPens.find(id => (this.scores[id] || 0) >= this.targetWins) || null;
          const nextRound = matchWinner ? currentFinishedRound : (currentFinishedRound + 1);

          // Select starting striker for next round (rotates in circle)
          const nextStriker = allPens[(nextRound - 1) % allPens.length];

          window.PF_MULTIPLAYER.sendReliable({
            type: 'ROUND_RESULT',
            scores: this.scores,
            finishedRound: currentFinishedRound,
            nextRound: nextRound,
            winner: winner,
            matchWinner: matchWinner,
            striker: nextStriker
          });

          this.round = nextRound;
          window.updateLiveScoreboard();

          if (matchWinner) {
            setTimeout(() => {
              const championName = window.getPenDisplayName(matchWinner);
              if (pf.controller && pf.controller.hud) {
                pf.controller.hud.showResult(`🏆 ${championName} WON THE BATTLE ROYALE!`, 3500);
              }
              setTimeout(() => {
                window.showGameOverModal(matchWinner, this.scores);
              }, 2200);
            }, 2000);
          } else {
            setTimeout(() => {
              this.startNextRoundAsHost(nextRound, nextStriker);
            }, 2200);
          }
        } else if (newlyOut) {
          // If a pen fell off but multiple remain, ensure turn points to an alive player
          const curStriker = window.PF_MULTIPLAYER.currentStriker;
          if (this.outs.has(curStriker)) {
            const curIdx = allPens.indexOf(curStriker);
            let nextS = curStriker;
            for (let s = 1; s <= allPens.length; s++) {
              const candidate = allPens[(curIdx + s) % allPens.length];
              if (!this.outs.has(candidate)) {
                nextS = candidate;
                break;
              }
            }
            window.PF_MULTIPLAYER.currentStriker = nextS;
            window.PF_NET.updateTurnCue();
          }
          window.updateLiveScoreboard();
        }
      },

      startNextRoundAsHost: function(nextRound, nextStriker) {
        if (!window.__pf) return;
        const pf = window.__pf;
        const allPens = Object.keys(pf.pens);
        const numPlayers = Math.max(2, Math.min(8, window.roomPlayerCount || window.matchPlayerCount || allPens.length));
        const S = 1.0 + (numPlayers - 2) * 0.125;
        const ROSTER_KEYS = ["player", "rival", "bot3", "bot4", "bot5", "bot6", "bot7", "bot8"];
        const pensPayload = {};

        this.outs.clear();

        for (let k = 0; k < numPlayers; k++) {
          const penKey = ROSTER_KEYS[k];
          const penPhys = pf.pens ? pf.pens[penKey] : null;
          if (!penPhys || !penPhys.body) continue;

          const spawn = window.calculatePenSpawn(k, numPlayers, S);
          const rad = (penPhys.spec && penPhys.spec.radius) || 0.008;
          const halfYaw = spawn.yaw / 2;
          const qy = Math.sin(halfYaw);
          const qw = Math.cos(halfYaw);

          penPhys.body.setTranslation({ x: spawn.x, y: rad + 0.002, z: spawn.z }, true);
          penPhys.body.setRotation({ x: 0, y: qy, z: 0, w: qw }, true);
          penPhys.body.setLinvel({ x: 0, y: 0, z: 0 }, true);
          penPhys.body.setAngvel({ x: 0, y: 0, z: 0 }, true);

          if (pf.visualPens && pf.visualPens[penKey] && pf.visualPens[penKey].root) {
            pf.visualPens[penKey].root.position.set(spawn.x, rad + 0.002, spawn.z);
            pf.visualPens[penKey].root.quaternion.set(0, qy, 0, qw);
          }

          pensPayload[penKey] = {
            p: [spawn.x, rad + 0.002, spawn.z],
            q: [0, qy, 0, qw]
          };
        }

        if (pf.physWorld && pf.physWorld.snapTransforms) {
          pf.physWorld.snapTransforms();
        }

        if (window.PF_MULTIPLAYER) {
          window.PF_MULTIPLAYER.currentStriker = nextStriker;
          window.PF_MULTIPLAYER.sendNewRound(nextRound, this.scores, nextStriker, pensPayload);
        }

        this.settleCooldownUntil = Date.now() + 1000;
        this.isRoundEnding = false;

        window.updateLiveScoreboard();
        window.PF_NET.updateTurnCue();

        if (pf.controller && pf.controller.hud) {
          const isMyTurn = window.PF_MULTIPLAYER ? window.PF_MULTIPLAYER.isMyTurn() : false;
          const starterLabel = isMyTurn ? "YOUR TURN" : `${window.getPenDisplayName(nextStriker)}'S TURN`;
          pf.controller.hud.showCue(`ROUND ${nextRound} • ${starterLabel}`);
        }
      }
    };

    // Step 2: Room Lobby with Generated Code, Link & Connected Players
    window.renderLobbySlotRows = function() {
      const container = document.querySelector(".connected-list");
      if (!container) return;
      const count = window.roomPlayerCount || 2;
      const mp = window.PF_MULTIPLAYER;
      const players = mp ? mp.players : [];
      const mySlot = mp ? mp.mySlot : 0;
      const hostName = (localStorage.getItem("pf_name") || "YOU").toUpperCase();

      let html = "";
      for (let i = 0; i < count; i++) {
        const isHost = i === 0;
        const isMe = (i === mySlot);
        const p = players.find(x => x.slot === i);
        const pName = p ? p.name : (isHost ? hostName : (isMe ? hostName : `Player ${i + 1} (Waiting...)`));
        const isReady = isHost || !!p;

        html += `
          <div class="connected-player-row ${isHost ? 'is-host' : ''} ${isMe ? 'is-me' : ''}" style="display:flex; justify-content:space-between; align-items:center; background:${isMe ? 'var(--pf-mustard-light, #fdf6e2)' : 'var(--pf-paper-light)'}; border:var(--pf-border-thin); border-radius:var(--pf-radius-sm); padding:6px 10px; margin-bottom:6px; box-shadow:1px 1px 0 var(--pf-ink);">

              <span class="c-avatar">${isHost ? "👑" : (isMe ? "🖊️" : "👤")}</span>
              <div class="c-details" style="display:flex; flex-direction:column; line-height:1.2;">
                <span class="c-name" id="slot-player-${i + 1}-name" style="font-weight:700; font-size:12px;">${pName} ${isMe ? '(YOU)' : ''}</span>
                <span class="c-role" style="font-size:9.5px; color:var(--pf-ink-muted);">${isHost ? "Room Leader (Host)" : `Player Slot ${i + 1}`}</span>

    window.copyRoomLink = function(url) {
      navigator.clipboard.writeText(url).then(() => {

    window.shareToWhatsApp = function(url, code) {
      const text = encodeURIComponent(`⚡ Join my Pen Fight match on the desk! Click here to play (Code: ${code}):\n${url}`);
      window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
    };

    window.startMatchWithTimer = function(fromRemote = false) {
      window._matchLaunched = false;
      matchPlayerCount = roomPlayerCount;
      matchMode = "friend";
      penSelectionSecondsRemaining = 8;

      if (!fromRemote && window.PF_NET && window.PF_NET.connected) {
        window.PF_NET.send({
          type: 'START_MATCH',
          pens: window.currentChosenPens,
          playerCount: roomPlayerCount
        });
      }

      if (penSelectionTimerInterval) {
        clearInterval(penSelectionTimerInterval);
      }

      window.showPreMatchPenSelection(roomPlayerCount, "friend");

      penSelectionTimerInterval = setInterval(() => {
        penSelectionSecondsRemaining--;
        const timerEl = document.getElementById("pen-timer-val");
        const timerBar = document.getElementById("pen-timer-bar-fill");
        
        if (timerEl) {
          timerEl.textContent = `${penSelectionSecondsRemaining}s`;
          if (penSelectionSecondsRemaining <= 3) {
            timerEl.style.color = "var(--pf-orange)";
          }
        }

        if (timerBar) {
          timerBar.style.width = `${(penSelectionSecondsRemaining / 8) * 100}%`;
        }

        if (penSelectionSecondsRemaining <= 0) {
          clearInterval(penSelectionTimerInterval);
          penSelectionTimerInterval = null;
          window.confirmAndLaunchMatch();
        }
      }, 1000);
    };

    window.confirmAndLaunchMatch = function(fromRemote = false) {
      if (window._matchLaunched) return;
      window._matchLaunched = true;
      if (penSelectionTimerInterval) {
        clearInterval(penSelectionTimerInterval);
        penSelectionTimerInterval = null;
      }
      if (!fromRemote && window.PF_NET && window.PF_NET.connected) {
        window.PF_NET.send({
          type: 'LAUNCH_MATCH',
          pens: window.currentChosenPens,
          playerCount: matchPlayerCount
        });
      }
      const chosenList = (window.currentChosenPens || []).slice(0, matchPlayerCount);
      
      if (window.setArenaPlayers) {
        window.setArenaPlayers(matchPlayerCount, chosenList);
      }

      if (window.PF_MULTIPLAYER && window.PF_MULTIPLAYER.state === 'OPEN') {
        window.PF_MULTIPLAYER.currentStriker = "player";
        if (window.PF_MULTIPLAYER_MATCH) window.PF_MULTIPLAYER_MATCH.reset();
        if (window.__pf && window.__pf.controller) {
          window.__pf.controller.paused = true;
        }
        window.PF_NET.updateTurnCue();
      } else if (window.PF_NET && window.PF_NET.connected) {
        window.PF_NET.currentStriker = "player";
        window.PF_NET.updateTurnCue();
      }

      window.showMatchExitButton();
      window.closeHubAndPlay();
      window.updateLiveScoreboard();
    };

    window.showPreMatchPenSelection = function(playerCount, mode = "solo") {
      matchPlayerCount = playerCount || window.roomPlayerCount || 2;
      matchMode = mode;

      const card = document.querySelector(".chit");
      if (!card) return;

      const isMulti = window.PF_MULTIPLAYER && window.PF_MULTIPLAYER.state === 'OPEN';
      const isHost = window.PF_MULTIPLAYER ? window.PF_MULTIPLAYER.isHost : true;
      const mySlot = window.PF_MULTIPLAYER ? window.PF_MULTIPLAYER.mySlot : (isHost ? 0 : 1);
      const localName = (localStorage.getItem("pf_name") || (isHost ? "Host" : "Player")).toUpperCase();

      let slotsHtml = "";
      for (let i = 0; i < matchPlayerCount; i++) {
        const penId = (window.currentChosenPens && window.currentChosenPens[i]) || ALL_12_PENS[i % ALL_12_PENS.length].id;
        const penObj = ALL_12_PENS.find(p => p.id === penId) || ALL_12_PENS[0];
        
        const isMySlot = !isMulti || (i === mySlot);
        let slotBadge = `PLAYER ${i + 1}`;
        if (isMulti) {
          const p = window.PF_MULTIPLAYER.players.find(x => x.slot === i);
          if (p && p.name) {
            slotBadge = (i === mySlot) ? `${p.name.toUpperCase()} (YOU)` : p.name.toUpperCase();
          } else {
            slotBadge = (i === mySlot) ? `${localName} (YOU)` : `PLAYER ${i + 1}`;
          }
        } else {
          slotBadge = (i === 0) ? `${localName} (YOU)` : `BOT ${i} (AI)`;
        }

        const clickAttr = isMySlot ? `onclick="window.openPenPickerModal(${i})"` : `style="opacity:0.85; cursor:not-allowed;" title="Opponent selects their own pen"`;
        const actionText = isMySlot ? "Click to change ❯" : "🔒 Chosen by Player";

        slotsHtml += `
          <div class="player-pen-slot ${isMySlot ? 'my-pen-slot' : 'opponent-pen-slot'}">
            <div class="slot-header">
              <span class="slot-badge">${slotBadge}</span>
              <span class="slot-sub">${penObj.trait}</span>
            </div>
            <div class="slot-content" ${clickAttr}>
              <img class="slot-pen-img" src="${penObj.img}" alt="${penObj.name}" draggable="false" />
              <div class="slot-pen-info">
                <span class="slot-pen-name">${penObj.name}</span>
                <span class="slot-pen-change">${actionText}</span>
              </div>
            </div>
          </div>
        `;
      }

      card.innerHTML = `
        <div class="arcade-hub pen-selection-hub">
          <div class="hub-header">
            <button type="button" class="hub-back-btn" onclick="if(penSelectionTimerInterval){clearInterval(penSelectionTimerInterval); penSelectionTimerInterval=null;} window.showFriendSetup()">← BACK</button>
            <div class="hub-badge">⚡ CHOOSE YOUR PEN (${matchPlayerCount} PLAYERS) ⚡</div>
            <button type="button" class="hub-random-btn" onclick="window.randomizeMatchPens()">🎲 RANDOM</button>
          </div>

          <div class="pen-selection-body">
            <div class="timer-countdown-box">
              <div class="timer-meta">
                <span class="timer-label">⏱️ SELECT YOUR PEN:</span>
                <span class="timer-number" id="pen-timer-val">${penSelectionSecondsRemaining}s</span>
              </div>
              <div class="timer-bar-track">
                <div class="timer-bar-fill" id="pen-timer-bar-fill" style="width: ${(penSelectionSecondsRemaining / 8) * 100}%;"></div>
              </div>
            </div>

            <div class="player-slots-grid count-${matchPlayerCount}">
              ${slotsHtml}
            </div>

            <div class="selection-footer">
              <button type="button" class="hub-action-btn btn-start-battle" onclick="if(penSelectionTimerInterval){clearInterval(penSelectionTimerInterval); penSelectionTimerInterval=null;} window.confirmAndLaunchMatch()">
                🚀 ENTER ARENA NOW
              </button>
            </div>
          </div>
        </div>
      `;
    };

    window.openPenPickerModal = function(slotIndex) {
      const isMulti = window.PF_MULTIPLAYER && window.PF_MULTIPLAYER.state === 'OPEN';
      const isHost = window.PF_MULTIPLAYER ? window.PF_MULTIPLAYER.isHost : true;
      if (isMulti) {
        const allowedSlot = isHost ? 0 : 1;
        if (slotIndex !== allowedSlot) {
          return; // Prevent clicking opponent's slot
        }
      }
      selectingForSlot = slotIndex;
      const modal = document.getElementById("inline-pen-picker");
      const title = document.getElementById("picker-target-title");
      const list = document.getElementById("picker-pens-list");
      if (!modal || !list) return;

      if (title) title.textContent = `CHOOSE YOUR PEN`;

      list.innerHTML = ALL_12_PENS.map(p => `
        <div class="picker-item" onclick="window.selectPenForSlot('${p.id}')">
          <img src="${p.img}" class="picker-item-img" alt="${p.name}" />
          <div class="picker-item-info">
            <span class="picker-item-name">${p.name}</span>
          </div>
        </div>
      `).join("");

      modal.classList.add("open");
    };

    window.closePenPickerModal = function() {
      const modal = document.getElementById("inline-pen-picker");
      if (modal) modal.classList.remove("open");
      selectingForSlot = null;
    };

    window.selectPenForSlot = function(penId) {
      if (selectingForSlot !== null) {
        if (!window.currentChosenPens || !Array.isArray(window.currentChosenPens)) {
          window.currentChosenPens = ["gripper", "pilotV5", "reynolds-trimax", "reynolds045", "parker", "megatop", "addgel", "classmate-octane"];
        }
        window.currentChosenPens[selectingForSlot] = penId;
        const myName = (localStorage.getItem("pf_name") || "YOU").toUpperCase();
        if (selectingForSlot === 0 || (window.PF_MULTIPLAYER && !window.PF_MULTIPLAYER.isHost && selectingForSlot === 1)) {
          setEquippedPenId(penId);
        }
        if (window.PF_NET && window.PF_NET.connected) {
          window.PF_NET.send({
            type: 'PEN_UPDATE',
            slot: selectingForSlot,
            pen: penId,
            penId: penId,
            name: myName
          });
        }
      }
      window.closePenPickerModal();
      window.showPreMatchPenSelection(matchPlayerCount, matchMode);
    };

    window.randomizeMatchPens = function() {
      const shuffled = [...ALL_12_PENS].sort(() => 0.5 - Math.random());
      if (!window.currentChosenPens || !Array.isArray(window.currentChosenPens)) {
        window.currentChosenPens = ["gripper", "pilotV5", "reynolds-trimax", "reynolds045", "parker", "megatop", "addgel", "classmate-octane"];
      }
      for (let i = 0; i < matchPlayerCount; i++) {
        window.currentChosenPens[i] = shuffled[i % shuffled.length].id;
        if (window.PF_NET && window.PF_NET.connected) {
          window.PF_NET.send({
            type: 'PEN_UPDATE',
            slot: i,
            pen: window.currentChosenPens[i],
            penId: window.currentChosenPens[i]
          });
        }
      }
      window.showPreMatchPenSelection(matchPlayerCount, matchMode);
    };

    window.closeHubAndPlay = function() {
      const wrap = document.querySelector(".chitwrap");
      if (wrap) {
        wrap.classList.remove("show");
        wrap.setAttribute("inert", "");
        wrap.setAttribute("aria-hidden", "true");
      }
      const diarywrap = document.querySelector(".diarywrap");
      if (diarywrap) {
        diarywrap.classList.remove("show");
        diarywrap.setAttribute("inert", "");
        diarywrap.setAttribute("aria-hidden", "true");
      }
      if (window.__pf && window.__pf.controller) {
        if (window.PF_MULTIPLAYER && window.PF_MULTIPLAYER.state === 'OPEN') {
          window.__pf.controller.paused = true;
        } else {
          const eqPen = getEquippedPenId();
          if (window.currentChosenPens) {
            window.currentChosenPens[0] = eqPen;
          }
          if (window.setArenaPlayers && (!window.__pf.pens || !window.__pf.pens["player"] || window.__pf.pens["player"].spec?.id !== eqPen)) {
            window.setArenaPlayers(window.matchPlayerCount || 2, window.currentChosenPens);
          }
          window.__pf.controller.paused = false;
          window.__pf.controller.phase = "player_aim";
        }
      }
      window.showMatchExitButton();
      window.updateLiveScoreboard();
      if (window.updateArenaCamera) window.updateArenaCamera();
    };

    // Live Scoreboard Sync Logic
    window.updateLiveScoreboard = function() {
      const sb = document.getElementById("pf-live-scoreboard");
      if (!sb) return;

      const pf = window.__pf;
      const ctrl = pf ? pf.controller : null;
      const isMulti = window.PF_MULTIPLAYER && window.PF_MULTIPLAYER.state === 'OPEN';
      const numPlayers = Math.max(2, Math.min(8, window.roomPlayerCount || window.matchPlayerCount || (pf && pf.pens ? Object.keys(pf.pens).length : 2)));
      const ROSTER_KEYS = ["player", "rival", "bot3", "bot4", "bot5", "bot6", "bot7", "bot8"];

      // For 2 players: classic duel scoreboard
      if (numPlayers === 2) {
        let p1Name, p1PenId, p2Name, p2PenId, p1Wins, p2Wins, roundNum;

        if (isMulti) {
          const mp = window.PF_MULTIPLAYER;
          const mm = window.PF_MULTIPLAYER_MATCH;
          const localName = (localStorage.getItem("pf_name") || "YOU").toUpperCase();
          const remoteName = (mp.remoteName || "OPPONENT").toUpperCase();

          if (mp.isHost) {
            p1Name = localName;
            p1PenId = (window.currentChosenPens && window.currentChosenPens[0]) ? window.currentChosenPens[0] : getEquippedPenId();
            p2Name = remoteName;
            p2PenId = (window.currentChosenPens && window.currentChosenPens[1]) ? window.currentChosenPens[1] : "pilotV5";
          } else {
            p1Name = remoteName;
            p1PenId = (window.currentChosenPens && window.currentChosenPens[0]) ? window.currentChosenPens[0] : "gripper";
            p2Name = localName;
            p2PenId = (window.currentChosenPens && window.currentChosenPens[1]) ? window.currentChosenPens[1] : getEquippedPenId();
          }
          p1Wins = mm ? (mm.scores.player || 0) : 0;
          p2Wins = mm ? (mm.scores.rival || 0) : 0;
          roundNum = mm ? mm.round : 1;
        } else {
          p1Name = (localStorage.getItem("pf_name") || "YOU").toUpperCase();
          p1PenId = (window.currentChosenPens && window.currentChosenPens[0]) ? window.currentChosenPens[0] : getEquippedPenId();
          p2Name = (ctrl && ctrl.rivalName ? ctrl.rivalName : "BUNTY").toUpperCase();
          p2PenId = (window.currentChosenPens && window.currentChosenPens[1]) ? window.currentChosenPens[1] : "pilotV5";
          p1Wins = ctrl && ctrl.wins ? (ctrl.wins.player || 0) : 0;
          p2Wins = ctrl && ctrl.wins ? (ctrl.wins.rival || ctrl.wins.bots || 0) : 0;
          roundNum = p1Wins + p2Wins + 1;
        }

        const p1PenObj = ALL_12_PENS.find(p => p.id === p1PenId) || ALL_12_PENS[0];
        const p2PenObj = ALL_12_PENS.find(p => p.id === p2PenId) || ALL_12_PENS[1];

        const p1NameEl = document.getElementById("score-p1-name");
        const p1PenEl = document.getElementById("score-p1-pen");
        const p1ImgEl = document.getElementById("score-p1-img");
        if (p1NameEl) p1NameEl.textContent = p1Name;
        if (p1PenEl) p1PenEl.textContent = p1PenObj.short;
        if (p1ImgEl && p1ImgEl.getAttribute("src") !== p1PenObj.img) p1ImgEl.src = p1PenObj.img;

        const p2NameEl = document.getElementById("score-p2-name");
        const p2PenEl = document.getElementById("score-p2-pen");
        const p2ImgEl = document.getElementById("score-p2-img");
        if (p2NameEl) p2NameEl.textContent = p2Name;
        if (p2PenEl) p2PenEl.textContent = p2PenObj.short;
        if (p2ImgEl && p2ImgEl.getAttribute("src") !== p2PenObj.img) p2ImgEl.src = p2PenObj.img;

        const roundText = document.getElementById("score-round-text");
        if (roundText) roundText.textContent = `ROUND ${roundNum}`;

        const renderPips = (elId, wins, target = 2) => {
          const el = document.getElementById(elId);
          if (!el) return;
          let html = "";
          for (let i = 0; i < target; i++) {
            html += `<span class="score-pip ${i < wins ? 'pip-win' : ''}"></span>`;
          }
          if (el.innerHTML !== html) el.innerHTML = html;
        };

        renderPips("score-p1-dots", p1Wins, 2);
        renderPips("score-p2-dots", p2Wins, 2);
        return;
      }

      // Multi-Player Scoreboard (3 to 8 Players Battle Royale)
      const mm = window.PF_MULTIPLAYER_MATCH;
      const roundNum = mm ? mm.round : 1;
      const currentStriker = window.PF_MULTIPLAYER ? window.PF_MULTIPLAYER.currentStriker : "player";

      let chipsHtml = "";
      for (let k = 0; k < numPlayers; k++) {
        const penKey = ROSTER_KEYS[k];
        const penId = (window.currentChosenPens && window.currentChosenPens[k]) || ALL_12_PENS[k % ALL_12_PENS.length].id;
        const penObj = ALL_12_PENS.find(p => p.id === penId) || ALL_12_PENS[0];
        const pName = window.getPenDisplayName(penKey);
        const wins = mm && mm.scores ? (mm.scores[penKey] || 0) : 0;
        const isOut = mm && mm.outs ? mm.outs.has(penKey) : false;
        const isTurn = (currentStriker === penKey);

        chipsHtml += `
          <div class="multi-score-chip ${isTurn ? 'is-turn' : ''} ${isOut ? 'is-out' : ''}" style="display:flex; align-items:center; gap:5px; background:${isTurn ? 'var(--pf-mustard-light, #fdf6e2)' : (isOut ? '#f1f1f1' : 'var(--pf-paper, #fff)')}; border:${isTurn ? '2px solid var(--pf-orange)' : '1px solid var(--pf-ink)'}; border-radius:14px; padding:3px 8px; opacity:${isOut ? '0.45' : '1'}; box-shadow:1.5px 1.5px 0 var(--pf-ink);">
            <img src="${penObj.img}" alt="${penObj.name}" style="width:20px; height:20px; object-fit:contain;" />
            <div style="display:flex; flex-direction:column; line-height:1;">
              <span style="font-size:10px; font-weight:800; color:${isOut ? '#888' : 'var(--pf-ink)'}">${pName}</span>
              <span style="font-size:8.5px; color:var(--pf-orange); font-weight:700;">${isOut ? 'OUT' : '★ ' + wins}</span>
            </div>
          </div>
        `;
      }

      sb.innerHTML = `
        <div style="display:flex; align-items:center; gap:8px; overflow-x:auto; max-width:90vw; padding:4px 6px;">
          <span style="font-family:var(--pf-font-display); font-size:13px; background:var(--pf-mustard); border:1px solid var(--pf-ink); border-radius:12px; padding:3px 8px; white-space:nowrap;">R${roundNum}</span>
          ${chipsHtml}
          <button type="button" class="pf-score-exit-btn" id="pf-score-exit-btn" onclick="window.exitMatchToMainMenu()" title="Exit Match" style="padding:4px 8px; font-size:10px;">
            🚪 EXIT
          </button>
        </div>
      `;
    };

    window.setInterval(window.updateLiveScoreboard, 300);

    window.updateVoiceHUD = function() {
      const hud = document.getElementById("pf-voice-hud");
      const isMulti = window.PF_MULTIPLAYER && (window.PF_MULTIPLAYER.state === 'OPEN' || window.PF_MULTIPLAYER.state === 'CONNECTING');
      if (hud) {
        hud.style.display = isMulti ? "flex" : "none";
      }
      if (!window.PF_MULTIPLAYER) return;

      const vState = window.PF_MULTIPLAYER.getVoiceState();
      const micBtn = document.getElementById("pf-voice-mic-btn");
      const micIcon = document.getElementById("pf-mic-icon");
      const micLabel = document.getElementById("pf-mic-label");
      
      const spkBtn = document.getElementById("pf-voice-speaker-btn");
      const spkIcon = document.getElementById("pf-speaker-icon");
      const spkLabel = document.getElementById("pf-speaker-label");

      if (micBtn && micIcon && micLabel) {
        if (vState.micMuted) {
          micBtn.className = "voice-btn mic-muted";
          micIcon.textContent = "🔇";
          micLabel.textContent = "MIC OFF";
        } else {
          micBtn.className = `voice-btn mic-active ${vState.speakingLocal ? 'is-speaking' : ''}`;
          micIcon.textContent = "🎙️";
          micLabel.textContent = "MIC ON";
        }
      }

      if (spkBtn && spkIcon && spkLabel) {
        if (vState.speakerMuted) {
          spkBtn.className = "voice-btn speaker-muted";
          spkIcon.textContent = "🔈";
          spkLabel.textContent = "DEAFENED";
        } else {
          spkBtn.className = "voice-btn speaker-active";
          spkIcon.textContent = "🔊";
          spkLabel.textContent = "SOUND ON";
        }
      }
    };

    if (window.PF_MULTIPLAYER) {
      window.PF_MULTIPLAYER.on('voiceStateChanged', () => window.updateVoiceHUD());
      window.PF_MULTIPLAYER.on('voiceSpeaking', (data) => {
        const micBtn = document.getElementById("pf-voice-mic-btn");
        if (data.who === 'local' && micBtn && !window.PF_MULTIPLAYER.isMicMuted) {
          micBtn.classList.toggle('is-speaking', data.speaking);
        }
      });
      window.PF_MULTIPLAYER.on('stateChange', () => window.updateVoiceHUD());
    }

    // Unlock WebRTC remote audio playback on mobile devices (iOS Safari / Chrome) on first interaction
    function unlockMobileVoiceAudio() {
      const audioEl = document.getElementById('pf-remote-voice-audio');
      if (audioEl && audioEl.srcObject && audioEl.paused) {
        audioEl.play().catch(() => {});
      }
    }
    document.addEventListener('touchstart', unlockMobileVoiceAudio, { passive: true });
    document.addEventListener('click', unlockMobileVoiceAudio, { passive: true });

    // Responsive Camera FOV for Mobile Portrait & Landscape
    window.updateResponsiveCameraFOV = function() {
      if (window.__pf && window.__pf.camera) {
        const cam = window.__pf.camera;
        const w = window.innerWidth || 800;
        const h = window.innerHeight || 600;
        const aspect = w / h;
        cam.aspect = aspect;
        cam.fov = aspect < 1.05 ? Math.min(100, Math.max(52, 2 * Math.atan(0.5121 / aspect) * (180 / Math.PI))) : 52;
        cam.updateProjectionMatrix();
      }
    };
    window.addEventListener("resize", window.updateResponsiveCameraFOV);
    window.addEventListener("orientationchange", () => setTimeout(window.updateResponsiveCameraFOV, 100));
    
    // =========================================================================
    // REMOVE ALL BACKGROUND CLASSROOM DESKS & FURNITURE
    // =========================================================================
    window.cleanBackgroundFurniture = function() {
      if (!window.__pf || !window.__pf.scene) return;
      const scene = window.__pf.scene;
      
      scene.traverse(o => {
        // Keep primary table, pens, and lighting
        if (o === scene || o.type === 'AmbientLight' || o.type === 'DirectionalLight' || o.type === 'PointLight') return;
        if (o.name === 'arena-table' || o.name === 'classroom-root' || o.name === 'desk') return;
        if (o.userData && (o.userData.isTable || o.userData.isPen || o.userData.isStriker)) return;
        
        // Hide/remove background classroom props
        if (o.name && (o.name.includes('chair') || o.name.includes('desk_') || o.name.includes('bench') || o.name.includes('chalkboard') || o.name.includes('wall') || o.name.includes('door'))) {
          o.visible = false;
        }
      });
    };

    window.addEventListener("DOMContentLoaded", () => {
      window.hideMatchExitButton();

      // Ensure equipped pen is active on boot
      const initialPen = getEquippedPenId();
      if (window.currentChosenPens) {
        window.currentChosenPens[0] = initialPen;
      }

      window.updateLiveScoreboard();
      setTimeout(window.cleanBackgroundFurniture, 500);
      setTimeout(window.cleanBackgroundFurniture, 1500);
      setTimeout(window.cleanBackgroundFurniture, 3000);
      
      // Auto-diagnose and sync 3D scene
      setTimeout(() => {
        if (window.__pf && window.__pf.scene) {
          if (window.setArenaPlayers && (!window.__pf.pens || !window.__pf.pens["player"] || window.__pf.pens["player"].spec?.id !== initialPen)) {
            window.setArenaPlayers(2, window.currentChosenPens);
          }
          let visibleCount = 0, totalCount = 0;
          window.__pf.scene.traverse(o => {
            if (o.isMesh) {
              totalCount++;
              if (o.visible) visibleCount++;
            }
          });
          console.log(`[PF SCENE DIAGNOSTIC] Total meshes: ${totalCount}, Visible meshes: ${visibleCount}`);
        }
      }, 1200);

      const params = new URLSearchParams(window.location.search);
      if (params.get("testplay") === "1") {
        setTimeout(() => {
          if (window.closeHubAndPlay) window.closeHubAndPlay();
        }, 800);
        return;
      }
      const roomParam = params.get("room") || params.get("duel");
      if (roomParam) {
        currentRoomCode = roomParam.toUpperCase();
        window.joinRoomWithCode(currentRoomCode);
      } else if (params.get("setup") === "multi") {
        setTimeout(() => {
          if (window.showFriendSetup) window.showFriendSetup();
        }, 400);
      } else {
        setTimeout(() => {
          if (window.renderArcadeHub) window.renderArcadeHub();
        }, 400);
      }
    });
  </script>

  <!-- Exit Match Confirmation Modal -->
  <div id="pf-exit-confirm-modal" class="exit-modal-overlay" style="display:none;">
    <div class="exit-confirm-card">
      <div class="exit-modal-badge">⚠️ LEAVE MATCH</div>
      <h3 class="exit-modal-title">LEAVE THIS MATCH?</h3>
      <p class="exit-modal-desc">Return to main menu?</p>
      <div class="exit-modal-btn-row">
        <button type="button" class="btn-cancel-exit" onclick="window.closeExitConfirmModal()">
          ▶ KEEP PLAYING
        </button>
        <button type="button" class="btn-confirm-exit" onclick="window.confirmExitAndLeaveMatch()">
          ✕ YES, EXIT
        </button>
      </div>
    </div>
  </div>

</body>
</html>
