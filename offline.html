  <style>
    /* One handwriting hand on every device: iOS shipped Chalkboard, Android
       shipped a random cursive. Patrick Hand (OFL) is bundled and wins. */
    @font-face {
      font-family: 'Patrick Hand';
      src: url('/assets/fonts/patrick-hand.woff2') format('woff2');
      font-display: swap;
    }
    /* Only two things in this world are printed: the brand mark and the
       rubber stamps. Everything else is written by hand, upright, in block
       capitals, the way a kid writes with a fine marker. */
    @font-face {
      font-family: 'Anton';
      src: url('/assets/fonts/anton.woff2') format('woff2');
      font-display: swap;
    }
    :root {
      --ink: #24428f;
      --ink-2: rgba(36, 66, 143, 0.66);
      --ink-3: rgba(36, 66, 143, 0.32);
      --red: #bf3b2b;
      --paper: #e9e2cf;
      --paper-hi: #f4efe0;
      --tin: #c4691a;
      /* Two faces. That is the whole system.
         printed: the brand mark and the rubber stamps, nothing else */
      --stamp: 'Anton', 'Arial Narrow', sans-serif;
      /* written: one hand, every size, everything else on the sheet */
      --hand: 'Patrick Hand', cursive;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #565049;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #app { position: fixed; inset: 0; }
    .pf-gl-host { position: absolute; inset: 0; z-index: 0; background: transparent; }
    .pf-clarity-desk {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      z-index: 0;
    }
    canvas { display: block; touch-action: none; }
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse 78% 72% at 50% 56%, transparent 52%, rgba(26, 20, 14, 0.42) 100%);
      z-index: 4;
    }
    .coach {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom));
      left: 0; right: 0;
      text-align: center;
      font-family: "Patrick Hand", "Chalkboard SE", "Segoe Print", cursive;
      color: rgba(240, 234, 220, 0.75);
      font-size: 15px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.35);
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.5s;
      z-index: 5;
    }
    .coach.hidden { opacity: 0; }
    /* Sits on the desk itself, centred on where the desk actually is. */
    /* Whose turn it is is a toast, not a caption. It used to sit on the
       middle of the desk for three seconds, which is exactly where the
       pens are and exactly when you are looking at them. It now lands
       above the play, says its line, and gets out. */
    /* ---- The passed chit ----
       Everything in this game that has something to say says it on paper:
       the rules, the stakes, the verdict, the ranking. The two in-play
       messages were the exception, floating over the desk as tinted
       lozenges of text, and they read as a games HUD bolted onto a
       classroom. They were also barely legible, which is the same fault
       seen from the other side: pale letters over a lit wooden desk have
       nothing behind them to sit on.
       So they become the object they were always describing. A scrap torn
       off the same pad every other sheet comes from, scribbled on and
       pushed across the desk, which is exactly how a message reached you
       in a class you were not allowed to talk in. Same cream, same tear,
       same blue rule to write on, same ink. */
    .slip {
      position: fixed;
      left: 50%;
      max-width: min(80vw, 340px);
      padding: 9px 16px 11px;
      color: var(--ink);
      font-family: var(--hand);
      font-size: clamp(15px, 4vw, 18px);
      /* Writing wraps; it never gets cut off. A scrap beside the desk on
         a laptop has a narrow column to live in, and an ellipsis there
         would hide the half of the sentence that says what is going on.
         Two short lines of handwriting is what a real note looks like
         anyway. */
      line-height: 20px;
      white-space: normal;
      overflow-wrap: break-word;
      background-color: var(--paper);
      /* The grain of the pad, and the ruled lines the writing sits on,
         pitched to the line height so the words always land on a rule
         whether there is one line of them or three. */
      background-image:
        var(--paper-tex, none),
        repeating-linear-gradient(transparent 0 19px, rgba(96, 126, 190, 0.34) 19px 20px);
      background-size: 180px 180px, auto;
      background-position: 0 0, 0 9px;
      background-repeat: repeat, repeat;
      /* Lying on the desk rather than hovering above it: a tight contact
         shadow under the near edge, a soft one further out. */
      box-shadow: 0 2px 3px rgba(20, 12, 4, 0.4), 0 9px 20px rgba(20, 12, 4, 0.45);
      /* Torn top and bottom, the same tear as the full sheet with fewer
         and shallower teeth, because it is a smaller piece of the same
         page rather than a different kind of paper. */
      clip-path: polygon(
        0 4px, 12% 0, 25% 5px, 38% 1px, 50% 5px, 62% 0, 75% 5px, 88% 1px, 100% 4px,
        100% calc(100% - 4px), 88% 100%, 75% calc(100% - 5px), 62% calc(100% - 1px),
        50% calc(100% - 5px), 38% 100%, 25% calc(100% - 5px), 12% calc(100% - 1px),
        0 calc(100% - 4px)
      );
      pointer-events: none;
      opacity: 0;
      z-index: 5;
      transition: opacity 0.18s ease, transform 0.24s cubic-bezier(0.2, 1.1, 0.4, 1);
      /* Driven by variables so the slot rules below can change how a note
         is anchored without every one of them restating the whole
         transform. Centre-hung by default; the gutters turn that off,
         because a fixed box positioned by `left` can only ever be as wide
         as the distance from that point to the edge of the screen, and
         half a narrow gutter is not enough to write a sentence in. */
      --slip-x: -50%;
      --slip-rot: 0deg;
      --slip-scale: 1;
      --slip-y: 0px;
      transform: translate(var(--slip-x), calc(var(--slip-y) + 6px)) rotate(var(--slip-rot)) scale(var(--slip-scale));
    }
    /* Nothing lands square on a desk. */
    .slip.show {
      opacity: 1;
      transform: translate(var(--slip-x), var(--slip-y)) rotate(var(--slip-rot)) scale(var(--slip-scale));
    }

    /* The doodle beside the words. A kid writing a chit in a hurry draws
       the thing rather than spelling it, so it is tipped off true and set
       a little below the line, the way something scrawled in beside
       finished writing sits. */
    .slip .doodle {
      font-style: normal;
      display: inline-block;
      margin-right: 7px;
      font-size: 0.92em;
      transform: rotate(-7deg) translateY(1px);
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    }

    /* What is happening that is not the turn: they have gone quiet, the
       line is down, somebody tried to join. It sits just above the turn,
       so every word this game says mid-match comes from one place near
       the player's own hands instead of from three corners of the screen. */
    .cue { --slip-rot: 1.1deg; font-size: clamp(14px, 3.6vw, 16px); }

    /* ---- Where the two scraps lie ----
       Never on the wood. The slot is picked in hud.ts from the desk's
       measured corners; each rule below is one of the places there was
       actually room. In every one of them the turn sits nearer the
       player than the status does, because it is the one being answered.
       --desk-* are set per refit, so this follows a resize instead of
       going stale the way anything pinned to the viewport would. */

    /* Portrait with room under the near edge, and the ideal: a chit
       pushed across the desk stops just short of your side of it. */
    body[data-slips="below"] .turnline { left: var(--desk-mid); top: calc(var(--desk-near) + 54px); }
    /* Hung from its underside, not its top. The status note always sits
       above the turn, so when a long message wraps it has to grow away
       from its neighbour rather than down on top of it. Anchored by top
       plus a -100% hang rather than by bottom: a bottom offset needs
       100vh to convert the measurement, and 100vh on a phone is taller
       than the screen whenever a browser bar is showing. */
    body[data-slips="below"] .cue {
      left: var(--desk-mid);
      top: calc(var(--desk-near) + 48px);
      --slip-y: -100%;
    }

    /* Landscape. The desk is a slab down the middle with floor either
       side, so the notes lie on the floor beside your own end of it,
       stacked up from the bottom and clear of the wood entirely. */
    body[data-slips="right"] .turnline,
    body[data-slips="right"] .cue {
      --slip-x: 0px;
      left: auto; right: 13px; max-width: var(--gut-right-w);
    }
    body[data-slips="left"] .turnline,
    body[data-slips="left"] .cue {
      --slip-x: 0px;
      left: 13px; right: auto; max-width: var(--gut-left-w);
    }
    /* Gaps sized for a note that has wrapped to two lines, so a long one
       grows upward into space rather than into the note above it. */
    body[data-slips="right"] .turnline { bottom: max(18px, env(safe-area-inset-bottom)); }
    body[data-slips="right"] .cue { bottom: calc(max(18px, env(safe-area-inset-bottom)) + 84px); }
    /* The pen chip already owns the bottom-left corner. */
    body[data-slips="left"] .turnline { bottom: calc(max(18px, env(safe-area-inset-bottom)) + 46px); }
    body[data-slips="left"] .cue { bottom: calc(max(18px, env(safe-area-inset-bottom)) + 130px); }

    /* Nothing free at your end at all. The wall above the far edge is the
       one place left, and since that is the other player's side of the
       desk it is at least the right wall for news about them. */
    body[data-slips="far"] .turnline,
    body[data-slips="far"] .cue {
      left: var(--desk-mid);
      top: var(--band-mid); bottom: auto;
      /* Hung from its middle, so it sits centred in the band whatever
         height it grows to rather than drifting down out of it. */
      --slip-y: -50%;
    }
    /* While the reaction row is up (a duel or a group match), it holds
       the top of the band, hung from the board. The notes give up the
       middle of the band and lie just above the far edge of the desk
       instead: row under the chalk, note over the wood, and the two can
       never meet the score however short the band gets. */
    body.reactrow[data-slips="far"] .turnline,
    body.reactrow[data-slips="far"] .cue {
      top: calc(var(--desk-far, 60%) - 6px);
      /* Hung from its underside, so a note that wraps grows up into the
         band rather than down onto the desk. */
      --slip-y: -100%;
    }
    /* The status is the one that turns up rarely and matters when it
       does, so it takes the strip and the turn stands down while it is
       there. The cue is created before the turn line, which is what lets
       one hide the other without either of them knowing about it. */
    body.slips-one .cue.show ~ .turnline { opacity: 0; }
    /* Whose turn it is, for as long as that is true.
       Low and centred, just off the near edge of the desk: that is where
       a player is already looking when they reach for their own pen, and
       it is the half of the screen the eye actually lives in during a
       match. The top belongs to things that interrupt. It clears the pen
       chip in the bottom-left corner and never takes a touch. */
    /* ---- The back page ----
       One line per person, said the way the result sheet says it: you,
       the score, them, with whoever is ahead circled in red. The circle
       is already this game's mark for who came out on top, so the page
       needs no legend and no key.
       The version before this drew a rope with the knot at the score and
       put the digits small at either end, which hid the one fact anybody
       came for inside an abstraction nobody asked for. */
    .chit .rivals { list-style: none; margin: 6px 0 2px; padding: 0; }
    .chit .rival { padding: 11px 0 10px; border-bottom: 1px dashed rgba(96, 126, 190, 0.3); }
    .chit .rival:last-child { border-bottom: 0; }
    .chit .score {
      display: flex; align-items: baseline; gap: 7px;
      margin: 0; font-family: var(--hand);
    }
    /* The two numbers are the line. Everything else on it is a label. */
    .chit .score b {
      position: relative;
      font-weight: 400; font-size: 23px; color: var(--ink-2);
      padding: 0 2px;
    }
    /* A circled number needs room for its ring, or it collides with the
       dash on one side and the name on the other. */
    .chit .score .lead { color: var(--ink); margin: 0 6px; }
    /* The same hand-drawn ring the result sheet puts round a winner. */
    .chit .score .lead::after {
      content: '';
      position: absolute;
      inset: -5px -7px -4px -7px;
      border: 2px solid var(--red);
      border-radius: 52% 48% 50% 52% / 58% 55% 45% 42%;
      transform: rotate(-3deg);
    }
    .chit .score .dash { font-style: normal; color: var(--ink-3); font-size: 17px; }
    .chit .score .sname { font-size: 16px; color: var(--ink-2); }
    .chit .score .sname.them { color: var(--ink); }
    /* How warm the grudge is, pushed to the end of the line where it can
       be skipped by anybody who does not care. */
    .chit .score .rivalwhen {
      margin-left: auto; font-style: normal;
      font-size: 12px; color: var(--ink-3); white-space: nowrap;
    }
    .chit .rivalnote {
      display: block; margin-top: 4px;
      font-style: normal; font-family: var(--hand);
      font-size: 14px; color: var(--ink-3);
    }
    .chit .rivalnote.owed { color: #b2432f; }
    .chit .rivalnote.hot { color: var(--ink); }
    /* The example on an empty page: plainly not real, plainly the shape
       of what is coming. */
    .chit .rivals.ghost { opacity: 0.38; margin: 10px 0 12px; }
    .chit .rivals.ghost .rival { border-bottom: 0; padding: 0; }
    .chit .rivals.ghost .score { justify-content: center; }
    .chit .boardnote { margin-top: 12px; font-size: 13px; text-align: center; }

    /* ---- The diary: the one surface that is yours and is kept ----
       Everything else in this game arrives on a torn chit and is thrown
       away. This is bound: stitched at the spine, printed rather than
       written, with the pages stacked under it. That difference is the
       hierarchy, and it has to read before a single word does.

       Printed things are grey and straight; written things are ink and
       crooked. A school diary is stationery you fill in, not handwriting
       on rules, and keeping those two voices apart is what stops this
       reading as another sheet of paper. */
    /* The book is put down on the desk you were already sitting at, so
       the classroom stays visible around it. Filling the glass edge to
       edge made it a screen the game had navigated to rather than a
       thing lying in front of you, which is the one impression this
       surface exists to give. */
    .diarywrap {
      position: fixed; inset: 0; z-index: 24;
      display: flex; align-items: center; justify-content: center;
      padding: calc(clamp(10px, 3.4vh, 30px) + env(safe-area-inset-top)) 16px
               calc(clamp(10px, 3.4vh, 30px) + env(safe-area-inset-bottom));
      background: rgba(18, 12, 6, 0.5);
      opacity: 0; pointer-events: none; transition: opacity 0.22s ease;
    }
    .diarywrap.show { opacity: 1; pointer-events: auto; }
    .dinstall { display: none; }
    @media (display-mode: standalone), (display-mode: fullscreen) {
      .dinstall { display: none !important; }
    }
    .diary {
      /* x hidden so the clipped pen is cropped by the page edge; y auto
         purely as a safety valve. The page is built to fit, but a long
         name, a big text size or a short window must never silently cut
         the foot of it off. */
      position: relative; overflow: hidden auto; overscroll-behavior: contain;
      width: 100%; max-width: 396px; max-height: 100%;
      display: flex; flex-direction: column;
      padding: 6px 11px 2px 18px; border-radius: 3px 7px 7px 3px;
      color: var(--ink); font-family: var(--hand);
      background:
        radial-gradient(120% 90% at 50% 6%, rgba(255, 252, 240, 0.5), transparent 60%),
        var(--paper);
      /* Three page edges under the open one: it is a book, and at this
         size that reads before the stitching does. */
      box-shadow:
        0 2px 0 #ddd4bd, 0 4px 0 #cec5ae, 0 6px 0 #beb59f,
        0 22px 46px rgba(0, 0, 0, 0.55);
    }
    .diary::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      box-shadow: inset 0 0 42px rgba(88, 62, 20, 0.16);
    }
    .dspine {
      position: absolute; left: 0; top: 0; bottom: 0; width: 15px; pointer-events: none;
      background: linear-gradient(90deg, rgba(60, 38, 16, 0.32), rgba(60, 38, 16, 0.08) 60%, transparent);
    }
    .dstitch {
      position: absolute; left: 6px; top: 20px; bottom: 20px; width: 2px; pointer-events: none;
      background: repeating-linear-gradient(180deg, rgba(36, 66, 143, 0.5) 0 8px, transparent 8px 17px);
    }
    /* Only a champion's book is marked. */
    .dribbon {
      position: absolute; right: 7px; top: 0; width: 10px; height: 55%; z-index: 1; pointer-events: none;
      background: linear-gradient(90deg, #8e2419, #c4402f 42%, #a02c1f);
      box-shadow: 2px 0 5px rgba(20, 12, 4, 0.4);
    }
    .dribbon::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: -10px; height: 11px;
      background: inherit; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 55%, 0 100%);
    }
    /* The pen you play with, clipped to the book.
       It hangs over the TOP edge, which is where a clip goes and where it
       stops covering the page. It used to sit a third of the way down,
       across the name line, which meant every control on that line had to
       be pushed inboard to stay tappable — and being pushed off the one
       vertical rule this page has is exactly what made them look dropped
       there rather than placed. */
    .dclip {
      position: absolute; right: -52px; top: -22px; width: 104px; aspect-ratio: 720 / 75; z-index: 5;
      background-position: center; background-size: contain; background-repeat: no-repeat;
      transform: rotate(-82deg); pointer-events: none;
      filter: drop-shadow(-3px 5px 6px rgba(20, 12, 4, 0.45));
    }
    .dband {
      position: relative; z-index: 3; display: flex; align-items: center; gap: 8px;
      border: 1.5px solid rgba(90, 103, 136, 0.55); border-left-width: 4px;
      padding: 5px 8px 4px; background: rgba(234, 227, 208, 0.82);
    }
    .dband svg { flex: none; opacity: 0.75; }
    .dband .dt {
      flex: 1; font-family: var(--stamp); font-size: 10.5px; letter-spacing: 0.2em;
      color: #5a6788; text-transform: uppercase;
    }
    .dband .dno {
      font-family: var(--stamp); font-size: 10px; letter-spacing: 0.08em;
      color: rgba(90, 103, 136, 0.55); padding-right: 30px;
    }
    .dleft, .dside { display: contents; }
    .dfields { position: relative; z-index: 3; padding: 4px 0 0; }
    .dfrow { display: flex; align-items: baseline; gap: 6px; margin-bottom: 3px; }
    .dlabel {
      flex: none; font-family: var(--stamp); font-size: 9px; letter-spacing: 0.16em;
      color: rgba(90, 103, 136, 0.55); text-transform: uppercase;
    }
    .dfill {
      flex: 1; min-width: 0; line-height: 1; padding: 0 4px 1px;
      border-bottom: 1px dotted rgba(90, 103, 136, 0.3);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .dfill.nm { font-size: 23px; letter-spacing: 0.04em; text-transform: uppercase; }
    /* The name row now carries two controls and sets its own alignment
       in .namerow; it no longer reserves a right gutter, because the
       right edge belongs to attendance. */
    .dedit, .dlock {
      flex: none;
      position: relative; z-index: 6;
      display: inline-flex; align-items: center;
      margin: 0; padding: 4px 1px;
      font-family: var(--hand); font-size: 17px; line-height: 1;
      background: none; border: 0;
    }
    .dedit svg, .dlock svg { display: block; width: 20px; height: 20px; flex: none; }
    .dedit {
      cursor: pointer;
      color: var(--ink);
      text-decoration: underline;
      text-decoration-color: rgba(36, 66, 143, 0.35);
      text-underline-offset: 3px;
    }
    .dedit:active { color: var(--red); }
    .dlock {
      position: relative;
      color: var(--ink);
      cursor: help;
    }
    .dlock::after {
      content: attr(data-tip);
      position: absolute;
      left: 50%;
      top: calc(100% + 7px);
      transform: translateX(-50%);
      z-index: 23;
      width: max-content;
      max-width: 160px;
      padding: 5px 8px 4px;
      font-family: var(--hand);
      font-size: 13px;
      line-height: 1.25;
      color: var(--paper);
      background: var(--ink);
      border-radius: 2px;
      opacity: 0;
      pointer-events: none;
    }
    .dlock:hover::after, .dlock:focus-visible::after { opacity: 1; }
    /* Attendance, on the name line, and its right edge is the same rule
       the band, the fields, the stats and the foot all sit on. That one
       shared line is the whole difference between a control that was
       placed and one that was dropped in.

       Signed out it is the page's own outlined stamp button, the same
       shape as SEND A LINK and the index rows, in the page's ink. Signed
       in it is the red stamp. Nothing here invents a new button: a dashed
       red box was not in this game's vocabulary and read as an error. */
    .namerow { align-items: center; min-height: 28px; gap: 8px; margin-bottom: 5px; padding-right: 16px; }
    .namerow .dfill.nm { flex: 1 1 auto; min-width: 0; }
    .dpresent {
      flex: none; margin: 0; padding: 0;
      background: none; border: 0; cursor: pointer;
      color: var(--ink);
      transform: rotate(-0.8deg);
    }
    .dpresent:active { transform: rotate(-0.8deg) translateY(1px); }
    .dstamp {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 5px 7px 4px;
      border: 1.5px solid currentColor; border-radius: 2px;
      box-shadow: inset 0 0 0 1px var(--paper), inset 0 0 0 2.5px currentColor;
    }
    .dstamp .w {
      font-family: var(--stamp); font-size: 10.5px; line-height: 1;
      letter-spacing: 0.09em; text-transform: uppercase;
    }
    .dstamp svg { display: block; width: 11px; height: 11px; flex: none; }
    /* Signed in: red, and landed crooked, because now it is a mark on the
       page rather than something asking to be pressed. */
    .dpresent.present { color: var(--red); transform: rotate(-4deg); }
    .dpresent.present:active { transform: rotate(-4deg) translateY(1px); }
    .dstamp.on { opacity: 0.85; }
    /* Signed out on its own, or a result actually refused. The page's
       red, because now something is wrong rather than on offer. */
    .dpresent.lapsed, .dpresent.blocked { color: var(--red); }
    .dpresent.blocked .dstamp { background: rgba(176, 54, 42, 0.1); }
    .dfill.dt { font-size: 13.5px; color: var(--ink-2); }
    .dfill.pens { font-size: 14px; }
    .dfill .togo { color: var(--red); }
    .heldrow .dlabel { color: rgba(176, 54, 42, 0.7); }
    .dfill.held { font-size: 14px; color: var(--red); border-bottom-color: rgba(176, 54, 42, 0.4); }
    /* The ladder sits on the page the way it sits on the entry form:
       no box around it, the same margins, the same dots. */
    .dmarks { position: relative; z-index: 3; margin: 13px 0; }
    /* The one thing to do. The only filled control on the page. */
    .dhero.dboard {
      margin-top: 4px;
      padding: 10px 11px 11px;
      background: none;
      transform: none;
      box-shadow: none;
      border: 1.5px solid rgba(36, 66, 143, 0.4);
    }
    .dhero.dboard::after { display: none; }
    .dboard > .dask {
      margin: 0 0 8px;
      text-align: left;
      font-size: 15px;
      line-height: 1.15;
      color: var(--ink);
    }
    .dmodes { display: flex; gap: 8px; margin: 0 0 10px; }
    .dmode {
      flex: 1 1 50%;
      width: 50%;
      min-width: 0;
      border: 2px solid rgba(36, 66, 143, 0.35);
      background: var(--paper-hi);
      cursor: pointer;
      text-align: left;
      padding: 0;
      overflow: hidden;
      font: inherit;
      color: inherit;
    }
    .dmode.on {
      border-color: var(--ink);
      background: #eef1f6;
    }
    .dmode.locked { cursor: default; opacity: 0.88; }
    .dmode.locked .ddoor img { filter: grayscale(1) contrast(.92) brightness(.88); }
    .dboard .dlock {
      position: absolute;
      right: 5px;
      bottom: 5px;
      width: 28px;
      height: 28px;
      color: #f4efe4;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.7));
    }
    .dboard .dlock svg { width: 100%; height: 100%; display: block; }
    .dboard .dcard { display: flex; flex-direction: column; min-width: 0; }
    .dboard .ddoor { width: 100%; height: 96px; margin: 0; }
    .dboard .ddoor img { object-fit: cover; object-position: center 22%; }
    .dboard .ddoor em {
      left: 50%;
      top: 7%;
      bottom: auto;
      transform: translateX(-50%) rotate(-1deg);
      padding: 1px 5px 2px;
      border: 1.5px solid rgba(45, 40, 31, 0.72);
      background: rgba(232, 212, 164, 0.94);
      color: #243648;
      font-size: 13px;
      line-height: 1;
      text-shadow: 0 1px #fff5d0;
    }
    .dboard .dcopy { padding: 6px 7px 8px; text-align: left; }
    .dboard .dname {
      margin: 0;
      font-size: 13px;
      line-height: 1.1;
      color: var(--ink);
      text-transform: none;
      letter-spacing: 0;
    }
    .dboard .sub {
      display: block;
      min-height: 2.5em;
      margin-top: 2px;
      font-size: 11px;
      line-height: 1.25;
    }
    .drow2 { display: flex; align-items: center; gap: 10px; }
    .drow2 .dcopy { min-width: 0; flex: 1; }
    .dhero {
      position: relative; z-index: 3; margin-top: 4px; padding: 5px 9px 6px;
      background: var(--paper-hi); transform: rotate(-0.5deg);
      box-shadow: 0 6px 16px rgba(20, 12, 4, 0.24), 0 1px 0 rgba(255, 255, 255, 0.5) inset;
    }
    .dhero::after {
      content: ''; position: absolute; left: 0; right: 0; top: -4px; height: 5px; background: var(--paper-hi);
      clip-path: polygon(0 100%, 6% 0, 13% 92%, 21% 4%, 29% 96%, 37% 0, 45% 92%, 53% 6%, 61% 96%, 69% 0, 77% 92%, 85% 4%, 93% 96%, 100% 0, 100% 100%);
    }
    .dhero .kicker {
      font-family: var(--stamp); font-size: 9px; letter-spacing: 0.15em;
      text-transform: uppercase; color: #5a6788;
    }
    .dhero .big { font-size: 23px; line-height: 1; margin-top: 3px; letter-spacing: 0.04em; text-transform: uppercase; }
    .dhero .big .sm { font-size: 16.5px; }
    .dhero .sub { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
    .dduo { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
    .dduo .p {
      flex: 1; aspect-ratio: 720 / 75; background-position: center;
      background-size: contain; background-repeat: no-repeat;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.28));
    }
    .dduo .p.flip { transform: scaleX(-1); }
    .dduo .v { font-family: var(--stamp); font-size: 12px; color: var(--red); letter-spacing: 0.06em; }
    .ddoor {
      position: relative;
      width: 72px;
      height: 96px;
      margin: 8px 0 2px;
      overflow: hidden;
      background: #2a2218;
    }
    .ddoor img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
    }
    .ddoor em {
      position: absolute;
      left: 4px;
      bottom: 5px;
      font-family: var(--stamp);
      font-size: 13px;
      font-style: normal;
      letter-spacing: 0.08em;
      color: #f4efe4;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.65);
    }
    .dcta {
      display: block; width: 100%; margin-top: 10px; border: 0; cursor: pointer;
      background: var(--red); color: #f6efe0; transform: rotate(0.4deg);
      font-family: var(--stamp); font-size: 14px; letter-spacing: 0.09em;
      text-transform: uppercase; padding: 6px 0 5px;
      box-shadow: 0 4px 0 rgba(120, 34, 25, 0.85), 0 8px 16px rgba(0, 0, 0, 0.3);
    }
    .dcta:active { transform: rotate(0.4deg) translateY(3px); box-shadow: 0 1px 0 rgba(120, 34, 25, 0.85); }
    /* Rivals: a row per person, and the row is the control. Five rivals
       is five rows, never five buttons, so the page cannot grow a second
       decision no matter how many people you play. */
    .drivals {
      position: relative; z-index: 3; margin-top: clamp(12px, 2.4vh, 20px);
      display: flex; flex-direction: column; flex: none;
      width: 100%; max-width: 100%; min-width: 0;
    }
    .drail { position: relative; min-width: 0; padding: 0; }
    .drows {
      display: flex; flex-direction: row; gap: 7px;
      width: 100%; min-width: 0;
      overflow-x: auto; overflow-y: hidden;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .drail.has-prev .drows { scroll-padding-left: 30px; }
    .drail.has-next .drows { scroll-padding-right: 30px; }
    .drows::-webkit-scrollbar { display: none; }
    .dnav {
      position: absolute; top: 50%; z-index: 6;
      display: flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; margin: 0; padding: 0;
      border: 1.5px solid var(--ink); border-radius: 50%; cursor: pointer;
      background: var(--paper);
      color: var(--ink);
      transform: translateY(-50%);
    }
    .dnav svg { display: block; width: 13px; height: 13px; }
    .dnav.prev { left: 0; }
    .dnav.next { right: 0; }
    .dnav[hidden] { display: none; }
    .dnav:active { transform: translateY(calc(-50% + 1px)); }
    .diary .chooser { flex: 0 1 auto; margin-top: clamp(4px, 1.2vh, 10px); }
    .diary .chooser .picksec { margin: 0 0 clamp(2px, 0.7vh, 6px); font-size: 11.5px; }
    .diary .chooser .pickduo { gap: clamp(4px, 1vh, 8px); flex: none; }
    .diary .chooser .pickcol { flex: none; }
    .diary .chooser .pick {
      padding: clamp(4px, 0.9vh, 8px) 8px;
      gap: clamp(2px, 0.6vh, 5px);
    }
    .diary .chooser .pickart { height: 16px; margin: 0; }
    .diary .chooser .pickicon { width: 15px; height: 15px; }
    .diary .chooser .pick h3 { font-size: 15.5px; margin: 0; }
    .diary .chooser .pickduo h3 { min-height: 0; }
    .diary .chooser .pickbody {
      display: block; margin: 0;
      font-size: 12px; line-height: 1.2;
    }
    .diary .chooser .gostamp,
    .diary .chooser .stampbtn { margin-top: clamp(4px, 1.1vh, 9px); }
    .diary .chooser .pickduo .stampbtn {
      min-height: 38px; padding: 9px 4px 7px; font-size: 13px;
    }
    .diary .chooser .newtag {
      top: 2px; right: 2px; font-size: 10px; padding: 3px 5px 2px;
    }
    .drh {
      display: flex; justify-content: space-between;
      font-family: var(--stamp); font-size: 9px; letter-spacing: 0.2em;
      text-transform: uppercase; color: rgba(90, 103, 136, 0.55);
      border-bottom: 1px solid rgba(36, 66, 143, 0.26); padding-bottom: 2px; margin-bottom: 4px;
    }
    .drh[hidden] { display: none; }
    .drow {
      display: grid; grid-template-columns: 1fr auto; align-items: start;
      gap: 3px 6px;
      flex: 0 0 148px; width: 148px; margin: 0;
      scroll-snap-align: start;
      appearance: none;
      background: var(--paper-hi);
      border: 1.5px solid rgba(90, 103, 136, 0.22);
      border-radius: 6px;
      padding: 4px 6px 5px; cursor: pointer; text-align: left;
      font-family: var(--hand); color: var(--ink);
      transition: transform 0.12s ease;
    }
    .drow:hover { transform: translateY(-1px); }
    .drow:active { transform: translateY(1px); }
    .drow .who { min-width: 0; grid-column: 1; }
    .drow .nm {
      display: block; font-size: 15.5px; line-height: 1.05;
      letter-spacing: 0.04em; text-transform: uppercase;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .drow .ev {
      display: block; font-size: 11.5px; color: var(--ink-2); line-height: 1.25; margin-top: 1px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .drow .hh { grid-column: 1; font-family: var(--stamp); font-size: 13px; color: var(--ink-2); }
    .drow .play {
      grid-column: 2; grid-row: 1; justify-self: end;
      font-family: var(--stamp); font-size: 10.5px; letter-spacing: 0.09em;
      text-transform: uppercase; border: 2px solid var(--ink); color: var(--ink); padding: 5px 7px 3px;
      box-shadow: inset 0 0 0 1px var(--paper-hi), inset 0 0 0 2.5px var(--ink);
    }
    /* Whoever is holding a pen of yours is the only red row, which is how
       the list ranks itself without another button on the page. */
    .drow.owed { border-color: rgba(176, 54, 42, 0.4); }
    .drow.owed .nm, .drow.owed .ev, .drow.owed .hh { color: var(--red); }
    .drow.owed .play {
      border-color: var(--red); color: var(--red);
      box-shadow: inset 0 0 0 1px var(--paper-hi), inset 0 0 0 2.5px var(--red);
    }
    /* Nobody has played you yet: the one block on the page with real
       selling to do, because for most people multiplayer is a door they
       have not opened. The mark drawn large is the game explaining
       itself without a word: one pen going over another. */
    /* Secondary, and sized like it. This block and the index under it
       were taking close to half the page for the two things nobody
       opened the book to do. */
    .dempty {
      display: flex; flex-direction: column; align-items: center; text-align: center;
      padding: 4px 6px 2px;
    }
    .dempty svg { width: 74px; height: auto; opacity: 0.3; margin-bottom: 5px; }
    .dempty .h { font-size: 18px; line-height: 1.15; }
    .dempty .p {
      font-size: 13px; line-height: 1.35; color: var(--ink-2);
      max-width: 34ch; margin-top: 3px;
    }
    /* Outlined, not filled: the championship keeps the page's one
       primary, and this is the loudest thing under it. */
    .dinvite {
      margin-top: 9px; background: transparent; cursor: pointer;
      border: 2px solid var(--ink); color: var(--ink); transform: rotate(-0.6deg);
      font-family: var(--stamp); font-size: 14px; letter-spacing: 0.09em;
      text-transform: uppercase; padding: 10px 20px 8px;
      box-shadow: inset 0 0 0 1px var(--paper), inset 0 0 0 2.5px var(--ink);
      transition: transform 0.12s ease;
    }
    .dinvite:active { transform: rotate(-0.6deg) translateY(2px); }
    .dempty .or + .dinvite { margin-top: 4px; }
    .dempty .or, .chit .or, .playdoors .or {
      margin: 6px 0 2px;
      font-family: var(--hand);
      font-size: 15px;
      line-height: 1;
      letter-spacing: 0.02em;
      text-transform: lowercase;
      color: var(--ink-2);
      text-align: center;
    }
    .playdoors .or {
      margin: 0;
      color: #f0eadc;
      font-size: 13px;
      opacity: 0.8;
    }

    /* The blank line every diary prints one more of. */
    .daddrow {
      display: flex; align-items: center; gap: 9px; width: 100%; cursor: pointer; text-align: left;
      background: none; border: 0; border-left: 3px dashed rgba(90, 103, 136, 0.3);
      border-bottom: 1px dotted rgba(90, 103, 136, 0.3); padding: 7px 9px;
      font-family: var(--hand); font-size: 13.5px; color: var(--ink-2);
      transition: background-color 0.12s ease, color 0.12s ease;
    }
    .daddrow:hover { background: rgba(255, 252, 240, 0.62); color: var(--ink); border-left-style: solid; }
    .daddrow .plus { font-family: var(--stamp); font-size: 15px; color: rgba(90, 103, 136, 0.55); line-height: 1; }
    .daddrow .lbl { flex: 1; }
    .daddrow .arrow, .dindex .arrow {
      display: flex; align-items: center; flex: none;
      color: rgba(90, 103, 136, 0.55);
    }
    .dindex .arrow svg { display: block; width: 14px; height: 14px; }
    /* The way out of the book: printed furniture at the foot of the page,
       ruled off the way a real footer is, not a link left floating. */
    .dtail { flex: none; margin-top: 4px; padding-top: 4px; background: none; position: relative; z-index: 1; }
    .dindex {
      display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%;
      background: none; border: 0; border-top: 1px solid rgba(36, 66, 143, 0.26);
      padding: 4px 1px 0; cursor: pointer; text-align: left;
      font-family: var(--hand); font-size: 12.5px; color: var(--ink-2);
      transition: color 0.12s ease;
    }
    .dindex:hover { color: var(--ink); }
    /* One row of the index is a real link, so the shape has to hold for an
       anchor as well as a button: an anchor does not centre its own text
       and arrives underlined. */
    a.dindex { text-decoration: none; }
    /* Printed once, over the list. */
    .dtk {
      font-family: var(--stamp); font-size: 8.5px; letter-spacing: 0.16em;
      text-transform: uppercase; color: rgba(90, 103, 136, 0.55);
      padding-bottom: 2px;
    }
    /* Taller than an index line, and only because it is the one row here a
       thumb has to hit: at the index's own height it was a 26px target.
       Not louder, though. The red stays where the page spends it, on the
       count of pens left to the trimax. */
    .dgroup { padding: 5px 1px 3px; }
    .dgroup .lbl { text-decoration: underline; text-decoration-color: rgba(90, 103, 136, 0.4); text-underline-offset: 3px; }
    .dgroup:active { color: var(--ink); }
    /* Signed at the foot, under its own rule: the last line on the page
       is who made it, not another thing to tap. */
    .dnote {
      margin-top: 6px; padding: 5px 1px 0; text-align: center;
      border-top: 1px solid rgba(36, 66, 143, 0.26);
      font-family: var(--hand); font-size: 13px; line-height: 1.35;
      color: var(--ink-2);
    }
    .dnote a {
      color: var(--ink);
      text-decoration: underline;
      text-decoration-color: var(--ink-3);
      text-underline-offset: 2px;
    }
    .dlegal {
      margin: 11px 0 0;
      padding: 0 1px;
      text-align: center;
      font-family: var(--hand); font-size: 10.5px; line-height: 1.2;
      color: rgba(90, 103, 136, 0.55);
    }
    .dlegal a {
      color: rgba(90, 103, 136, 0.78);
      text-decoration: underline;
      text-decoration-color: rgba(90, 103, 136, 0.35);
      text-underline-offset: 2px;
    }
    .dindex .k {
      font-family: var(--stamp); font-size: 8.5px; letter-spacing: 0.16em;
      text-transform: uppercase; color: rgba(90, 103, 136, 0.55);
    }
    .dindex .lbl { flex: 1; }
    /* Most phones are shorter than their spec sheet says, because a
       browser bar is sitting on them. The page tightens instead of
       pushing the way out of the book off the bottom edge. */
    @media (max-height: 720px) {
      .diary { padding: 9px 12px 4px 20px; }
      .dfill.nm { font-size: 21px; }
      .dmarks { margin: 9px 0 8px; }
      .dhero { margin-top: 8px; padding: 9px 11px 10px; }
      .dhero .big { font-size: 21px; }
      .dhero .big .sm { font-size: 15px; }
      .dcta { margin-top: 8px; padding: 9px 0 7px; font-size: 16px; }
      .dduo { margin-top: 6px; }
      .drivals { margin-top: 8px; }
      .dempty { padding: 6px 6px 4px; }
      .dempty svg { width: 76px; margin-bottom: 6px; }
      .dempty .h { font-size: 16.5px; }
      .dempty .p { font-size: 12.5px; }
      .dinvite { margin-top: 9px; padding: 8px 16px 6px; font-size: 13px; }
      .dtail { padding-top: 7px; }
    }

    /* Smaller again: an older handset, or a browser with two bars on
       it. The invitation gives up the most, because it is the only block
       whose job survives being small. */
    @media (max-height: 620px) {
      .dfrow { margin-bottom: 5px; }
      .dfields { padding-top: 10px; }
      .namerow { min-height: 31px; }
      .dhero .big { font-size: 21px; }
      .dempty svg { width: 62px; margin-bottom: 4px; }
      .dempty .h { font-size: 15.5px; }
      .dempty .p { font-size: 12px; }
      .dinvite { margin-top: 7px; padding: 7px 14px 5px; }
    }

    /* Phone only, and only while the book is open. A line of type, not
       a sheet and not a bar. */
    @media (max-width: 620px) {
      .diarywrap.has-install {
        padding-bottom: calc(48px + env(safe-area-inset-bottom));
      }
      .diarywrap.has-install .dinstall {
        display: flex;
        position: fixed;
        left: 0; right: 0;
        bottom: 0;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        height: calc(48px + env(safe-area-inset-bottom));
        margin: 0;
        padding: 0 16px env(safe-area-inset-bottom);
        border: 0;
        border-top: 1px solid rgba(36, 66, 143, 0.16);
        background: var(--paper);
        color: #1a1814;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 13px;
        font-weight: 400;
        letter-spacing: 0;
        line-height: 1.25;
        text-align: left;
        z-index: 30;
      }
      .diarywrap.has-install .dinstall-copy { flex: 1; min-width: 0; }
      .diarywrap.has-install .dinstall-act {
        flex: none;
        margin: 0;
        padding: 6px 12px;
        border: 0;
        border-radius: 6px;
        background: var(--ink);
        color: var(--paper);
        font: inherit;
        font-weight: 400;
        line-height: 1.25;
        cursor: pointer;
      }
    }

    /* A desk holds a diary open; a phone holds one page. So the wide
       screen gets the spread, with the binding down the middle, rather
       than the phone page stretched across it. */
    @media (min-width: 760px) and (orientation: landscape) {
      .diarywrap { align-items: center; }
      .diary {
        max-width: 940px; height: auto; max-height: none; aspect-ratio: auto;
        overflow: hidden;
        display: grid; grid-template-columns: 1fr 26px 1fr; grid-template-rows: auto;
        padding: 24px 26px 16px; border-radius: 6px;
        box-shadow: 0 2px 0 #ddd4bd, 0 4px 0 #cec5ae, 0 26px 60px rgba(0, 0, 0, 0.6);
      }
      .dspine, .dstitch { display: none; }
      .diary::before {
        content: ''; position: absolute; top: 0; bottom: 0; left: 50%;
        width: 26px; margin-left: -13px; pointer-events: none; z-index: 2;
        background: linear-gradient(90deg, transparent, rgba(60, 38, 16, 0.1) 22%,
          rgba(60, 38, 16, 0.34) 50%, rgba(60, 38, 16, 0.1) 78%, transparent);
      }
      .dleft {
        display: flex; flex-direction: column; gap: 0;
        grid-column: 1; grid-row: 1 / -1;
        min-width: 0; min-height: min-content; overflow: visible;
      }
      .dside {
        display: flex; flex-direction: column;
        grid-column: 3; grid-row: 1 / -1; min-width: 0; min-height: 0; padding-left: 4px;
      }
      .dside .drivals { overflow: hidden; }
      .drivals { flex: none; margin-top: 18px; margin-bottom: 0; }
      .dfields { margin-top: 0; padding-top: 0; }
      .dside .chooser { flex: 0 1 auto; margin-top: 0; }
      .diary .chooser .pickcol { flex: 1 1 auto; }
      .diary .chooser .picksec { margin: 0 0 10px; font-size: 13.5px; }
      .diary .chooser .pickduo { gap: 9px; flex: 1 1 auto; }
      .diary .chooser .pick { padding: 13px 11px 13px; gap: 0; }
      .diary .chooser .pickart { height: 34px; margin-bottom: 5px; }
      .diary .chooser .pickicon { width: 27px; height: 27px; }
      .diary .chooser .pick h3 { font-size: 19px; margin: 0 0 6px; }
      .diary .chooser .pickduo h3 { min-height: 2.16em; }
      .diary .chooser .pickbody { font-size: 14.5px; line-height: 1.34; margin: 0 0 11px; }
      .diary .chooser .gostamp,
      .diary .chooser .stampbtn { margin-top: auto; }
      .diary .chooser .pickduo .stampbtn {
        min-height: 44px; padding: 9px 4px 7px; font-size: 13.5px;
      }
      .diary .chooser .newtag {
        top: 5px; right: 5px; font-size: 11px; padding: 4px 7px 3px;
      }
      .namerow { min-height: 34px; margin-bottom: 14px; padding-right: 22px; }
      .dfrow { margin-bottom: 7px; }
      .dstamp { padding: 8px 10px 7px; }
      .dmarks { margin: 16px 0; }
      .dmarks .ladder b { display: block; }
      .dhero { margin-top: 9px; padding: 10px 12px 11px; }
      .dhero .sub { margin-top: 8px; font-size: 12.5px; }
      .dduo { margin-top: 8px; }
      .dcta { margin-top: 9px; padding: 10px 0 8px; font-size: 17px; }
      .dtail { margin-top: auto; padding-top: 14px; }
      .dindex { padding: 7px 1px 0; font-size: 13.5px; }
      .dgroup { padding: 11px 1px 9px; }
      .dnote { font-size: 14px; line-height: 1.35; margin-top: 9px; padding-top: 7px; }
      /* Nobody has written in it yet, so the invitation sits in the
         middle of the page rather than at the top of an empty one. */
      .drivals.bare { align-self: center; margin-top: -6%; }
      .drivals.bare .dempty { padding: 4px 10px; }
      .drivals.bare .dempty svg { width: 148px; margin-bottom: 16px; }
      .drivals.bare .dempty .h { font-size: 22px; }
      .drivals.bare .dempty .p { font-size: 14.5px; }
      .dribbon { left: calc(50% - 5px); right: auto; height: 64%; }
      .dclip { right: -74px; top: 2px; width: 168px; transform: rotate(-84deg); }
      .dfill.nm { font-size: 32px; }
      .dhero .big { font-size: 32px; }
      .dhero .big .sm { font-size: 22px; }
      .dboard .dname { font-size: 14px; }
      .dboard .ddoor { width: 100%; height: 112px; }
      .dboard .ddoor em { font-size: 15px; }
      .dboard .sub { font-size: 12.5px; }
      .drh { padding-bottom: 3px; margin-bottom: 6px; }
      .drow { flex-basis: 168px; width: 168px; padding: 10px 10px 11px; gap: 5px 8px; }
      .drow .nm { font-size: 19px; }
    }

    /* ---- Five things from three rotating drawers, on the desk ----
       Never behind a tap: a reaction is only worth having if it costs
       nothing, and one tap to open plus one to pick is two gestures to
       say anything, by which time the moment has gone.

       Where they sit is the same question the notes answered, so it uses
       the same measured slot. Wide screen: the floor beside the desk,
       in the gutter opposite the notes, always there. Phone: no gutter
       exists, so a row along the very bottom. */
    .reactbar {
      position: fixed;
      display: none;
      gap: 6px;
      z-index: 7;
    }
    .reactbar.on { display: flex; }
    .reactpick {
      font-family: var(--hand);
      font-size: 15px; line-height: 1;
      /* One line each, or the longest one makes the whole row ragged. */
      white-space: nowrap;
      padding: 8px 12px 10px;
      border: 0;
      color: var(--ink);
      background: var(--paper-hi);
      /* These are controls first and desk scraps second. A fine ink edge
         and a harder contact shadow keep the paper readable over either
         the wall or the wood without turning the row into a toolbar. */
      box-shadow:
        0 0 0 1px rgba(36, 66, 143, 0.18),
        0 3px 5px rgba(20, 12, 4, 0.46),
        0 9px 18px rgba(20, 12, 4, 0.16);
      cursor: pointer;
      /* Scraps in a pile, not buttons in a toolbar. */
      transform: rotate(-1.4deg);
      opacity: 1;
      transition: opacity 0.15s ease, background-color 0.15s ease, transform 0.12s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .reactpick.big { font-size: 19px; padding: 6px 11px 8px; }
    .reactpick:nth-child(even) { transform: rotate(1.6deg); }
    .reactpick:active { opacity: 1; background: var(--paper-hi); transform: rotate(-1.4deg) scale(0.96); }
    .reactpick:nth-child(even):active { transform: rotate(1.6deg) scale(0.96); }
    .reactpick:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; opacity: 1; }
    @media (hover: hover) and (pointer: fine) {
      .reactpick:hover { opacity: 1; background: var(--paper-hi); }
    }
    @media (pointer: coarse) {
      .reactpick { min-height: 44px; }
      .reactpick.big { min-width: 44px; }
    }

    /* Landscape: standing in the gutter the notes are not using, so the
       two never argue over the same strip of floor. */
    body[data-slips="right"] .reactbar {
      flex-direction: column; align-items: flex-start;
      left: 13px; bottom: calc(max(10px, env(safe-area-inset-bottom)) + 52px);
      max-width: var(--gut-left-w);
    }
    body[data-slips="left"] .reactbar {
      flex-direction: column; align-items: flex-end;
      right: 13px; bottom: max(14px, env(safe-area-inset-bottom));
      max-width: var(--gut-right-w);
    }

    /* Portrait: the wall above the desk, which is the only space on a
       phone that is not the desk.
       The first attempt put this row along the bottom of the screen and
       hid it while the player was aiming. That was wrong: the bottom of
       a phone screen IS the near edge of the desk, so the row lay across
       the exact strip where a pen comes to rest and where the pull-back
       starts, and hiding it on your own turn did nothing about the other
       half of the match. Nothing may sit on the wood, turn or no turn.
       The band between the board and the far edge is the one clear
       strip of wall, so the row hangs from the bottom of the board and
       grows downward into it: off the desk entirely, and structurally
       unable to climb over the board or the score however short the
       band is. The first version hung it from the viewport bottom with
       bottom: calc(100vh - ...), and 100vh on a phone is the tallest
       the screen ever gets, not the screen: every Android browser bar
       lifted the row by its own height, straight over the chalk. */
    body[data-slips="far"] .reactbar {
      left: 50%;
      transform: translateX(-50%);
      top: calc(var(--board-bot, 0px) + 8px);
      flex-wrap: nowrap;
      gap: 5px;
      max-width: calc(100vw - 12px);
      justify-content: center;
    }
    /* Only reached when there is real room under the near edge, which by
       definition is off the wood. */
    body[data-slips="below"] .reactbar {
      left: 50%;
      transform: translateX(-50%);
      bottom: max(8px, env(safe-area-inset-bottom));
      flex-wrap: nowrap;
      gap: 5px;
      max-width: calc(100vw - 12px);
      justify-content: center;
    }
    body[data-slips="far"] .reactpick,
    body[data-slips="below"] .reactpick {
      font-size: 13px; padding: 7px 9px 9px;
    }
    body[data-slips="far"] .reactpick.big,
    body[data-slips="below"] .reactpick.big {
      font-size: 17px; padding: 5px 9px 7px;
    }
    /* The far-wall layout is also used on wide desktop canvases. It was
       inheriting the phone-sized 13px controls, which made the reactions
       look like scenery at classroom scale. Let them grow with the room,
       while the phone rules below stay deliberately compact. */
    @media (min-width: 700px) {
      body[data-slips="far"] .reactbar {
        top: calc(var(--board-bot, 0px) + 12px);
        gap: clamp(6px, 0.45vw, 9px);
      }
      body[data-slips="far"] .reactpick {
        font-size: clamp(16px, 1vw, 20px);
        padding: clamp(9px, 0.55vw, 12px) clamp(12px, 0.85vw, 17px) clamp(11px, 0.7vw, 14px);
      }
      body[data-slips="far"] .reactpick.big {
        min-width: clamp(48px, 3.2vw, 58px);
        font-size: clamp(22px, 1.35vw, 27px);
        padding-block: 7px 10px;
      }
    }
    @media (max-width: 350px) {
      body[data-slips="far"] .reactbar,
      body[data-slips="below"] .reactbar { gap: 3px; }
      body[data-slips="far"] .reactpick,
      body[data-slips="below"] .reactpick { font-size: 12px; padding-inline: 6px; }
    }

    /* ---- Something somebody said ----
       The one thing allowed over the desk, because it is gone in a
       couple of seconds and because it is the only message here that
       comes from a person rather than from the game. It rises off the
       end of the desk belonging to whoever said it and fades, so no
       label is needed to say who: theirs comes from across, yours from
       under your own hands. */
    .slip.react {
      left: var(--desk-mid, 50%);
      --slip-rot: -2.2deg;
      padding: 6px 14px 8px;
      /* No ruled line: this is said, not written down. */
      background-image: var(--paper-tex, none);
      box-shadow: 0 2px 4px rgba(20, 12, 4, 0.3), 0 8px 18px rgba(20, 12, 4, 0.35);
      transition: opacity 0.5s ease, transform 1.9s cubic-bezier(0.15, 0.7, 0.35, 1);
      z-index: 6;
    }
    .slip.react.big { font-size: 26px; padding: 4px 14px 7px; line-height: 30px; }
    /* Theirs starts just inside the far edge of the desk, yours just
       inside the near one. */
    .slip.react.theirs { top: calc(var(--desk-far, 30%) + 18px); }
    .slip.react.mine { top: calc(var(--desk-near, 80%) - 62px); }
    .slip.react.theirs { --slip-x: calc(-50% + var(--react-drift, 0px)); }
    .slip.react.mine { --slip-x: calc(-50% + var(--react-drift, 0px)); }
    /* Up and away. Theirs drifts further, because it has the whole desk
       to cross and the extra travel is what reads as distance. */
    .slip.react.show { opacity: 1; }
    .slip.react.theirs.show { transform: translate(var(--slip-x), -54px) rotate(var(--slip-rot)); }
    .slip.react.mine.show { transform: translate(var(--slip-x), -40px) rotate(var(--slip-rot)); }
    .slip.react.gone { opacity: 0; }
    @media (prefers-reduced-motion: reduce) {
      .slip.react { transition: opacity 0.3s ease; }
      .slip.react.theirs.show, .slip.react.mine.show { transform: translate(var(--slip-x), 0); }
    }

    /* Whose turn it is is ambient. It is read in the corner of the eye
       every few seconds and it never has news; the moment it starts
       competing with the pens for attention it is doing harm, because
       the pens are the game and this is a caption on it.
       So it is treated as something in the room rather than something
       over the room: further from the light than the desk, smaller,
       lower in contrast, with the shallow shadow of paper lying flat
       against a wall instead of the deep one of paper on a lit desk.
       It is still the same chit off the same pad. It is just further
       away, which is exactly what it is. */
    .turnline {
      --slip-rot: -1.4deg;
      font-size: clamp(13px, 3.4vw, 15px);
      padding: 7px 13px 9px;
      box-shadow: 0 1px 2px rgba(20, 12, 4, 0.24), 0 4px 9px rgba(20, 12, 4, 0.26);
      filter: brightness(0.76) saturate(0.78);
    }
    .turnline.show { opacity: 0.62; }
    /* Your go reads a touch nearer than theirs: squarer to you and a
       little more present. A difference in weight, not a change of
       volume, and no scaling, because something that grows is asking to
       be looked at. */
    .turnline.mine { --slip-rot: -0.5deg; filter: brightness(0.93) saturate(0.9); }
    .turnline.show.mine { opacity: 0.86; }
    /* A nudge, or the clock taking a turn away. These are the only
       things this note ever has to say that are worth interrupting for,
       so they step out of the background entirely and then step back. */
    .turnline.loud { filter: none; font-weight: 700; }
    .turnline.show.loud { opacity: 1; }
    /* No arrival animation. Something in the background that pops when it
       changes is no longer in the background; the opacity and position
       transitions on .slip carry the change quietly enough. */
    .result {
      position: fixed;
      left: 50%; top: 60%;
      margin-top: -46px;
      text-align: center;
      font-family: var(--hand);
      color: #fbf6ea;
      font-size: clamp(22px, 6vw, 30px);
      text-transform: uppercase;
      text-shadow: 0 3px 14px rgba(20, 12, 4, 0.92), 0 0 30px rgba(20, 12, 4, 0.7);
      transform: translate(-50%, -50%) rotate(-1deg) scale(0.96);
      pointer-events: none;
      width: min(88vw, 560px);
      line-height: 1.05;
      white-space: normal;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 5;
    }
    .result.show { opacity: 1; transform: translate(-50%, -50%) rotate(-1deg) scale(1); }
    /* The paper is the current instruction. A fading turn/result toast from
       the desk beneath it becomes a second, contradictory heading on short
       phones, so every open chit suppresses transient play copy. */
    body.chit-open .cue,
    body.chit-open .result { opacity: 0 !important; }
    .toast {
      position: fixed;
      top: 16%;
      left: 0; right: 0;
      text-align: center;
      color: #f3ede2;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-shadow: 0 2px 10px rgba(0,0,0,0.45);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s;
    }
    .toast.show { opacity: 1; }
    /* A chit torn from a notebook and passed across the desk: ruled paper,
       red margin, jagged tear along the top. Every rule, stake and result
       in this game arrives on one of these. */
    .chitwrap {
      position: fixed;
      inset: 0;
      z-index: 22;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(18, 14, 10, 0.42);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
      padding:
        max(10px, env(safe-area-inset-top))
        max(10px, env(safe-area-inset-right))
        max(10px, env(safe-area-inset-bottom))
        max(10px, env(safe-area-inset-left));
      overscroll-behavior: contain;
    }
    .chitwrap.show { opacity: 1; pointer-events: auto; }
    .chitwrap.overbook { z-index: 26; }
    .chitwrap:has(.howto-top) {
      align-items: flex-start;
      padding-top: max(88px, calc(env(safe-area-inset-top) + 76px));
    }
    .chitwrap:has(.howto-bottom) {
      align-items: flex-end;
      padding-bottom: max(168px, calc(env(safe-area-inset-bottom) + 156px));
    }
    /* One line under the controls, not one of the controls. The top row
       is reserved for things a player needs to operate the game. */
    .coffeebreak {
      position: fixed;
      top: calc(max(10px, env(safe-area-inset-top)) + 50px);
      right: 10px;
      z-index: 6;
      min-height: 44px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 3px 0 6px;
      border: 0;
      background: transparent;
      color: rgba(244, 238, 224, 0.76);
      font-family: var(--hand);
      font-size: 16px;
      line-height: 1;
      text-transform: lowercase;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.62);
      cursor: pointer;
      touch-action: manipulation;
      transition: color 140ms ease, opacity 180ms ease,
        transform 140ms cubic-bezier(0.23, 1, 0.32, 1);
    }
    .coffeebreak span {
      transform: rotate(-1deg);
      white-space: nowrap;
    }
    /* Spent: this browser has already answered, and it says so rather
       than disappearing between visits. */
    .coffeebreak.is-spent {
      opacity: 0.4;
      cursor: default;
      text-decoration: line-through;
    }
    @media (hover: hover) and (pointer: fine) {
      .coffeebreak:hover { color: var(--paper-hi); }
    }
    .coffeebreak:active { transform: scale(0.97); }
    .coffeebreak:focus-visible {
      outline: 2px solid var(--paper-hi);
      outline-offset: 1px;
      border-radius: 7px;
    }
    /* The gift: right side, tucked under the row of controls rather than
       in it. The top row is for things a player needs to operate the
       game; this is an object somebody left on the desk, and it sits
       below them so it never reads as another button.

       It was on the left at first, opposite the controls, which put it
       under the scoreboard and behind the blackboard's dark paint where
       nothing showed. */
    .giftbtn {
      position: fixed;
      top: calc(max(10px, env(safe-area-inset-top)) + 52px);
      right: 8px;
      z-index: 6;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
      touch-action: manipulation;
      /* Two shadows: a tight dark one to cut it off the classroom, and a
         warm bloom so a small object still catches the eye in a room
         this dim. */
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.75))
              drop-shadow(0 0 9px rgba(255, 190, 120, 0.5));
      transition: transform 140ms cubic-bezier(0.23, 1, 0.32, 1);
    }
    .giftbtn svg { width: 40px; height: 40px; display: block; }
    .giftbtn .anamalogo { width: 48px; height: auto; }
    /* A nudge every few seconds, the way a wrapped box does not sit
       perfectly still if something is loose inside it. On the svg rather
       than the button so it cannot fight the press transform. */
    @keyframes giftnudge {
      0%, 84%, 100% { transform: rotate(0deg) translateY(0); }
      87% { transform: rotate(-8deg) translateY(-2px); }
      90% { transform: rotate(7deg) translateY(0); }
      94% { transform: rotate(-4deg) translateY(-1px); }
      97% { transform: rotate(2deg) translateY(0); }
    }
    .giftbtn .giftsvg { animation: giftnudge 4s ease-in-out infinite; transform-origin: 50% 70%; }
    @media (prefers-reduced-motion: reduce) {
      .giftbtn .giftsvg { animation: none; }
    }
    @media (hover: hover) and (pointer: fine) {
      .giftbtn:hover { transform: translateY(-2px) scale(1.06); }
    }
    .giftbtn:active { transform: scale(0.92); }
    .giftbtn:focus-visible {
      outline: 2px solid var(--paper-hi);
      outline-offset: 2px;
      border-radius: 8px;
    }
    /* Gift is independent desk chrome. Fixture, verdict and ranking paper
       may sit beneath it; opening the gift preserves that sheet in place. */
    /* Opening the gift: a full-screen moment, the room pushed out of
       focus behind it. Not an object on the desk -- a cheap model in a
       room this textured reads as a placeholder, and this genre reveals
       in 2D for that reason. */
    .giftpad {
      position: fixed;
      inset: 0;
      z-index: 23;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 3vh, 26px);
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      cursor: grab;
      opacity: 0;
      background: rgba(8, 10, 14, 0);
      -webkit-backdrop-filter: blur(0px);
      backdrop-filter: blur(0px);
      transition: opacity 260ms ease, background-color 320ms ease,
        backdrop-filter 320ms ease, -webkit-backdrop-filter 320ms ease;
    }
    .giftpad.is-in {
      opacity: 1;
      background: rgba(8, 10, 14, 0.62);
      -webkit-backdrop-filter: blur(9px) saturate(0.85);
      backdrop-filter: blur(9px) saturate(0.85);
    }
    .giftpad:active { cursor: grabbing; }
    /* The box itself. --shake is written per frame from the hold, so the
       wobble is the player's thumb and not a loop running at them. */
    .giftstage {
      --shake: 0;
      --glow: 0;
      position: relative;
      width: min(72vw, 340px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      transform:
        translate(calc((var(--shake) * 6px) * -1), calc(var(--shake) * -3px))
        rotate(calc(var(--shake) * -2deg))
        scale(calc(1 + var(--shake) * 0.06));
      transition: transform 90ms ease-out;
    }
    /* Pressure gathers around the wrapped box while the hold builds. It
       starts nearly invisible and tight, then swells into the blast. */
    .giftstage::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 0;
      width: 40%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle,
        rgba(255, 255, 244, 1) 0 3%,
        rgba(255, 226, 145, 0.9) 10%,
        rgba(255, 167, 65, 0.52) 23%,
        rgba(220, 76, 43, 0.2) 40%,
        rgba(194, 69, 47, 0.06) 53%,
        transparent 64%);
      filter: blur(9px) saturate(1.2);
      mix-blend-mode: screen;
      opacity: calc(var(--glow) * 1.35);
      transform:
        translate(-50%, -50%)
        scale(calc(0.5 + var(--glow) * 2.85));
      box-shadow:
        0 0 calc(var(--glow) * 55px) rgba(255, 230, 155, 0.3),
        0 0 calc(var(--glow) * 130px) rgba(220, 76, 43, 0.12);
      transition: opacity 70ms linear, transform 70ms linear;
      pointer-events: none;
    }
    .giftpad.is-contracting .giftstage::before {
      opacity: 1;
      transform: translate(-50%, -50%) scale(0.28);
      filter: blur(3px) saturate(1.8);
      box-shadow:
        0 0 18px rgba(255, 255, 238, 1),
        0 0 42px rgba(255, 190, 75, 0.92);
      transition:
        transform 180ms cubic-bezier(0.72, 0, 1, 0.45),
        filter 180ms ease-in,
        box-shadow 180ms ease-in;
    }
    /* Arrival plays once. After it lands, the wrapped box gives one quick
       side-to-side reminder every few seconds instead of assembling again. */
    .giftpad.is-ready:not(.is-holding):not(.is-done) .giftstage {
      animation: giftidleshake 2.2s ease-in-out infinite;
    }
    @keyframes giftidleshake {
      0%, 68%, 100% { margin-left: 0; }
      73% { margin-left: -7px; }
      78% { margin-left: 7px; }
      83% { margin-left: -5px; }
      88% { margin-left: 5px; }
      93% { margin-left: -2px; }
      97% { margin-left: 2px; }
    }
    .giftpad.is-holding .giftstage { animation: giftjudder 90ms steps(2, end) infinite; }
    @keyframes giftjudder {
      0% { margin-left: calc(var(--shake) * -8px); }
      50% { margin-left: calc(var(--shake) * 8px); }
      100% { margin-left: calc(var(--shake) * -8px); }
    }
    .giftstage svg { position: relative; z-index: 1; width: 100%; height: 100%; display: block; }
    .giftpad.is-burst .giftstage {
      opacity: 0;
      transform: scale(0.45);
      transition: opacity 90ms ease-out, transform 160ms ease-in;
    }
    .giftpad.is-burst { z-index: 21; }
