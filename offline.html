      font-size: 13px; letter-spacing: 0.09em; text-transform: uppercase;
      cursor: pointer;
    }
    /* One of the bar's buttons is a real link, because a WhatsApp invite
       has to be tapped as one to reach the app. Everything about it is the
       button beside it; an anchor just arrives underlined and does not
       centre its own text. */
    .boxbar a.barbtn {
      display: inline-flex; align-items: center; justify-content: center;
      text-decoration: none;
    }
    .boxtabs { display: flex; gap: 8px; justify-content: center; margin: 0 0 10px; }
    .boxtabs:empty { display: none; }
    .boxtab {
      padding: 7px 16px 6px;
      border: 1px solid rgba(255,214,160,0.3);
      border-radius: 2px;
      background: rgba(28,14,2,0.5);
      color: rgba(255,240,220,0.7);
      font-family: var(--stamp);
      font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase;
      cursor: pointer;
    }
    .boxtab.on { background: var(--paper-hi); color: var(--ink); border-color: var(--paper-hi); }
    .tinframe {
      position: relative;
      /* 760x1157 is the tin photograph. The width is stated outright
         rather than left for aspect-ratio to work out, because Safari
         sizes the grid column off the image's intrinsic 760px instead and
         leaves a few hundred pixels of empty column between the tin and
         the card. Explicit width, no room for interpretation. */
      aspect-ratio: 760 / 1157;
      height: min(82vh, 820px);
      width: calc(min(82vh, 820px) * 0.65686);
      align-self: center;
      filter: drop-shadow(0 22px 34px rgba(0,0,0,0.6));
      transform: translateY(16px) scale(0.97);
      transition: transform 0.32s cubic-bezier(0.2, 1.05, 0.3, 1);
    }
    .boxwrap.show .tinframe { transform: translateY(0) scale(1); }
    /* Only the base. The lid region of this same photograph is drawn by
       .tinlid, which is hinged; if the flat art kept its lid too, you would
       watch one lid swing down over another lid that never moved. */
    .tinart { display: block; width: 100%; height: 100%; clip-path: inset(48.9% 0 0 0); }
    .tinslots { position: absolute; inset: 0; }
    /* The lid is the top 47% of the same photograph, hinged along its
       lower edge, so closing it is the real thing rotating rather than a
       panel fading out. Perspective makes it foreshorten as it comes down.
       49% is measured, not guessed: it is the row in the photograph where
       the foam tray begins, so the hinge line is the real hinge line and
       the base art keeps no sliver of lid behind the swing. */
    .tinframe { perspective: 1400px; }
    .tinlid {
      position: absolute;
      left: 0; right: 0; top: 0;
      height: 49%;
      overflow: hidden;
      transform-origin: 50% 100%;
      transform: rotateX(0deg);
      transition: transform 0.58s cubic-bezier(0.42, 0, 0.3, 1);
      backface-visibility: hidden;
      pointer-events: none;
    }
    .tinlid img { display: block; width: 100%; height: auto; }
    .tinshut {
      position: absolute;
      left: 0; right: 0; top: 44%;
      width: 100%;
      opacity: 0;
      /* Leaving shut it clears out at once, so nothing sits behind the
         rising lid; arriving shut it waits for the lid to land (below). */
      transition: opacity 0.14s ease;
      pointer-events: none;
    }
    /* Shut: the lid swings down onto the base and the closed box shows. */
    .tinframe.shut .tinlid { transform: rotateX(-99deg); }
    .tinframe.shut .tinshut { opacity: 1; transition: opacity 0.18s ease 0.34s; }
    .tinframe.shut .tinslots { opacity: 0; transition: opacity 0.16s ease; }
    /* The name is inked on the lid, so it cannot stay behind when the lid
       goes: it turns edge-on and is gone before the swing is halfway. */
    .tinframe.shut .tinowner { opacity: 0; transition: opacity 0.14s ease; }
    .tinowner { transition: opacity 0.2s ease 0.4s; }
    /* Pens are only there once the lid is far enough up to see them. */
    .tinslots { transition: opacity 0.24s ease 0.36s; }
    /* Handed to you shut: no transition on the way into that first frame,
       or the box would fade closed instead of simply being closed. */
    .tinframe.instant, .tinframe.instant * { transition: none !important; }
    /* Put away: the shut box is set down toward the corner it lives in. */
    .boxwrap.away .boxstack {
      transform: translate(-32%, 42%) scale(0.34) rotate(-6deg);
      opacity: 0;
      transition: transform 0.46s cubic-bezier(0.5, 0, 0.75, 0.4), opacity 0.46s ease 0.12s;
    }
    .boxwrap.away .pencard, .boxwrap.away .actions, .boxwrap.away .boxbar {
      opacity: 0; transition: opacity 0.16s ease;
    }
    .boxstack { transition: transform 0.4s ease, opacity 0.4s ease; }



    /* The room's own chrome while the case is open. */
    body.boxopen .boardbtn, body.boxopen .coffeebreak, body.boxopen .giftbtn, body.boxopen .soundcontrol, body.boxopen .penchip {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    /* Nothing in this game should ever show a stock browser scrollbar.
       Where a short screen genuinely has to scroll, it scrolls on
       something that belongs to the room. */
    * { scrollbar-width: thin; scrollbar-color: rgba(255, 226, 190, 0.24) transparent; }
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 226, 190, 0.24); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 226, 190, 0.38); }
    ::-webkit-scrollbar-corner { background: transparent; }
    /* The owner's name, inked onto the lid at a child's angle. */
    .tinowner {
      position: absolute;
      left: 0; right: 0;
      top: 4.6%;
      text-align: center;
      font-family: var(--hand);
      font-size: clamp(13px, 3.8vw, 18px);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(26, 40, 88, 0.72);
      transform: rotate(-1.4deg);
      pointer-events: none;
      text-shadow: 0 1px 0 rgba(255, 220, 170, 0.25);
    }
    .slot {
      position: absolute;
      top: var(--slot-top);
      left: 50%;
      width: 78%;
      min-height: 44px;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      transform: translate(-50%, -50%);
      cursor: pointer;
      transition: transform 0.18s cubic-bezier(0.2, 1.1, 0.3, 1), filter 0.18s ease;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.75));
    }
    .slot img { display: block; width: 100%; height: auto; }
    .slot.locked { cursor: default; filter: brightness(0.26) saturate(0.14) drop-shadow(0 2px 3px rgba(0,0,0,0.8)); }
    /* Two of the same pen in one slot. Written on the foam beside it in
       the hand, the way you would have counted your own: small, because
       a spare is a fact about the box and not a badge to be awarded. */
    .slot .spare {
      position: absolute;
      right: -2px;
      top: 50%;
      transform: translateY(-50%);
      font-family: var(--hand);
      font-style: normal;
      font-size: 15px;
      line-height: 1;
      color: rgba(244, 239, 224, 0.82);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
      pointer-events: none;
    }
    .slot.sel {
      transform: translate(-50%, calc(-50% - 5px)) scale(1.035);
      filter: drop-shadow(0 8px 10px rgba(0,0,0,0.72));
    }
    .slot:focus-visible {
      outline: 2px solid #f6e7c8;
      outline-offset: 4px;
      border-radius: 999px;
    }
    /* Choosing in a duel is a short, social task. The same physical tin
       opens, but it does not make a waiting friend sit through the longer
       collection ceremony or offer unrelated ranking/share detours. */
    .boxwrap.duelpick { z-index: 24; }
    .boxwrap.duelpick .tinlid { transition-duration: 0.34s; }
    .boxwrap.duelpick .boxbar .barbtn { display: none; }
    .boxwrap.duelpick .boxbar { justify-content: center; }
    .boxwrap.duelpick .boxbar .boxtabs { flex: 0 0 auto; }
    .boxwrap.duelpick .actions.inert .stampbtn { display: none; }
    .boxwrap.duelpick .actions.inert .shutbtn { flex: 1; }
    /* The card that comes out of the box with the pen. */
    .pencard {
      position: relative;
      margin: 12px 6px 0;
      padding: 11px 15px 13px 25px;
      border-radius: 3px 3px 10px 3px;
      color: var(--ink);
      background-color: var(--paper);
      background-image: var(--paper-tex, none);
      background-size: 180px 180px;
      box-shadow: 0 14px 28px rgba(0,0,0,0.52);
      transform: rotate(-0.6deg);
    }
    .pencard::before {
      content: '';
      position: absolute;
      top: 0; bottom: 0; left: 16px;
      width: 1.5px;
      background: rgba(191, 59, 43, 0.45);
    }
    .pencard-mark .mark { display: block; }
    .pencard-mark {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      color: var(--ink); margin-bottom: 2px;
    }
    .pencard-mark span { font-family: var(--stamp); font-size: 13px; letter-spacing: 0.12em; }
    .pencard img.oncard {
      display: block; width: 94%; margin: 0 auto 4px;
      filter: drop-shadow(0 4px 5px rgba(40,30,12,0.36));
      transform: rotate(-0.8deg);
    }
    .pencard h4 {
      font-family: var(--hand);
      font-weight: normal;
      font-size: 23px;
      text-transform: uppercase;
      text-align: center;
      border-bottom: 2px solid var(--ink);
      padding-bottom: 4px;
      margin-bottom: 6px;
    }
    .pencard p {
      font-family: var(--hand);
      font-size: 16px;
      text-transform: uppercase;
      color: var(--ink-2);
      text-align: center;
    }
    .cardtally {
      display: flex; align-items: center; justify-content: center; gap: 9px;
      margin-top: 6px;
    }
    .cardtally span {
      font-family: var(--hand); font-size: 15px;
      text-transform: uppercase; color: var(--ink-2);
    }
    .cardtally b { font-family: var(--hand); font-weight: normal; font-size: 21px; color: var(--ink); }
    .wonflag {
      position: absolute;
      top: -11px; right: -6px;
      padding: 4px 10px 3px;
      background: var(--red);
      color: #fff6ea;
      font-family: var(--stamp);
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transform: rotate(3deg);
      box-shadow: 0 3px 8px rgba(0,0,0,0.4);
    }
    .actions { display: flex; gap: 9px; margin: 11px 6px 0; }
    .actions .stampbtn, .actions .shutbtn {
      flex: 1;
      padding: 11px 8px 9px;
      font-family: var(--stamp);
      font-size: 15px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
    }
    .actions .stampbtn {
      background: var(--paper-hi);
      color: var(--ink);
      border: 2.5px solid var(--ink);
      outline: 1px solid var(--ink);
      outline-offset: 2px;
      transform: rotate(-0.8deg);
    }
    .actions .stampbtn[disabled] { opacity: 0.45; cursor: default; }
    /* The name is required, so the stamp is dead until there is one. */
    .stampbtn[disabled] { opacity: 0.4; cursor: default; }
    /* The versus card. Two kids across a ruled page, with the fold down
       the middle drawn the way a kid divides a notebook page for two
       columns: one pencil line, not a panel. Everything stays on the
       paper; nothing here is a new surface. */
    .chit .versus {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: start;
      gap: 0 10px;
      margin: 10px 0 2px;
    }
    .chit .versus .side { text-align: center; min-width: 0; }
    .chit .versus .who {
      font-family: var(--hand);
      font-size: 16px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: rgba(36, 66, 143, 0.72);
      margin: 0 0 4px;
    }
    /* One pen, in the middle, with the two names under it. Where the
       bench sets two pens against each other across a fold, a duel is
       two people reaching for the same object, and the paper should
       look like that rather than like a trade. */
    /* A pen that is not yours, said on the pen itself rather than in a
       footnote, because the whole point of the word is that it changes
       what losing this match costs you. */
    .chit .lent {
      font-style: normal;
      display: block;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-3);
    }
    /* They have not put a pen down yet. A gap the size of the pen that
       is coming, so the sheet does not jump when it arrives. */
    .chit .vspen.waiting {
      width: 100%;
      max-width: 150px;
      aspect-ratio: 5 / 2;
      margin: 0 auto;
      border-bottom: 1px dashed rgba(96, 126, 190, 0.4);
    }
    /* The pen that changed hands. The loudest thing on a result sheet,
       because it is the only part of the evening that is still true
       tomorrow morning. */
    .chit .tookpen { margin: 10px 0 4px; }
    .chit .tookpen .penshot { max-width: 168px; margin: 0 auto; }
    .chit .tookpen .pen {
      margin-top: 4px;
      font-family: var(--hand);
      font-size: 19px;
      color: var(--ink);
    }
    .chit .onepen { margin: 2px 0 6px; }
    .chit .onepen h2 { margin-top: 2px; }
    .chit .onepen .penshot { max-width: 210px; margin: 0 auto; }
    .chit .sides {
      display: flex; align-items: baseline; justify-content: center;
      gap: 12px; margin-bottom: 12px;
      font-family: var(--hand); font-size: 17px;
      text-transform: uppercase; letter-spacing: 0.04em;
      color: rgba(36, 66, 143, 0.72);
    }
    /* The vs is the smallest thing on the line: the names are the point,
       and the fold between them only has to be legible, not loud. */
    .chit .sides i {
      font-style: normal; font-size: 12px;
      color: var(--ink-3); letter-spacing: 0.1em;
    }
    /* Who has pressed ready, said out loud.
       A tick beside a name lived here before and did not work: it is a
       diacritic carrying the single most important fact on the screen,
       and it was read as decoration. This is a sentence, at a size that
       admits it is the point of the sheet. */
    .chit .saidgo {
      margin: 10px 0 12px;
      font-family: var(--hand);
      line-height: 1.25;
      text-align: center;
    }
    .chit .saidgo b {
      display: block;
      font-weight: 400;
      font-size: 22px;
      color: var(--ink);
      text-transform: lowercase;
    }
    .chit .saidgo span {
      display: block;
      margin-top: 1px;
      font-size: 16px;
      color: var(--ink-3);
    }
    /* Them ready and you not. The only one of these states that is a
       request rather than a report, so it is the only one underlined:
       a line scored under a word by hand is how a kid says "this bit". */
    .chit .saidgo.loud b {
      display: inline-block;
      font-size: 26px;
      /* Not a border: a border is a rule, and this is a pen stroke.
         Slightly overshooting the word at both ends is what makes it
         read as drawn rather than printed. */
      background:
        linear-gradient(to right, transparent 0, var(--ink) 2%, var(--ink) 98%, transparent 100%)
        left 100% / 100% 2px no-repeat;
      padding-bottom: 3px;
    }
    .chit .saidgo.loud span { margin-top: 5px; }
    /* The pens face each other across the fold, so the card reads as two
       sides of one desk rather than two pictures side by side. */
    .chit img.vspen {
      display: block;
      width: 100%;
      max-width: 150px;
      height: auto;
      /* Tipped toward the fold, so the two pens read as squaring up
         across the page rather than lying end to end in one line. */
      margin: 6px auto 8px;
      transform: rotate(-7deg);
      filter: drop-shadow(0 3px 5px rgba(40, 30, 10, 0.22));
    }
    .chit .versus .side:last-child .vspen { transform: scaleX(-1) rotate(-7deg); }
    /* Your own pen on a duel sheet can still be changed, so it is a
       button. It must not look like one: the affordance is that the pen
       moves when you touch it, the way a pen on a desk does, not a box
       drawn round it. */
    .chit .penswap {
      display: block;
      position: relative;
      width: 100%;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 140ms cubic-bezier(0.23, 1, 0.32, 1);
    }
    .chit .penswap:active { transform: scale(0.97); }
    .chit .penswap:focus-visible {
      outline: 2px solid rgba(36, 66, 143, 0.72);
      outline-offset: 5px;
      border-radius: 3px;
    }
    .chit .pickflag {
      display: inline-block;
      min-height: 24px;
      margin: -2px auto 1px;
      padding: 2px 5px 0;
      font-family: var(--hand);
      font-size: 13px;
      line-height: 1.15;
      letter-spacing: 0.03em;
      color: var(--ink);
      text-transform: lowercase;
      border-bottom: 1.5px solid var(--ink);
    }
    .chit .penstate {
      min-height: 28px;
      margin: 4px auto 0;
      font-family: var(--hand);
      font-size: 12px;
      line-height: 1.12;
      letter-spacing: 0.035em;
      color: var(--ink-3);
      text-transform: uppercase;
    }
    .chit .penstate.mine { color: rgba(36, 66, 143, 0.82); }
    .chit .penstate.borrowed { color: var(--ink-3); }
    .chit .invitesound {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin: 10px 0;
      padding: 7px 3px 5px;
      border: 0;
      border-top: 1px solid var(--ink-3);
      border-bottom: 1px solid var(--ink-3);
      background: transparent;
      color: var(--ink-2);
      font: 17px/1 var(--hand);
      cursor: pointer;
    }
    .chit .invitesound i {
      position: relative;
      width: 38px;
      height: 22px;
      border: 1.5px solid var(--ink);
      border-radius: 12px;
      background: rgba(36, 66, 143, 0.08);
    }
    .chit .invitesound i::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--ink-2);
      transition: transform 140ms ease, background 140ms ease;
    }
    .chit .invitesound[aria-checked="true"] i {
      background: rgba(36, 66, 143, 0.24);
    }
    .chit .invitesound[aria-checked="true"] i::after {
      background: var(--ink);
      transform: translateX(16px);
    }
    /* Waiting for somebody to sit down is the one place in this game
       where nothing is happening and the player has to believe something
       still is. Three dots taking their turn, no spinner: a spinner is a
       piece of software talking about itself. */
    .chit .waiting .dots { margin-left: 1px; }
    .chit .waiting .dots i {
      font-style: normal;
      opacity: 0.25;
      animation: pfwait 1.5s ease-in-out infinite;
    }
    .chit .waiting .dots i:nth-child(2) { animation-delay: 0.25s; }
    .chit .waiting .dots i:nth-child(3) { animation-delay: 0.5s; }
    @keyframes pfwait { 0%, 70%, 100% { opacity: 0.25; } 35% { opacity: 1; } }
    /* Three at one desk is a row, not a face-off: the fold in the middle
       is what two people square up across, and there is no middle when
       there are three of them. */
    .chit .versus.crowd {
      grid-template-columns: repeat(3, 1fr);
      gap: 0 6px;
    }
    /* The seat with nobody in it.
       On the invite, .vspen.waiting is a gap the size of the pen that is
       coming, because one is coming: they are at the desk and still
       choosing. Here nobody has sat down at all, so the same seat is
       drawn as the empty place itself, a pen-shaped outline lying at the
       same tilt as the pen opposite and taking exactly the room one
       takes. A gap five times too tall pushed the name off the line and
       read as a stray rule rather than as a seat. */
    .chit .versus.desk .vspen.waiting {
      aspect-ratio: auto;
      height: 13px;
      margin: 6px auto 8px;
      border: 1.5px dashed rgba(96, 126, 190, 0.44);
      border-radius: 7px;
      transform: rotate(-7deg);
    }
    .chit .versus.desk .side:last-child .vspen.waiting { transform: scaleX(-1) rotate(-7deg); }
    /* A pen landing in the seat nobody is in yet. Opacity only: the pens
       are tipped toward the fold and the far one is mirrored, so anything
       that animates transform here would have to know which side of the
       desk it is on, and this does not need to. */
    .chit .versus.desk .vspen.swap { animation: pfswap 300ms ease-out both; }
    @keyframes pfswap { from { opacity: 0.12; } to { opacity: 1; } }
    /* The wait is over and the desk is opening. Its controls are all
       about a wait, so they fade out of the way rather than sitting there
       looking pressable for the second it takes to get there. */
    .chit .howlink:disabled, .chit .backchev:disabled {
      opacity: 0.3;
      cursor: default;
      text-decoration-color: transparent;
    }
    /* Waiting for somebody to sit down, done the way a kid actually
       waits at a desk: the pen gets nudged about. Not a full turn, which
       would swing the pen over its own name and read as a fidget
       spinner, and not a spinner, which this game does not have. A few
       degrees, held between moves, so it reads as a hand with nothing to
       do rather than as software reporting on itself. */
    .chit .vspen.nudge { animation: pfnudge 5.5s cubic-bezier(0.25, 0.9, 0.35, 1) infinite; }
    @keyframes pfnudge {
      0%, 22%   { transform: rotate(-7deg); }
      30%, 52%  { transform: rotate(-1.5deg); }
      60%, 82%  { transform: rotate(-9.5deg); }
      90%, 100% { transform: rotate(-7deg); }
    }
    /* Somebody pulling up a chair. On the seat rather than on the pen,
       because the second pen is mirrored across the fold and an
       animation on it would have to know that. */
    .chit .versus .side.sat { animation: pfsat 420ms cubic-bezier(0.2, 0.85, 0.3, 1) both; }
    @keyframes pfsat {
      0%   { opacity: 0; transform: translateY(-9px) scale(0.96); }
      60%  { opacity: 1; transform: translateY(1px) scale(1.01); }
      100% { opacity: 1; transform: none; }
    }
    /* The second half of a wait: what the sheet says once silence has
       stopped meaning "any second now". Absent, not hidden, until then. */
    .chit .waitlong { display: none; }
    .chit .waitlong.show {
      display: block;
      margin-top: 15px;
      animation: pfwaitlong 340ms ease-out both;
    }
    @keyframes pfwaitlong {
      from { opacity: 0; transform: translateY(7px); }
      to   { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .chit .vspen.nudge { animation: none; }
      .chit .versus .side.sat { animation: none; }
      .chit .waitlong.show { animation: none; }
      .chit .waiting .dots i { animation: none; opacity: 0.55; }
      .chit .penswap, .chit .penswap .vspen { transition: none; }
      .boxwrap.duelpick .tinlid,
      .boxwrap.duelpick .tinframe,
      .boxwrap.duelpick .boxstack { transition-duration: 0.01ms; }
    }
    .chit .penswap .vspen { transition: transform 120ms ease-out; }
    .chit .penswap:not(:disabled):active .vspen { transform: rotate(-3deg) scale(1.04); }
    .chit .versus .pen {
      font-family: var(--hand);
      font-size: 16px;
      line-height: 1.15;
      color: var(--ink);
      margin: 0;
    }
    .chit .vsmark {
      align-self: center;
      position: relative;
      padding: 0 2px;
    }
    /* The divider is drawn, not bordered: a line down the page. */
    .chit .vsmark::before {
      content: '';
      position: absolute;
      left: 50%; top: -6px; bottom: -6px;
      width: 1px;
      background: rgba(36, 66, 143, 0.22);
    }
    .chit .vsmark span {
      position: relative;
      display: block;
      background: var(--paper);
      padding: 5px 1px;
      font-family: var(--stamp);
      font-size: 15px;
      letter-spacing: 0.06em;
      color: var(--red);
      text-transform: uppercase;
    }

    /* ---- The school corridor and the 2-v-1 terms ----
       Still the one notebook-paper component. The corridor is written as
       doors because destinations are the decision; the fight is staged in
       the same near/far formation as the physical desk: their two students
       together above, you alone below. */
    .chit.schoolpaper { width: min(94vw, 610px); }
    /* Corridor is a bigger sheet - vertical rail + a full match card need room. */
    .chit.schoolcorridorpaper { width: min(96vw, 1180px); max-height: calc(100dvh - 12px); }
    .chit .schooldoors {
      display: grid; grid-template-columns: 1fr;
      gap: 8px; margin: 14px 0 10px;
    }
    .chit .schooldoors-heading,
    .chit .schooldoors-later > p {
      margin: 0; color: var(--ink-2); font-family: var(--stamp); font-size: 10px;
      letter-spacing: .1em; text-align: left; text-transform: uppercase;
    }
    .chit .schooldoors-later {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: end; gap: 8px; margin-top: 7px; padding-top: 8px; border-top: 1px solid rgba(36,66,143,.22);
    }
    .chit .schooldoors-later > p { grid-column: 1 / -1; }
    .chit .schooldoor {
      position: relative; display: block; min-width: 0; width: 100%; padding: 0;
      border: 0; background: transparent; color: var(--ink); font-family: var(--hand);
      text-align: left; cursor: pointer; transform: rotate(-0.35deg);
    }
    .chit .schooldoor:nth-child(even) { transform: rotate(0.45deg); }
    .chit .schooldoor:focus-visible {
      outline: 3px solid var(--ink); outline-offset: 4px; border-radius: 2px;
    }
    .chit .schooldoor-visual {
      position: relative; display: block; overflow: hidden; isolation: isolate;
      width: 100%; height: clamp(145px, 24vh, 190px); border: 3px solid #273b48;
      background: linear-gradient(to bottom, #d8c49c 0 76%, #76909a 76% 88%, #704b38 88%);
      box-shadow: 0 4px 0 rgba(42, 35, 27, 0.32);
    }
    .chit .schooldoors-later .schooldoor { opacity: .62; cursor: default; transform: none; }
    .chit .schooldoors-later .schooldoor.invited { opacity: 1; cursor: pointer; }
    /* A room you already own. It reads settled rather than inviting - the

    /* Champion journey -------------------------------------------------
       The release, attendance and restore papers share a visual grammar:

       one primary job and one quiet escape, so the metaphor never hides the
       decision being made. */
    .chit .schoolpromise {
      margin: 12px 0; padding: 9px 11px; border: 1px dashed rgba(36,66,143,.42);
      color: var(--ink-2); font-size: 14px; line-height: 1.15; text-align: center;

    .chit .attendancepass {
      display: grid; grid-template-columns: 58px minmax(0, 1fr); align-items: center; gap: 11px;
      margin: 8px 0 12px; padding: 9px 12px 8px; border: 2px solid var(--ink);
      box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 4px rgba(36,66,143,.28);
      text-align: left; transform: rotate(-.45deg);
    }

      display: grid; place-items: center; width: 54px; aspect-ratio: 1; border: 1px solid var(--ink-2);
      color: var(--paper-hi); background: var(--ink); font-family: var(--stamp); font-size: 27px;
      transform: rotate(-2deg);

    .chit .attendancepass > span:last-child { display: grid; min-width: 0; }

    .chit .attendancepass.present b { color: var(--ink); }
    .chit .attendancehonest { margin: 8px 8px 0; color: var(--ink-3); font-size: 11px; line-height: 1.15; text-align: center; }
    .chit.attendancecheckingpaper { width: min(86vw, 360px); text-align: center; }

    @keyframes attendancecheckpulse {

    @media (prefers-reduced-motion: reduce) {

    .chit .attendancestamp {

    .chit .nag.nagging { color: var(--red); opacity: 1; }
    .actions .shutbtn {

    /* A pen lying on a sheet of paper, with its shadow. */
    .penshot {

    .penshot.faded { opacity: 0.45; filter: grayscale(0.55) drop-shadow(0 4px 6px rgba(40,30,12,0.3)); }
    .topbtns {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      right: 10px;
      z-index: 6;
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .toputilities {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .soundcontrol {
      position: relative;
      transition: opacity 0.18s ease;
    }
    .playdoors {
      display: contents;
    }
    .ambbtn, .boardbtn {
      height: 44px;
      min-width: 44px;
      padding: 0 11px;
      border: 1px solid rgba(240, 234, 220, 0.26);
      border-radius: 10px;
      background: rgba(30, 26, 20, 0.42);
      color: #f0eadc;
      font-family: var(--hand);
      font-size: 15px;
      line-height: 42px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .ambbtn {
      position: relative;
      padding: 0;
      transition: transform 140ms cubic-bezier(0.23, 1, 0.32, 1), color 140ms ease;
    }
    .ambbtn:active, .soundrow:active { transform: scale(0.97); }
    .ambbtn.partial::after {
      content: '';
      position: absolute;
      top: 8px;
      right: 8px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #e0aa57;
    }
    .ambbtn:focus-visible, .soundrow:focus-visible {
      outline: 2px solid var(--paper-hi);
      outline-offset: 2px;
    }
    /* Sound options belong to the same room as every other decision: one
       torn piece of ruled notebook paper, anchored to the button that put
       it down. It is a setting, not a new screen or a stock dropdown. */
    .topbtns:has(.soundpanel.open) {
      z-index: 2147483647;
    }
    .soundpanel {
      position: absolute;
      z-index: 2147483647;
      top: calc(100% + 8px);
      right: 0;
      width: min(238px, calc(100vw - 24px));
      padding: 15px 12px 13px 34px;
      color: var(--ink);
      background-color: var(--paper);
      background-image:
        var(--paper-tex, none),
        repeating-linear-gradient(transparent 0 26px, rgba(96, 126, 190, 0.22) 26px 27px);
      background-size: 180px 180px, auto;
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.42);
      clip-path: polygon(0 4px, 9% 1px, 18% 5px, 28% 1px, 39% 5px, 51% 1px, 62% 5px, 73% 1px, 84% 5px, 94% 1px, 100% 4px, 100% 100%, 0 100%);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(-4px) scale(0.97);
      transform-origin: top right;
      transition: opacity 140ms ease-out, transform 160ms cubic-bezier(0.23, 1, 0.32, 1), visibility 0s linear 160ms;
    }
    .soundpanel::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 23px;
      width: 1.5px;
      background: rgba(191, 59, 43, 0.5);
    }
    .soundpanel.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0) scale(1);
      transition-delay: 0s;
    }
    .soundtitle {
      margin: 0 0 4px;
      font-family: var(--stamp);
      font-size: 12px;
      line-height: 18px;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: var(--ink-2);
    }
    .soundrow {
      width: 100%;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 2px;
      border: 0;
      border-bottom: 1px solid rgba(36, 66, 143, 0.16);
      background: transparent;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      transition: transform 140ms cubic-bezier(0.23, 1, 0.32, 1);

      width: 34px;
      height: 20px;
      border: 1px solid rgba(36, 66, 143, 0.36);

      background: rgba(36, 66, 143, 0.12);
    }

      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: rgba(36, 66, 143, 0.48);
      transition: transform 160ms cubic-bezier(0.23, 1, 0.32, 1), background-color 140ms ease;
    }

    .soundrow[aria-checked="true"] i::after {
      background: var(--ink);
      transform: translateX(14px);
    }
    /* The other game mode is the one offering in the dark chrome. It keeps
       the whole phrase: shortening it to "friend" saves space and loses
       the verb that tells somebody this is a way to play. */
    .playfriendtop {
      white-space: nowrap;
      transition: transform 140ms cubic-bezier(0.23, 1, 0.32, 1), opacity 140ms ease,
        background-color 160ms ease, color 160ms ease;
    }
    /* Icon-only utilities live in one short vertical rail. This keeps two
       destinations readable without letting a third word crowd the pen chip. */
    .sharetop {
      background: rgba(30, 26, 20, 0.42);
      color: #f0eadc;
    }
    .sharetop svg {
      display: block; width: 18px; height: 18px; margin: auto;
      fill: none; stroke: currentColor; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .playfriendtop:active { transform: scale(0.97); }
    .playfriendtop:focus-visible {
      outline: 2px solid var(--paper-hi);
      outline-offset: 2px;
    }
    .playfriendtop[aria-disabled="true"] { opacity: 0.68; }

    /* One paper-coloured button up here, ever.
       While there is a sign-in to do, it is the sign-in: it is the only
       control in this band that changes what happens to the pens, and
       everything else can wait. Once it is done the chip goes and the
       paper passes to the mode door, which is what it was before any of
       this existed. Two whites is two primaries, which is none. */
    .topbtns.signedin .playfriendtop,
    .topbtns.signedin .corridortop {
      background: var(--paper-hi);
      border-color: rgba(24, 16, 6, 0.34);
      color: var(--ink);
    }
    /* Signing in, in paper rather than dark glass: it is the one control
       up here that changes what happens to the pens, and it is only ever
       on screen while it still has something to ask. */
    .signintop {
      background: var(--paper-hi);
      border-color: rgba(24, 16, 6, 0.34);
      color: var(--ink);
      white-space: nowrap;
      transition: transform 140ms cubic-bezier(0.23, 1, 0.32, 1);
    }
    .signintop:active { transform: scale(0.97); }
    .signintop:focus-visible { outline: 2px solid var(--paper-hi); outline-offset: 2px; }
    /* Signed out on its own, or a result actually refused: the same red
       the diary uses for it, so the two surfaces say one thing. */
    .signintop.wants { color: var(--red); border-color: rgba(176, 54, 42, 0.5); }
    .signintop[hidden] { display: none; }

    /* Parked-chip row look lives after the chip rules, below. */
    .menuextra:empty { display: none; }

    /* A place to go, in the menu that also owns the sound. Not a switch:
       it leaves, so it takes a chevron and no state. */
    .menulink {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      width: 100%; margin: 0 0 9px; padding: 0 0 9px;
      background: none; border: 0; border-bottom: 1px solid rgba(90, 103, 136, 0.28);
      color: var(--ink); cursor: pointer; text-align: left;
      font-family: var(--hand); font-size: 16px; line-height: 1.2;
    }
    .menulink i { font-family: var(--stamp); font-size: 13px; color: rgba(90, 103, 136, 0.6); font-style: normal; }
    .menulink:active { color: var(--red); }
    .menulink:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

    /* The same dark glass the ranking wears, deliberately: this is a door
       out of the room, not a way to play. Written, not stamped, and
       underlined so a word sitting in the chrome still reads as a link. */
    .commbtn {
      font-family: var(--hand);
      text-transform: lowercase;
      letter-spacing: 0.02em;
      text-decoration: underline;
      text-decoration-color: rgba(240, 234, 220, 0.4);
      text-underline-offset: 3px;
      white-space: nowrap;
    }
    .commbtn:active { color: #fff; }
    /* Same chip as the other play doors. Hidden while the diary still
       says climbing, so a player who cannot open it never sees it. */
    .corridortop { white-space: nowrap; }
    .corridortop[hidden] { display: none; }
    /* A chip parked in the menu stops being a chip. Same node, same
       handler; it wears the lined-paper row it is sitting in. Has to
       beat the paper-hi friend chip and the phone fixed-position row
       or those two sit on the sheet as boxes. */
    .soundpanel .inmenu,
    .soundpanel .inmenu.boardbtn,
    .topbtns .soundpanel .inmenu,
    .topbtns.signedin .soundpanel .inmenu,
    .topbtns.signedin .soundpanel .inmenu.playfriendtop,
    .topbtns.signedin .soundpanel .inmenu.playstrangertop,
    .soundpanel .inmenu.playfriendtop,
    .soundpanel .inmenu.playstrangertop,
    .soundpanel .inmenu.corridortop,
    .soundpanel .inmenu.commbtn {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      position: static; top: auto; right: auto; inset: auto;
      width: 100%; min-width: 0; height: auto; min-height: 0;
      margin: 0 0 9px; padding: 0 0 9px;
      background: none; border: 0; border-bottom: 1px solid rgba(90, 103, 136, 0.28);
      border-radius: 0; box-shadow: none; filter: none;
      color: var(--ink); text-align: left; text-decoration: none;
      font-family: var(--hand); font-size: 16px; line-height: 1.2;
      letter-spacing: 0; text-transform: lowercase;
    }
    .soundpanel .inmenu::after,
    .soundpanel .inmenu.boardbtn::after,
    .soundpanel .inmenu.corridortop::after,
    .soundpanel .inmenu.playfriendtop::after,
    .soundpanel .inmenu.commbtn::after {
      content: '\203A';
      font-family: var(--stamp); font-size: 13px; color: rgba(90, 103, 136, 0.6);
      text-decoration: none;
    }
    .soundpanel .inmenu:hover,
    .soundpanel .inmenu.corridortop:hover,
    .soundpanel .inmenu.playfriendtop:hover {
      background: none; color: var(--ink);
    }
    .soundpanel .inmenu:active,
    .soundpanel .inmenu.playfriendtop:active,
    .soundpanel .inmenu.corridortop:active,
    .soundpanel .inmenu.commbtn:active {
      color: var(--red); transform: none; background: none;
    }
    .soundpanel .inmenu:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .ambbtn { font-size: 18px; padding: 0; }
    .ambbtn:active, .boardbtn:active { transform: scale(0.96); }
    .ambbtn:focus-visible, .boardbtn:focus-visible { outline: 2px solid #f0eadc; outline-offset: 2px; }
    .ambbtn.off { color: rgba(240, 234, 220, 0.45); }
    /* The only sign a tap on a slow connection landed at all: the request
       is real work happening somewhere off screen, so the button breathes
       until it's back rather than sitting there looking untouched. */
    @keyframes boardbtnwait { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    .boardbtn.loading { animation: boardbtnwait 0.9s ease-in-out infinite; pointer-events: none; }
    @keyframes chipthump {
      0% { transform: scale(1); }
      35% { transform: scale(1.16); }
      100% { transform: scale(1); }
    }
    .penchip.thump { animation: chipthump 0.5s cubic-bezier(0.2, 1.2, 0.3, 1); }
    .penchip {
      position: fixed;
      bottom: max(10px, env(safe-area-inset-bottom));
      left: 10px;
      z-index: 6;
      display: flex;
      align-items: center;
      gap: 8px;
      border: none;
      background: transparent;
      padding: 4px;
      cursor: pointer;
    }
    /* An explicit display beats the UA rule for [hidden], so the chip stayed
       on screen every time code asked it to go away. 9C is where that shows:
       it hides the chip for the whole match and the chip sat under the
       eraser count instead. */
    .penchip[hidden] { display: none; }
    .penchip img {
      width: 62px; height: auto; display: block;
      filter: drop-shadow(0 4px 7px rgba(0,0,0,0.55));
    }
    .penchip span {
      font-family: var(--hand);
      font-size: 15px;
      color: rgba(244, 238, 224, 0.9);
      text-shadow: 0 1px 5px rgba(0,0,0,0.65);
    }
    .btn-reset {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      right: 12px;
      padding: 8px 14px;
      border: 1px solid #55555588;
      border-radius: 6px;
      background: #ffffff66;
      color: #222;
      font-size: 13px;
      cursor: pointer;
    }
    #debug-panel {
      position: fixed;
      top: 0; right: 0;
      width: 270px;
      max-height: 100vh;
      overflow-y: auto;
      background: #1e1e1ee6;
      color: #ddd;
      font: 11px/1.5 ui-monospace, monospace;
      padding: 10px;
      z-index: 10;
    }
    #debug-panel.brain-only {
      top: max(12px, env(safe-area-inset-top));
      right: 12px;
      width: 300px;
      max-height: calc(100vh - 24px - env(safe-area-inset-top));
      border: 1px solid #8ecdf744;
      border-radius: 12px;
      box-shadow: 0 12px 40px #0008;
      z-index: 10001;
    }
    #debug-panel.brain-only h4 {
      margin-top: 0;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    #debug-panel h4 { margin: 8px 0 2px; color: #8ecdf7; font-size: 11px; }
    #debug-panel label { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    #debug-panel label span.val { min-width: 48px; text-align: right; color: #ffd479; }
    #debug-panel input[type=range] { flex: 1; }
    #debug-panel button { margin: 2px 2px 2px 0; padding: 3px 8px; font-size: 11px; }
    #debug-brain {
      display: grid;
      gap: 7px;
      margin: 3px 0 7px;
      padding: 9px;
      border: 1px solid #ffffff1f;
      border-radius: 8px;
      background: linear-gradient(145deg, #111820, #19151c);
      box-shadow: inset 0 1px 0 #ffffff0a;
    }
    #debug-brain p { margin: 0; }
    #debug-brain .debug-brain-empty { color: #8f9aa5; line-height: 1.45; }
    #debug-brain .debug-brain-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    #debug-brain .debug-brain-head strong {
      padding: 2px 7px;
      border: 1px solid #7fd6a855;
      border-radius: 99px;
      color: #9ff0c0;
      font-size: 10px;
      letter-spacing: .08em;
    }
    #debug-brain .debug-brain-head span { color: #8ecdf7; }
    #debug-brain .debug-brain-action { color: #f7d584; white-space: normal; }
    #debug-brain .debug-brain-facts { display: flex; flex-wrap: wrap; gap: 4px; }
    #debug-brain .debug-brain-facts span {
      padding: 1px 5px;
      border-radius: 3px;
      background: #ffffff0b;
      color: #bac4ce;
      font-size: 9px;
    }
    #debug-brain .debug-brain-model { color: #d6dce2; line-height: 1.4; }
    #debug-brain .debug-brain-reply { padding-left: 7px; border-left: 2px solid #c597f144; color: #cbb7e5; line-height: 1.4; }
    #debug-brain .debug-brain-list { display: grid; gap: 2px; }
    #debug-brain .debug-brain-row {
      display: grid;
      grid-template-columns: 18px 1fr auto;
      align-items: center;
      gap: 5px;
      padding: 3px 5px;
      border-radius: 4px;
      color: #9ba5af;
    }
    #debug-brain .debug-brain-row.chosen { background: #78d8a315; color: #eef9f2; outline: 1px solid #78d8a329; }
    #debug-brain .debug-brain-row .rank { color: #6f7b87; text-align: center; }
    #debug-brain .debug-brain-row.chosen .rank { color: #8ae4b1; }
    #debug-brain .debug-brain-row .move { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #debug-brain .debug-brain-row .score { color: #f1c97b; font-variant-numeric: tabular-nums; }
    #debug-overlay {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: 12px;
      color: #1a1a1a;
      font: 11px/1.5 ui-monospace, monospace;
      white-space: pre;
      pointer-events: none;
      z-index: 9;
    }
    @media (max-width: 700px) {
      #debug-panel.brain-only {
        top: auto;
        right: 8px;
        bottom: calc(8px + env(safe-area-inset-bottom));
        left: 8px;
        width: auto;
        max-height: 46vh;
      }
    }
      /* A phone is not this layout made smaller, so it is not laid out the
       same way. It gets one screen and no scrolling: the two actions are
       pinned in the thumb zone where a thumb actually is, the pen becomes
       a line of caption rather than a card competing with the tin, and the
       tin takes every pixel of height that is left over. The tin is the
       reason anyone opened this screen, so on the smaller display it gets
       more of the screen, not less. */
    @media (max-width: 900px), (orientation: portrait) {
      /* The rail is a desktop idea. On a phone it dissolves so its three
         parts take their own places around the tin: the bar above it, the
         caption and the buttons below. */
      .boxrail { display: contents; }
      .boxbar { grid-area: bar; }
      .tinframe { grid-area: tin; }
      .pencard { grid-area: card; }
      .actions { grid-area: actions; }
      /* Reading order is the order of importance, top to bottom: the tin
         you came to look at, one line saying what is selected, the one
         thing you can do about it, and the utilities last. Share and
         ranking used to own the top of the screen while being the least
         important things on it. */
      .boxstack {
        grid-template-columns: 1fr;
        grid-template-areas: "tin" "card" "actions" "bar";
        grid-template-rows: 1fr auto auto auto;
        height: 100dvh;
        width: 100vw;
        gap: 0;
        padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      }
      /* Fit inside the row both ways. Driving height and letting
         aspect-ratio produce the width cannot be clamped by max-width,
         so a tall row pushed the tin off both edges of the phone; driving
         width and capping height shrinks it on both axes together. */
      .tinframe {
        width: 100%;
        height: auto;
        max-height: 100%;
        min-height: 0;
        justify-self: center;
        align-self: center;
        filter: drop-shadow(0 14px 22px rgba(0,0,0,0.55));
      }
      .boxbar { margin: 0 0 8px; }
      .barbtn, .boxtab { padding: 7px 12px 6px; font-size: 12px; }
      /* A caption, not a second object. The tin already shows the pen
         lying in its channel; a paper card showing the same pen again,
         under a second copy of the logo, next to a career tally that has
         nothing to do with which pen is selected, was one whole object
         more than this screen has room for. What is left is the two facts
         that answer "what am I looking at": its name, and where it came
         from. */
      .pencard {
        background: none;
        border: none;
        box-shadow: none;
        padding: 0;
        margin: 18px 0 0;
        text-align: center;
        transform: none;
      }
      .pencard::before,
      .pencard .pencard-mark,
      .pencard img.oncard,
      .pencard .cardtally { display: none; }
      .pencard h4 {
        font-family: var(--hand);
        font-size: 23px;
        margin: 0;
        color: #f6f0e2;
        border: none;
        text-decoration: none;
      }
      .pencard h4::after, .pencard h4::before { display: none; }
      .pencard p { font-size: 13px; margin: 4px 0 0; color: rgba(246,240,226,0.6); }
      .pencard p.state { color: #edc987; }
      /* The stamp sits in the line rather than floating off a corner that
         no longer exists. */
      .wonflag {
        position: static;
        display: inline-block;
        margin: 0 0 8px;
        transform: rotate(-1.5deg);
      }

      /* One primary action, thumb sized. When there is nothing to equip
         the equip button is gone, not greyed, and shutting the box is the
         primary. */
      .actions { margin: 18px 0 0; gap: 10px; }
      .actions .stampbtn, .actions .shutbtn {
        min-height: 52px;
        font-size: 15px;
      }
      .actions.inert .stampbtn { display: none; }
      .actions.inert .shutbtn { flex: 1; }

      /* Utilities: present, reachable, and quiet. */
      .boxbar { margin: 14px 0 0; justify-content: center; }
      .boxbar .boxtabs { flex: 0 0 auto; }
      .boxbar .barbtn {
        background: none;
        border: none;
        padding: 10px 14px;
        color: rgba(246,240,226,0.52);
        font-size: 12px;
      }
      /* The caption sits on a note.
         Floating it straight onto the 3D desk meant reading pale text
         over wood grain, chalk marks and whatever pen happened to be
         lying there: contrast changed with the scene behind it. A note is
         the game's own way of saying something in writing, it gives the
         words a surface to sit on, and it groups them with the button
         underneath so the two read as one block instead of drifting. This
         is not the old card coming back: no second logo, no repeat of the
         pen, no career tally. Just the label. */
      .pencard {
        background: linear-gradient(180deg, #f2ecdc 0%, #e7dfca 100%);
        border-radius: 2px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.42);
        padding: 13px 18px 15px;
        margin: 16px 0 0;
        text-align: center;
      }
      .pencard h4 { color: var(--ink); font-size: 21px; line-height: 1.15; }
      .pencard p {
        color: rgba(36, 66, 143, 0.66);
        font-size: 13px;
        letter-spacing: 0.02em;
        margin: 5px 0 0;
      }
      .pencard p.state { color: var(--red); margin-top: 7px; }

      /* Secondary, but still buttons. Flat text read as a caption and
         nobody could tell they could be tapped. */
      .boxbar .barbtn {
        background: rgba(246, 240, 226, 0.09);
        border: 1px solid rgba(246, 240, 226, 0.3);
        border-radius: 3px;
        min-height: 44px;
        padding: 12px 22px;
        color: rgba(246, 240, 226, 0.86);
        font-size: 12px;
      }

      /* The pen chip moves off the desk.
         Bottom left is the corner a right-handed thumb crosses to aim, and
         on a phone the desk reaches all the way down there, so the chip sat
         in the middle of the play surface and in the way of the drag. The
         top band is over the blackboard, which is scenery rather than
         playfield, so all the chrome lives up there together and the whole
         lower screen belongs to the game. */
      .penchip {
        top: max(8px, env(safe-area-inset-top));
        bottom: auto;
        left: 12px;
      }
      .penchip img { width: 44px; }
      /* The chip and the buttons share this one row, and neither of them
         is a fixed width: the band grew when a second mode was added, and
         the chip says "Reynolds Racer Gel · next match" as readily as it
         says "Reynolds 045". So the band gets tightened, and the chip is
         capped at what is left over and runs out rather than sliding
         under the buttons on a narrow phone. */
      .topbtns { gap: 6px; }
      .toputilities { gap: 5px; }
      .ambbtn, .boardbtn { padding: 0 9px; font-size: 14px; }
      .ambbtn { padding: 0; }
      /* Keep the complete mode name without crushing the pen name into the
         same row. Ranking and sound stay on row one; the mode door sits on
         its own line over the blackboard, never over the play surface. */
      .playfriendtop {
        position: fixed;
        top: calc(max(8px, env(safe-area-inset-top)) + 52px);
        right: 12px;
        min-height: 38px;
      }
      /* Once it is the one thing outside the menu it goes back into the
         band, because the band now has room for it: the row it used to
         need was only ever there because a ranking chip and a sound chip
         were sitting where it wanted to be. */
      .topbtns.signedin .playfriendtop,
      .topbtns.signedin .corridortop {
        position: static;
        top: auto;
        right: auto;
        min-height: 44px;
      }
      .soundpanel .inmenu,
      .soundpanel .inmenu.boardbtn,
      .topbtns.signedin .soundpanel .inmenu,
      .topbtns.signedin .soundpanel .inmenu.playfriendtop,
      .soundpanel .inmenu.playfriendtop,
      .soundpanel .inmenu.playstrangertop {
        position: static;
        top: auto;
        right: auto;
        inset: auto;
        height: auto;
        min-height: 0;
        padding: 0 0 9px;
        background: none;
        border: 0;
        border-bottom: 1px solid rgba(90, 103, 136, 0.28);
        box-shadow: none;
      }
      .playstrangertop {
        top: calc(max(8px, env(safe-area-inset-top)) + 96px);
      }
      .coffeebreak {
        top: calc(max(8px, env(safe-area-inset-top)) + 50px);
        right: 12px;
        min-height: 38px;
        padding-right: 1px;
        font-size: 14px;
      }
      .giftbtn {
        top: calc(max(8px, env(safe-area-inset-top)) + 48px);
        right: 6px;
        width: 48px;
        height: 48px;
      }
      .giftbtn svg { width: 36px; height: 36px; }
      .giftbtn .anamalogo { width: 44px; height: auto; }
      .penchip { max-width: calc(100% - 237px); }
      .penchip span {
        display: block;
        font-size: 13px;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    
      /* ---- One slip of paper, not four inventions ----
         The screen is two things: the tin, and the note that came with it.
         Everything that is not the tin lives on a single leaf of the same
         notebook paper the terms and the verdict are already written on:
         same cream, same ruling, same torn edge, same red margin, same
         stamped button. What was here before was a flat cream rectangle
         that existed nowhere else in the game, a translucent brown button,
         and two outlined chips: four different surfaces stacked down the
         screen, none of which belonged to the set. */
      .boxrail {
        display: flex;
        flex-direction: column;
        gap: 14px;
        position: relative;
        margin: 16px 0 0;
        padding: 20px 18px 18px 34px;
        color: var(--ink);
        background-color: var(--paper);
        background-image:
          var(--paper-tex, none),
          repeating-linear-gradient(transparent 0 26px, rgba(96, 126, 190, 0.22) 26px 27px);
        background-size: 180px 180px, auto;
        box-shadow: 0 -6px 34px rgba(0, 0, 0, 0.5);
        clip-path: polygon(
          0 7px, 5% 1px, 11% 8px, 17% 2px, 24% 9px, 31% 2px, 38% 8px, 45% 1px,
          52% 8px, 59% 2px, 66% 9px, 73% 2px, 80% 8px, 87% 1px, 94% 8px, 100% 3px,
          100% 100%, 0 100%
        );
      }
      /* The margin rule, in the same place it sits on every other page. */
      .boxrail::before {
        content: '';
        position: absolute;
        top: 0; bottom: 0; left: 23px;
        width: 1.5px;
        background: rgba(191, 59, 43, 0.5);
      }
      .boxrail .pencard { order: 1; }
      .boxrail .actions { order: 2; }
      .boxrail .boxbar  { order: 3; }

      /* Written on the page, so it needs no surface of its own. */
      .pencard {
        background: none;
        box-shadow: none;
        border-radius: 0;
        padding: 0;
        margin: 0;
        text-align: center;
      }
      .pencard h4 { color: var(--ink); font-size: 22px; margin: 0; }
      .pencard p { color: rgba(36, 66, 143, 0.68); font-size: 13px; margin: 4px 0 0; }
      .pencard p.state { color: var(--red); margin-top: 6px; }
      .pencard.stakecard .stakehead { margin: 0 0 10px; padding-bottom: 9px; }
      .pencard.stakecard .stakehead h3 { font-size: 20px; }
      .pencard.stakecard .stakehead p { display: block; font-size: 13px; }

      /* The stamp, exactly as it is stamped on every other page. */
      .actions { margin: 0; gap: 10px; }
      .actions .shutbtn, .actions .stampbtn {
        min-height: 52px;
        border-radius: 0;
        border: 2px solid var(--ink);
        box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 5px var(--ink);
        background: transparent;
        color: var(--ink);
        font-family: var(--stamp);
        font-size: 15px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .boxwrap.stakepick .actions .shutbtn {
        min-height: 38px;
        color: rgba(36, 66, 143, 0.8);
        box-shadow: none;
      }

      /* Secondary, and written rather than boxed: on paper a link is
         underlined, it does not become a third kind of button. */
      .boxbar { margin: 0; justify-content: center; gap: 26px; }
      .boxbar .barbtn {
        background: none;
        border: none;
        min-height: 44px;
        padding: 10px 4px;
        color: rgba(36, 66, 143, 0.8);
        font-family: var(--hand);
        font-size: 15px;
        letter-spacing: 0.03em;
        text-transform: none;
        text-decoration: underline;
        text-underline-offset: 4px;
        text-decoration-thickness: 1.5px;
      }
      /* The bar has come down onto paper here, where its buttons are
         written and underlined rather than stamped. The link is one of
         them, so it gives its anchor reset back. */
      .boxbar a.barbtn {
        text-decoration: underline;
        text-decoration-color: rgba(36, 66, 143, 0.45);
        text-underline-offset: 4px;
        text-decoration-thickness: 1.5px;
      }

      /* Two rows now: the object, and the page about it. */
      .boxstack {
        grid-template-areas: "tin" "rail";
        grid-template-rows: 1fr auto;
        padding: 10px 0 calc(6px + env(safe-area-inset-bottom));
      }
      .boxrail { grid-area: rail; }
      .tinframe { width: calc(100% - 32px); }

      /* School stake picker: on a phone the open lid is scenery and the
         tray is the control. Crop to the real tray half instead of
         compressing the full photograph; the pens keep their measured
         channel positions through --tray-slot-top. */
      .boxwrap.stakepick .boxstack {

        max-height: none;

        align-self: end;

    .chit.schoolcorridorpaper .scrollcue { display:none; }
    /* Human welcome, sits above the rail. Two-line intro sets what
       "the corridor" is for a first-time reader. */
    .chit .corridorhello { margin:2px 0 14px; padding:0; }
    .chit .corridorhi { margin:0 0 2px; font:20px/1.15 var(--hand); color:var(--ink); }
    .chit .corridorhi b { font-weight:normal; color:var(--red); }
    .chit .corridorhi-ctx { margin:0; font:14px/1.35 var(--hand); color:var(--ink-2); }
    .chit .corridorhi-ctx b { color:var(--ink); font-weight:normal; font-family:var(--stamp); font-size:12px; letter-spacing:.03em; padding:0 3px; background:rgba(31,49,91,.08); border-radius:2px; }
    .chit .corridorhi-nudge {
      margin:8px 0 0; padding:8px 10px;
      background:rgba(31,49,91,.06); border-left:3px solid rgba(31,49,91,.55);
      font:13px/1.3 var(--hand); color:var(--ink-2); display:flex; gap:8px; align-items:flex-start;
    }
    .chit .corridorhi-nudge span { color:var(--red); font-size:9px; padding-top:6px; }
    @media (min-width: 900px) {
      .chit.schoolcorridorpaper .corridorhello { margin:6px 0 20px; padding:0 4px; }
      .chit.schoolcorridorpaper .corridorhi { font-size:26px; margin-bottom:4px; }
      .chit.schoolcorridorpaper .corridorhi-ctx { font-size:17px; max-width:78ch; }
      .chit.schoolcorridorpaper .corridorhi-nudge { font-size:14px; }
    }
    /* Mobile compresses the hello. A senior-designer cut: keep the
       single greeting line so the sheet reads as a person's, and drop
       the intro paragraph + sign-in box - those are dumped, not needed
       for a returning reader, and would push the actual action off the
       first fold. The context blurb lives on desktop where there is
       room; the sign-in nudge slides to the footer chip. */
    @media (max-width: 759px) {
      .chit.schoolcorridorpaper .corridorhello { margin:6px 0 10px; }
      .chit.schoolcorridorpaper .corridorhi { font-size:16px; margin:0; }
      .chit.schoolcorridorpaper .corridorhi-ctx { display:none; }
      .chit.schoolcorridorpaper .corridorhi-nudge { display:none; }
      /* Sign-in chip near the diary link, so the nudge is present but
         not competing with the panel above it. */
      .chit.schoolcorridorpaper .corridorsigninchip {
        display:inline-flex; align-items:center; gap:6px;
        margin:4px auto 0; padding:5px 10px 6px;
        background:rgba(31,49,91,.08); border:1px solid rgba(31,49,91,.2);
        border-radius:14px;
        font:11px var(--stamp); letter-spacing:.1em; text-transform:uppercase;
        color:var(--ink);
      }
      .chit.schoolcorridorpaper .corridorsigninchip::before {
        content:'\2022'; color:var(--red); font-size:14px; line-height:1;
      }
    }
    /* --- The corridor: the reference layout ---
       Vertical rail of clickable stops on the left, one focused panel on
       the right. Every visual is a real object of the game: real pen
       photographs, named opponents, roles as red-outline stamps. The
       whole thing folds into one column on a phone with the rail as a
       horizontal chip strip - designed for mobile, not the desktop
       shrunk. */
    .chit .corridorroute { list-style:none; margin:0; padding:0; display:grid; gap:0; }
    .chit .corridorstop {
      all:unset; cursor:pointer; box-sizing:border-box;
      display:grid; grid-template-columns:44px 1fr; align-items:center; gap:12px;
      padding:9px 6px; position:relative; border-radius:6px;
      transition:background .12s ease;
    }
    .chit .corridorstop:hover { background:rgba(31,49,91,.05); }
    .chit .corridorstop:focus-visible { outline:2px solid var(--red); outline-offset:2px; }
    .chit .corridorstop::before { content:''; position:absolute; left:22px; top:0; bottom:0; width:2px; background:rgba(31,49,91,.16); }
    .chit .corridorstop:first-child::before { top:50%; }
    .chit .corridorstop:last-child::before { bottom:50%; }
    .chit .corridorstop.done::before, .chit .corridorstop.here::before { background:rgba(31,49,91,.42); }
    .chit .corridorstop-badge {
      position:relative; z-index:1; display:grid; place-items:center;
      width:44px; height:44px; border-radius:50%;
      border:2px solid rgba(31,49,91,.28); background:var(--paper);
      font:13px var(--stamp); letter-spacing:.02em; color:var(--ink-2);
    }
    .chit .corridorstop.done .corridorstop-badge { background:#22407e; border-color:#22407e; color:#f4f6fb; }
    .chit .corridorstop.here .corridorstop-badge { background:#22407e; border-color:#22407e; color:#f4f6fb; }
    .chit .corridorstop.locked { opacity:.5; }
    /* Rooms too far up to enter from here - shown so the journey is
       visibly longer than the four stops you can reach, but never
       clickable and never a panel. Lock icon in place of the badge
       number so nobody wonders what the state means. */
    .chit .corridorstop.disabled {
      opacity:.42; cursor:default;
      pointer-events:none;
    }
    .chit .corridorstop.disabled .corridorstop-badge {
      background:transparent; border-style:dashed; color:var(--ink-2);
      font-size:16px;
    }
    /* The tail: a ghost stop under the last real one that says the road
       keeps going after these classes. Dashed badge, italic label. */
    .chit .corridorstop.faraway {
      opacity:.28; cursor:default; pointer-events:none;
    }
    .chit .corridorstop.faraway .corridorstop-badge {
      background:transparent; border:2px dashed rgba(31,49,91,.28);
    }
    .chit .corridorstop.faraway .corridorstop-copy b { font-style:italic; }
    /* The rail line under the ghost stop fades into nothing, so the
       eye follows it off the sheet. */
    .chit .corridorstop.faraway::before {
      background:linear-gradient(180deg, rgba(31,49,91,.16), transparent 90%) !important;
      bottom:-30px !important;
    }
    .chit .corridorstop.locked:hover { opacity:.72; }
    .chit .corridorstop[aria-current="true"] { background:rgba(31,49,91,.06); }
    .chit .corridorstop[aria-current="true"] .corridorstop-badge {
      border-color:var(--red); box-shadow:0 0 0 3px rgba(191,59,43,.14);
    }
    .chit .corridorstop-copy { display:grid; gap:1px; min-width:0; }
    .chit .corridorstop-copy b { font-family:var(--hand); font-weight:normal; font-size:16px; color:var(--ink); line-height:1.05; text-transform:none; letter-spacing:0; }
    .chit .corridorstop[aria-current="true"] .corridorstop-copy b { color:var(--ink); }
    .chit .corridorstop-copy small { font:10px var(--stamp); letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2); }

    /* The panels: one per stop, only the selected is visible. */
    .chit .corridorpanels { position:relative; min-width:0; }
    .chit .corridorpanel { display:none; }
    .chit .corridorwrap[data-selected="9A"]  .corridorpanel[data-panel="9A"],
    .chit .corridorwrap[data-selected="9B"]  .corridorpanel[data-panel="9B"],
    .chit .corridorwrap[data-selected="9C"]  .corridorpanel[data-panel="9C"],
    .chit .corridorwrap[data-selected="9D"]  .corridorpanel[data-panel="9D"],
    .chit .corridorwrap[data-selected="10A"] .corridorpanel[data-panel="10A"],
    .chit .corridorwrap[data-selected="12B"] .corridorpanel[data-panel="12B"] {
      display:grid;
    }
    .chit .corridorpanel-body {
      display:grid; gap:12px; padding:14px;
      background:rgba(255,253,244,.72);
      border:1.5px solid rgba(31,49,91,.32);
      position:relative;
    }
    /* Torn top edge - the same paper the whole game uses. */
    .chit .corridorpanel-body::before {
      content:''; position:absolute; top:-6px; left:0; right:0; height:6px;
      background:
        radial-gradient(circle at 6px 0, transparent 3px, rgba(255,253,244,.72) 3px) 0 0 / 12px 6px repeat-x;
    }
    .chit .corridorpanel-body.locked { opacity:.62; background:rgba(240,236,220,.55); }

    /* Head: big badge, name in stamp, subtitle in hand, count on the right. */
    .chit .corridorchit-head { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:12px; }
    .chit .corridorchit-badge {
      display:grid; place-items:center;
      min-width:52px; height:48px; padding:6px 10px;
      background:#e8dcae; border:1.6px solid rgba(60,48,20,.4);
      font:22px var(--stamp); color:#3a2f14;
    }
    .chit .corridorchit-badge.locked { background:#d9d3c0; color:#7a6c4a; border-color:rgba(60,48,20,.22); }
    .chit .corridorchit-name b { display:block; font:22px var(--stamp); letter-spacing:.03em; text-transform:uppercase; color:var(--ink); line-height:1.05; }
    .chit .corridorchit-name small { display:block; font-family:var(--hand); font-size:14px; color:var(--ink-2); line-height:1.2; margin-top:2px; }
    .chit .corridorchit-count { text-align:right; }
    .chit .corridorchit-count b { display:block; font:32px var(--stamp); color:var(--ink); line-height:1; }
    .chit .corridorchit-count b i { font-size:16px; font-style:normal; color:var(--ink-2); }
    .chit .corridorchit-count small { font:9px var(--stamp); letter-spacing:.12em; text-transform:uppercase; color:var(--ink-2); }
    .chit .corridorchit-count.locked b { color:var(--ink-2); }

    .chit .corridordots { display:flex; gap:7px; align-items:center; }
    .chit .corridordots i {
      display:grid; place-items:center; width:26px; height:26px; border-radius:50%;
      border:1.6px solid rgba(31,49,91,.26); font:12px var(--stamp); font-style:normal; color:var(--ink-2); background:transparent;
    }
    .chit .corridordots i.done { background:#22407e; border-color:#22407e; color:#f4f6fb; }
    .chit .corridordots i.here { border-color:var(--red); color:var(--red); }

    /* The centerpiece: named fighters, real pens, role stamps, VS band. */
    .chit .corridorvs {
      display:grid; grid-template-columns:1.4fr auto 1fr; gap:0;
      border:1.5px solid rgba(31,49,91,.32); background:rgba(255,253,244,.55);
      min-width:0;
    }
    .chit .corridorvs-them { padding:12px 14px; min-width:0; }
    .chit .corridorvs-cap { margin:0 0 10px; font:9.5px var(--stamp); letter-spacing:.14em; text-transform:uppercase; color:var(--ink-2); }
    .chit .corridorvs-pair { display:grid; grid-template-columns:1fr 1fr; gap:20px; min-width:0; }
    .chit .corridorvs-pair.single { grid-template-columns:1fr; }
    .chit .corridorvs-fighter { display:grid; grid-template-rows:auto auto auto auto; gap:3px; align-content:start; justify-items:start; min-width:0; }
    .chit .corridorvs-fighter b.fname { font:20px var(--stamp); letter-spacing:.01em; text-transform:uppercase; color:var(--ink); line-height:1; }
    .chit .corridorvs-fighter .role {
      display:inline-block; margin:2px 0 4px; padding:2px 7px;
      font:10px var(--stamp); letter-spacing:.12em; text-transform:uppercase;
      color:var(--red); border:1.3px solid var(--red);
    }
    .chit .corridorvs-fighter .role.blank { visibility:hidden; }
    .chit .corridorvs-fighter img.vspen { max-width:100%; height:auto; margin:4px 0 0; transform:none; filter:drop-shadow(0 2px 3px rgba(20,22,35,.18)); }
    .chit .corridorvs-fighter small { font-family:var(--hand); font-size:12px; color:var(--ink-2); line-height:1.2; }
    .chit .corridorvs-mark {
      display:grid; place-items:center; background:#22407e; padding:22px 12px;
    }
    .chit .corridorvs-mark span { font:22px var(--stamp); letter-spacing:.08em; color:#f4f6fb; }
    .chit .corridorvs-you {
      padding:12px 14px; text-align:center;
      display:grid; justify-items:center; align-content:center; gap:4px;
      background:rgba(238,232,214,.55);
    }
    .chit .corridorvs-you b.fname { font:26px var(--stamp); letter-spacing:.01em; text-transform:uppercase; color:var(--ink); line-height:1; }
    .chit .corridorvs-you img.vspen { max-width:150px; height:auto; margin:4px 0; transform:none; filter:drop-shadow(0 2px 3px rgba(20,22,35,.18)); }
    .chit .corridorvs-you small { font-family:var(--hand); font-size:12px; color:var(--ink-2); }
    .chit .corridorvs-risk {
      margin:6px 0 0; padding:3px 7px;
      font:9.5px var(--stamp); letter-spacing:.12em; text-transform:uppercase;
      color:var(--red); border:1.3px solid var(--red);
    }

    .chit .corridoroutcome { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .chit .corridoroutcome span {
      display:grid; grid-template-columns:auto 1fr; align-items:start; gap:8px;
      padding:9px 11px; border:1px solid rgba(31,49,91,.22); background:rgba(255,253,244,.72);
    }
    .chit .corridoroutcome i { display:grid; place-items:center; width:20px; height:20px; border-radius:50%; font-size:11px; font-style:normal; color:#fff; grid-row:1/3; }
    .chit .corridoroutcome .win i { background:#22407e; }
    .chit .corridoroutcome .lose i { background:var(--red); }
    .chit .corridoroutcome b { grid-column:2; font:10px var(--stamp); letter-spacing:.12em; text-transform:uppercase; color:var(--ink-2); }
    .chit .corridoroutcome small { grid-column:2; font-family:var(--hand); font-size:13.5px; line-height:1.25; color:var(--ink); }

    /* Sunburst prize strip - the whole-class payoff. */
    .chit .corridorprize {
      display:grid; grid-template-columns:1fr auto; align-items:center; gap:10px;
      padding:11px 14px; border:1.4px solid rgba(151,110,44,.42);
      background:
        radial-gradient(circle at 70% 50%, rgba(255,220,140,.72) 0%, rgba(244,224,184,.35) 40%, transparent 74%),
        repeating-conic-gradient(from 90deg at 70% 50%, rgba(255,200,110,.26) 0deg 6deg, transparent 6deg 12deg),
        rgba(244,224,184,.4);
    }
    .chit .corridorprize-copy small { display:block; font:9px var(--stamp); letter-spacing:.14em; text-transform:uppercase; color:#8a6a24; }
    .chit .corridorprize-copy b { display:block; font:17px var(--stamp); letter-spacing:.03em; text-transform:uppercase; color:#3f2f10; }
    .chit .corridorprize-goods { display:flex; align-items:center; gap:6px; }
    .chit .corridorprize-goods .er { width:28px; height:13px; border-radius:2px; background:linear-gradient(90deg,#cf4436 0 52%,#2f4a9c 52%); box-shadow:inset 0 1px rgba(255,255,255,.4); }
    .chit .corridorprize-goods .er.spent { opacity:.24; filter:grayscale(1); }
    .chit .corridorprize-goods em { font:14px var(--stamp); font-style:normal; color:#8a6a24; }
    .chit .corridorprize-goods .rm { display:grid; place-items:center; min-width:36px; padding:5px 6px; background:#e8dcae; border:1.6px solid rgba(60,48,20,.42); font:14px var(--stamp); color:#3a2f14; }

    .chit .corridorfootrow { display:grid; grid-template-columns:1fr auto; align-items:center; gap:10px; }
    .chit .corridornext { display:grid; gap:1px; margin:0; text-align:left; }
    .chit .corridornext small { font:9px var(--stamp); letter-spacing:.12em; text-transform:uppercase; color:var(--ink-2); }
    .chit .corridornext b { font-family:var(--hand); font-weight:normal; font-size:14px; color:var(--ink-2); }
    .chit .corridorgo { min-width:200px; position:relative; z-index:3; }
    .chit .corridorlocked { margin:6px 0 0; padding:12px; text-align:center; font-family:var(--hand); font-size:14px; color:var(--ink-2); background:rgba(60,60,60,.05); border:1px dashed rgba(31,49,91,.22); }

    /* Desktop: route left, panel right. */
    @media (min-width: 760px) {
      .chit.schoolcorridorpaper .corridorwrap {
        display:grid; grid-template-columns:260px 1fr; gap:34px; align-items:start;
      }
      .chit.schoolcorridorpaper .corridorroute { position:sticky; top:0; }
    }


    @media (min-width: 900px) {
      /* Desktop uses the room it has. Bigger names, bigger pens, real
         breathing room between everything. */
      .chit.schoolcorridorpaper .corridorpanel-body { padding:22px 26px; gap:16px; }
      .chit.schoolcorridorpaper .corridorchit-badge { min-width:64px; height:60px; font-size:28px; padding:8px 12px; }
      .chit.schoolcorridorpaper .corridorchit-name b { font-size:28px; }
      .chit.schoolcorridorpaper .corridorchit-name small { font-size:16px; margin-top:3px; }
      .chit.schoolcorridorpaper .corridorchit-count b { font-size:40px; }
      .chit.schoolcorridorpaper .corridorchit-count small { font-size:10px; }
      .chit.schoolcorridorpaper .corridordots i { width:32px; height:32px; font-size:14px; }
      .chit.schoolcorridorpaper .corridorvs-them { padding:20px 24px; }
      .chit.schoolcorridorpaper .corridorvs-you { padding:20px 24px; }
      .chit.schoolcorridorpaper .corridorvs-cap { font-size:11px; margin-bottom:14px; }
      .chit.schoolcorridorpaper .corridorvs-pair { gap:26px; }
      .chit.schoolcorridorpaper .corridorvs-fighter b.fname { font-size:28px; }
      .chit.schoolcorridorpaper .corridorvs-fighter .role { font-size:11px; padding:3px 9px; margin:4px 0 6px; }
      .chit.schoolcorridorpaper .corridorvs-fighter img.vspen { max-width:180px; margin:8px 0 4px; }
      .chit.schoolcorridorpaper .corridorvs-fighter small { font-size:14px; }
      .chit.schoolcorridorpaper .corridorvs-you b.fname { font-size:36px; }
      .chit.schoolcorridorpaper .corridorvs-you img.vspen { max-width:210px; margin:8px 0 6px; }
      .chit.schoolcorridorpaper .corridorvs-you small { font-size:14px; }
      .chit.schoolcorridorpaper .corridorvs-risk { font-size:11px; padding:4px 9px; margin-top:10px; }
      .chit.schoolcorridorpaper .corridorvs-mark { padding:24px 16px; }
      .chit.schoolcorridorpaper .corridorvs-mark span { font-size:28px; }
      .chit.schoolcorridorpaper .corridoroutcome { gap:14px; }
      .chit.schoolcorridorpaper .corridoroutcome span { padding:14px 18px; }
      .chit.schoolcorridorpaper .corridoroutcome b { font-size:12px; }
      .chit.schoolcorridorpaper .corridoroutcome small { font-size:16px; line-height:1.3; }
      .chit.schoolcorridorpaper .corridoroutcome i { width:24px; height:24px; font-size:13px; }
      .chit.schoolcorridorpaper .corridorprize { padding:16px 22px; gap:14px; }
      .chit.schoolcorridorpaper .corridorprize-copy small { font-size:11px; }
      .chit.schoolcorridorpaper .corridorprize-copy b { font-size:22px; }
      .chit.schoolcorridorpaper .corridorprize-goods .er { width:36px; height:16px; }
      .chit.schoolcorridorpaper .corridorprize-goods em { font-size:18px; }
      .chit.schoolcorridorpaper .corridorprize-goods .rm { min-width:48px; font-size:18px; padding:7px 8px; }
      .chit.schoolcorridorpaper .corridorfootrow { gap:16px; }
      .chit.schoolcorridorpaper .corridornext small { font-size:11px; }
      .chit.schoolcorridorpaper .corridornext b { font-size:17px; }
      .chit.schoolcorridorpaper .corridorgo { min-width:280px; padding:16px 22px; font-size:19px; }
      /* Route: bigger badges + copy at this scale */
      .chit.schoolcorridorpaper .corridorstop { padding:11px 8px; grid-template-columns:52px 1fr; gap:14px; }
      .chit.schoolcorridorpaper .corridorstop::before { left:26px; }
      .chit.schoolcorridorpaper .corridorstop-badge { width:52px; height:52px; font-size:15px; }
      .chit.schoolcorridorpaper .corridorstop-copy b { font-size:18px; }
      .chit.schoolcorridorpaper .corridorstop-copy small { font-size:11px; }
    }
    /* Mobile: designed for the phone, not the desktop shrunk.
       - Route becomes a fixed 5-column strip so every stop is visible.
         No horizontal scroll ambiguity, no hidden 5th chip.
       - The chit gets a visible, subtle scrollbar so you know at rest
         that there is more below.
       - The VS card stacks vertically, both pens keep their real photos,
         and the fight button spans the full width for the thumb. */
    @media (max-width: 759px) {
      .chit.schoolcorridorpaper { padding:18px 16px 28px 22px; }
      .chit.schoolcorridorpaper .corridorwrap {
        display:grid; grid-template-columns:1fr; gap:14px;
      }

      .chit .corridorroute {
        display:grid; grid-template-columns:repeat(6,minmax(0,1fr));
        gap:3px; padding:0; margin:0; position:relative;
        overflow:visible;
      }
      /* The rail already reads as a ladder on a phone; the ghost tail
         is a desktop-only cue for "keeps going" and would just steal
         column width on a phone. */
      .chit .corridorroute .corridorstop.faraway { display:none; }
      .chit .corridorroute::after { left:8%; right:8%; }
      /* One thin line through every badge, so the five chips read as
         a single ladder, not five loose pills. */
      .chit .corridorroute::after {
        content:''; position:absolute; left:12%; right:12%; top:24px;
        height:2px; background:rgba(31,49,91,.16); z-index:0;
      }
      .chit .corridorstop {
        grid-template-columns:1fr; gap:4px;
        padding:6px 2px; text-align:center; min-width:0;
      }
      .chit .corridorstop::before { display:none; }
      .chit .corridorstop-badge {
        width:40px; height:40px; margin:0 auto; font-size:12px;
        position:relative; z-index:1;
      }
      .chit .corridorstop-copy b { font-size:10.5px; line-height:1.05; }
      .chit .corridorstop-copy small { display:none; }

      /* The chit itself: keep the scroll indicator visible on mobile so
         nobody wonders whether the sheet ends where the fold does. */
      .chit.schoolcorridorpaper { scrollbar-width:thin; scrollbar-color:rgba(31,49,91,.25) transparent; }
      .chit.schoolcorridorpaper::-webkit-scrollbar { width:5px; }
      .chit.schoolcorridorpaper::-webkit-scrollbar-track { background:transparent; }
      .chit.schoolcorridorpaper::-webkit-scrollbar-thumb { background:rgba(31,49,91,.24); border-radius:3px; }

      .chit .corridorpanel-body { padding:12px 14px 12px 12px; gap:11px; overflow:hidden; }
