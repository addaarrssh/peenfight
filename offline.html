      left: -3px; right: -3px; top: 52%;
      height: 2.5px;
      background: var(--red);
      transform: rotate(-3deg);
    }
    .chit .transfer .arrow { color: var(--ink-2); font-size: 22px; }
    .chit .transfer .now {
      position: relative;
      padding: 3px 14px;
    }
    .chit .transfer .now::after {
      content: '';
      position: absolute;
      inset: -6px -4px -5px -5px;
      border: 2.5px solid var(--red);
      border-radius: 52% 48% 50% 52% / 58% 55% 45% 42%;
      transform: rotate(-2deg);
    }
    /* One dot per round of the seven. */
    .chit .rounds { display: flex; gap: 6px; justify-content: center; margin: 16px 0 4px; }
    .chit .rounds i {
      width: 24px; height: 24px;
      border: 1.5px solid var(--ink-3);
      border-radius: 2px;
      display: flex; align-items: center; justify-content: center;
    }
    .chit .rounds i svg { width: 20px; height: 20px; display: block; }
    .chit .rounds i.won { color: var(--ink); border-color: var(--ink-2); }
    .chit .rounds i.lost { color: var(--red); border-color: rgba(191,59,43,0.45); }
    /* Lifetime count, kept the way a scorekeeper keeps it. */
    .chit .tally {
      display: flex; align-items: center; gap: 10px; justify-content: center;
      margin-top: 16px; padding-top: 11px;
      border-top: 1px solid var(--ink-3);
    }
    .chit .tally b {
      font-family: var(--hand); font-weight: normal; font-size: 15px;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2);
    }
    .chit .tally svg { display: block; }
    .chit .stake {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1.5px dashed var(--ink-3);
      text-align: center;
    }
    .chit .inkfield {
      display: block;
      width: 100%;
      margin: 8px 0 2px;
      padding: 2px 2px 4px;
      border: none;
      border-bottom: 2.5px solid var(--ink-3);
      background: transparent;
      font-family: var(--hand);
      font-size: 27px;
      color: var(--ink);
      outline: none;
      text-transform: uppercase;
    }
    .chit .inkfield::placeholder { color: var(--ink-3); }
    .chit .inkfield:focus-visible {
      border-bottom-color: var(--red);
      outline: 3px solid var(--red);
      outline-offset: 4px;
    }
    /* A rubber stamp: heavy condensed caps inside a double rule, set askew
       and slightly bled, the way a stamp lands on paper. */
    /* The one filled control a sheet is allowed.
       Everything else printed on this paper is an outline, so a sheet
       with a gostamp on it has exactly one thing that reads as the
       action and every other control ranks itself underneath by being
       hollow. Sheets that only ever had one button keep the stamp. */
    .chit .gostamp {
      display: block; width: 100%; margin-top: 15px; padding: 12px 10px 10px;
      border: 0; background: var(--red); color: #f6efe0; cursor: pointer;
      font-family: var(--stamp); font-size: 19px; letter-spacing: 0.055em;
      text-transform: uppercase; transform: rotate(-0.8deg);
      box-shadow: 0 4px 0 rgba(120, 34, 25, 0.85), 0 8px 16px rgba(20, 12, 4, 0.3);
    }
    .chit .gostamp:active {
      transform: rotate(-0.8deg) translateY(3px);
      box-shadow: 0 1px 0 rgba(120, 34, 25, 0.85);
    }

    .chit .stampbtn, .chooser .stampbtn {
      display: block;
      width: 100%;
      margin-top: 18px;
      padding: 11px 10px 9px;
      border: 2.5px solid var(--ink);
      outline: 1px solid var(--ink);
      outline-offset: 3px;
      background: transparent;
      color: var(--ink);
      font-family: var(--stamp);
      font-size: 19px;
      letter-spacing: 0.045em;
      text-transform: uppercase;
      transform: rotate(-1.1deg);
      cursor: pointer;
      opacity: 0.88;
    }
    .chit .stampbtn:active, .chooser .stampbtn:active { transform: rotate(-1.1deg) scale(0.985); opacity: 1; }

    /* ---- V2 first-open notice ----
       One promise and one action: win the class, enter the Corridor, then
       challenge another class. Nothing else competes with that journey. */
    body.v2-intro-open .playfriendtop { display: none; }
    .chit.v2paper { width: min(calc(100vw - 20px), 410px); }
    .chit .v2step {
      display: flex; align-items: center; justify-content: space-between; margin: 0 2px 7px;
      color: var(--ink-2); font-family: var(--stamp); font-size: 11px; letter-spacing: .11em;
      text-transform: uppercase;
    }
    .chit .v2step b { color: var(--red); font-weight: normal; }
    .chit .v2title { margin: 5px 0 7px; font-size: clamp(30px, 8vw, 38px); line-height: .96; text-wrap: balance; }
    .chit .v2definition {
      width: min(100%, 340px); margin: 0 auto 11px; color: var(--ink-2);
      font-size: 16px; line-height: 1.2; text-align: center;
    }
    .chit .v2definition b { color: var(--ink); font-weight: normal; text-transform: uppercase; }
    /* A spatial story, not a row of feature cards. The Trimax is the place
       the player comes from; 9B is the first large door; later classes get
       physically smaller as the Corridor recedes. */
    .chit .corridorjourney {
      position: relative; height: 174px; margin: 11px 0 9px; overflow: hidden;
      border: 2px solid rgba(35,54,72,.82); border-bottom-width: 4px;
      background:
        linear-gradient(154deg, transparent 49.4%, rgba(60,48,34,.25) 50%, transparent 50.6%) 0 100% / 53% 62% no-repeat,
        linear-gradient(206deg, transparent 49.4%, rgba(60,48,34,.25) 50%, transparent 50.6%) 100% 100% / 53% 62% no-repeat,
        linear-gradient(to bottom, #d6c298 0 56%, #819099 56% 59%, #7a6549 59% 100%);
      box-shadow: inset 0 14px 28px rgba(32,25,17,.16), 0 3px 0 rgba(43,35,26,.16);
      isolation: isolate;
    }
    .chit .corridorjourney::before,
    .chit .corridorjourney::after {
      content: ''; position: absolute; z-index: 0; top: 56%; bottom: 0; width: 1px;
      background: rgba(239,225,193,.42); transform-origin: bottom;
    }
    .chit .corridorjourney::before { left: 18%; transform: rotate(38deg); }
    .chit .corridorjourney::after { right: 18%; transform: rotate(-38deg); }
    .chit .corridorjourney-door {
      position: absolute; z-index: 2; display: block; overflow: hidden;
      border: 2px solid #273b48; background: #4f4b42; box-shadow: 4px 4px 0 rgba(35,28,20,.24);
    }
    .chit .corridorjourney-door.first { right: 7%; bottom: 18px; width: 83px; height: 125px; }
    .chit .corridorjourney-door.second { left: 47%; bottom: 55px; width: 51px; height: 77px; opacity: .78; }
    .chit .corridorjourney-door.third { left: 57%; bottom: 75px; width: 32px; height: 49px; opacity: .52; }
    .chit .corridorjourney-door img {
      display: block; width: 100%; height: 100%; object-fit: cover; filter: saturate(.8) contrast(.96);
    }
    .chit .corridorjourney-door em {
      position: absolute; top: 3%; left: 50%; transform: translateX(-50%) rotate(-1deg);
      color: #231a10; font-family: var(--stamp); font-size: 13px; font-style: normal; line-height: 1;
    }
    .chit .corridorjourney-door.first b {
      position: absolute; z-index: 3; right: -2px; bottom: 7px; padding: 4px 6px 3px;
      color: #fff7e7; background: var(--red); font-family: var(--stamp); font-size: 9px;
      font-weight: normal; letter-spacing: .05em; text-transform: uppercase; transform: rotate(-2deg);
    }
    .chit .corridorjourney-route {
      position: absolute; z-index: 1; left: 27%; bottom: 36px; width: 39%; height: 2px;
      border-top: 2px dashed rgba(191,59,43,.75); transform: rotate(-18deg); transform-origin: left;
    }
    .chit .corridorjourney-route::after {
      content: '›'; position: absolute; right: -3px; top: -13px; color: var(--red);
      font-family: var(--hand); font-size: 24px;
    }
    .chit .corridorjourney-route span {
      position: absolute; left: 50%; bottom: 5px; color: var(--red); font-family: var(--stamp);
      font-size: 8px; font-style: normal; letter-spacing: .08em; text-transform: uppercase;
      transform: translateX(-50%) rotate(18deg); white-space: nowrap;
    }
    .chit .corridorjourney-origin {
      position: absolute; z-index: 4; left: 7px; bottom: 7px; display: grid; justify-items: center;
      width: 54%; padding: 5px 7px 4px; border: 1.5px solid var(--ink);
      background: rgba(246,238,214,.96); box-shadow: 3px 3px 0 rgba(43,35,26,.18); transform: rotate(-1deg);
    }
    .chit .corridorjourney-origin small,
    .chit .corridorjourney-origin b {
      font-family: var(--stamp); font-size: 9px; font-weight: normal; letter-spacing: .08em;
      line-height: 1; text-transform: uppercase;
    }
    .chit .corridorjourney-origin small { color: var(--red); }
    .chit .corridorjourney-origin b { color: var(--ink); }
    .chit .corridorjourney-origin img { width: 100%; height: 30px; object-fit: contain; transform: rotate(-1deg); }
    .chit .corridorjourney.waiting .corridorjourney-door,
    .chit .corridorjourney.waiting .corridorjourney-route { filter: grayscale(.78) brightness(.77); opacity: .56; }
    .chit .corridorjourney.waiting .corridorjourney-origin { border-style: dashed; }
    .chit.v2paper .stampbtn { margin-top: 12px; }
    /* The share is an anchor, not a button, so that iOS hands the composer
       to the X app instead of opening it in a browser tab. It has to be
       dressed back up as the stamp and the dashed rule it replaced. */
    .chit a.stampbtn, .chit a.sharebtn {
      text-decoration: none;
      text-align: center;
      box-sizing: border-box;
    }
    /* ---- The ranking sheet ----
       Three lists, three jobs, one page at a time. Written as three
       headings with the one you are on underlined, because that is what a
       kid does to a page; plastic tabs would be a new material on a sheet
       that has exactly one. Sticky, so turning pages does not mean
       scrolling back up for the headings, and 44px of target because this
       is read with a thumb. */
    .chit .tabs {
      position: sticky; top: 0; z-index: 3;
      display: flex; gap: 2px; margin: 0 0 10px;
      padding: 8px 0 0;
      background: var(--paper);
      border-bottom: 1px solid var(--ink-3);
    }
    .chit .tab {
      flex: 1; min-width: 0; padding: 8px 4px 9px;
      border: none; border-bottom: 2.5px solid transparent;
      background: transparent; color: var(--ink-3);
      font-family: var(--hand); font-size: 15px; line-height: 1.4;
      letter-spacing: 0.05em; text-transform: uppercase; cursor: pointer;
      margin-bottom: -1px;
    }
    .chit .tab.on { color: var(--ink); border-bottom-color: var(--ink); }
    .chit .page.hide { display: none; }

    /* ---- The podium ----
       A ranking's content is rank, and three rows with a smaller number
       beside them is the flattest way to say it. Three risers on one
       ground line, hatched the way a kid shades a drawn block, second on
       the left and third on the right in the order everybody knows.
       First is wider, taller, filled instead of hatched and ruled in red,
       so height does the ranking before a number is read.
       No silver and no bronze: Olympic furniture, and the crown is
       already the only mark a person wears here. */
    .chit .podiumwrap { margin: 12px 0 0; }
    .chit .podium { display: flex; align-items: flex-end; justify-content: center; gap: 7px; }
    .chit .plane { flex: 0 1 106px; min-width: 0; display: flex; flex-direction: column; align-items: center; }
    .chit .plane.first { order: 2; flex-basis: 122px; }
    .chit .plane.second { order: 1; }
    .chit .plane.third { order: 3; }
    .chit .pcrown { display: block; width: 38px; height: 18px; color: var(--red); transform: rotate(-7deg); margin-bottom: 3px; }
    .chit .pcrown .crown { width: 100%; height: 100%; margin: 0; transform: none; }
    .chit .pname {
      font-family: var(--hand); font-size: 15px; text-transform: uppercase; line-height: 1.05;
      text-align: center; margin: 0; max-width: 100%;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .chit .plane.first .pname { font-size: 20px; }
    .chit .pname.you { color: var(--red); }
    .chit .ppts { font-family: var(--hand); font-size: 14px; color: var(--ink-2); margin: 1px 0 7px; }
    .chit .plane.first .ppts { color: var(--ink); font-size: 16px; }
    .chit .riser {
      width: 100%; border: 1.7px solid var(--ink-3); border-bottom: none;
      border-radius: 2px 2px 0 0; display: flex; align-items: center; justify-content: center;
      background-image: repeating-linear-gradient(-52deg, transparent 0 6px, rgba(36,66,143,0.16) 6px 7px);
      height: 52px;
    }
    .chit .plane.first .riser {
      border-color: var(--red); border-width: 2.2px; background-color: var(--paper-hi);
      background-image: repeating-linear-gradient(-52deg, transparent 0 8px, rgba(191,59,43,0.11) 8px 9px);
      height: 78px; transform: rotate(-0.35deg);
    }
    .chit .plane.second .riser { height: 54px; transform: rotate(0.45deg); }
    .chit .plane.third .riser { height: 39px; transform: rotate(-0.5deg); }
    .chit .riser .rn { font-family: var(--hand); font-size: 21px; line-height: 1; color: var(--ink-2); }
    .chit .plane.first .riser .rn { font-size: 29px; color: var(--red); }
    .chit .ground { height: 2px; background: var(--ink); border-radius: 2px; }
    .chit .groundshade {
      height: 8px; margin-bottom: 12px;
      background-image: repeating-linear-gradient(-52deg, transparent 0 5px, rgba(36,66,143,0.16) 5px 6px);
    }
    /* The heading and the column names on one line. Two stacked centred
       lines read as two unrelated headings for the same list. */
    .chit .runhead {
      display: flex; align-items: flex-end; gap: 8px; margin: 2px 0 0;
      padding: 0 4px 3px; border-bottom: 1px solid var(--ink-3);
      font-family: var(--hand); color: var(--ink-2);
    }
    .chit .runhead .t { flex: 1; font-size: 11.5px; letter-spacing: 0.16em; text-transform: uppercase; }
    .chit .runhead em {
      font-style: normal; text-align: right; flex: none;
      font-size: 9.5px; letter-spacing: 0.07em; text-transform: uppercase;
    }
    .chit .runhead em.p { width: 60px; }
    .chit .runhead em.m { width: 50px; }

    /* Rows are set to 27px, the pitch of the paper's own ruling, and
       carry no rule of their own. The sheet is already ruled, and a
       second set of lines drawn on top of the first is what made this
       read as a ledger. Matching the pitch also means every row sits the
       same way on its line, so the list is written on the paper rather
       than laid over it. */
    .chit .board { list-style: none; margin: 0; }
    .chit .board li {
      display: flex; align-items: baseline; gap: 8px;
      height: 27px; padding: 0 4px;
      font-family: var(--hand);
    }
    .chit .board li b { font-weight: normal; font-size: 13px; color: var(--ink-3); min-width: 20px; }
    /* The name column holds the name, whatever mark the person is
       wearing, and what they did. It cannot clip, or a crown sitting
       above the letters gets cut off at the shoulders, so the trimming
       moves down to the name itself. */
    /* A row, so the crown sits beside the name rather than above it. A
       block name put the two on separate lines, which is what kept the
       crown on the roof however the crown itself was styled. */
    .chit .board li span {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
    }
    .chit .board li .nm {
      flex: 1;
      min-width: 0;
      font-style: normal;
      font-size: 18px;
      text-transform: uppercase;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* Fixed, not min: the column names live in one header row now, and a
       header only sits over its numbers if every row gives the columns
       the same width. Flex sizes each row on its own, so the width has to
       be pinned. */
    .chit .board li em {
      font-style: normal; text-align: right; flex: none;
      width: 60px; font-size: 18px; line-height: 1;
    }
    .chit .board li em.sm { width: 50px; font-size: 14px; color: var(--ink-2); }
    /* Worn, not filed. It sits on top of the letters and slightly askew,
       the way somebody draws one on the class list over the topper, and
       the crowned row is given the headroom to carry it. */
    /* Beside the name, not above it. Sitting on top of the letters gave
       crowned rows their own height and broke the rhythm of the list,
       which is the one thing a ranking cannot afford. */
    .chit .board li .crown {
      flex: none;
      display: inline-block;
      width: 20px; height: 10px;
      margin-right: 5px;
      color: var(--red);
      transform: rotate(-9deg);
      pointer-events: none;
    }
    /* The records, on a page of their own now.
       They were a postscript at the foot of the ranking: above the list
       they took the importance that belongs to it, and inside the rows
       they broke their
       rhythm. Here it reads as the note somebody added at the bottom of
       the notice, which is exactly what it is. */
    /* One margin, drawn once, running the whole height of the block.
       Five short rules beside five records read as five broken things; a
       single edge gives the page a second ruled margin to echo the red
       one, and puts the five figures in a column you can read down. */
    .chit .records { position: relative; margin-top: 10px; }
    .chit .records::before {
      content: ''; position: absolute; top: 6px; bottom: 6px; left: 62px;
      width: 1.5px; background: var(--ink-3);
    }
    /* Names first, deed under them, on one left edge.
       The two column row this replaced could hold exactly one name, so a
       record shared by three people had to hide two of them behind "+2" —
       and a record is for putting names up. Given their own line the names
       wrap instead of being cut, so no number of holders can ever push
       somebody off the sheet, and the deed underneath is free to say what
       it actually took. */
    /* Flush left, on one edge. The card centres its text, which put two
       elements of the same record on two different axes. Left is the one
       to settle on: a wrapped roll of names centres badly.
       No rule between records. The paper is already ruled, and a second
       set of lines drawn over the first is the reason this looked busy;
       separation here is space, which collides with nothing. */
    .chit .rec {
      display: flex; text-align: left;
      padding: 12px 0; font-family: var(--hand);
    }
    .chit .rec .fig {
      flex: 0 0 62px; text-align: right; padding-right: 13px;
      font-family: var(--hand); font-weight: normal;
      font-size: 36px; line-height: 1; color: var(--ink);
    }
    .chit .rec.mine .fig { color: var(--red); }
    .chit .recbody { flex: 1; min-width: 0; padding-left: 14px; }
    /* The caption. What the figure counts, said small, because the figure
       is the thing being announced. */
    .chit .rec .what {
      font-family: var(--hand); font-size: 11.5px; letter-spacing: 0.13em;
      text-transform: uppercase; color: var(--ink-2); margin: 3px 0 4px;
      line-height: 1.35;
    }
    .chit .rec .holders {
      display: block;
      font-size: 17px;
      line-height: 1.4;
      text-transform: uppercase;
      color: var(--ink);
    }
    .chit .rec .holders em { font-style: normal; }
    /* Your name on a record, in the same red the sheet already spends on
       your own row in the ranking. Only your name: a record can be shared,
       and the people you share it with are not you. */
    .chit .rec .holders .me { color: var(--red); }
    /* A crowd past the eight that are named. Reported, not hidden, so it
       is set as the aside it is rather than as another name. */
    .chit .rec .restof {
      font-size: 15px;
      text-transform: none;
      color: var(--ink-2);
    }

    /* A record changing hands.
       The name that held it is crossed out by a line drawn across it,
       not by text-decoration, because a rule that appears all at once is
       a style and a rule that travels is somebody's pen. Then it is rubbed
       off: the name collapses to nothing and the names after it close up.
       Full ink, not grey, because until the pen goes through it this is
       simply one of the names on the record. */
    .chit .rec .gone {
      display: inline-block;
      position: relative;
      max-width: 9em;
      overflow: hidden;
      vertical-align: bottom;
      white-space: pre;
      text-decoration: none;
      color: inherit;
      transition: max-width 380ms ease, opacity 300ms ease;
    }
    .chit .rec .gone::after {
      content: '';
      position: absolute;
      left: -2px; right: 100%;
      top: 52%;
      height: 2px;
      background: var(--red);
      border-radius: 2px;
      transition: right 300ms cubic-bezier(.4,.5,.3,1);
    }
    .chit .rec.striking .gone::after { right: -2px; }
    .chit .rec.done .gone { max-width: 0; opacity: 0; }

    /* Your name is written in as the old one is rubbed out, and takes up
       no room until it is. Not merely invisible: an unseen name that still
       holds its width puts both names on the line at once, and on a phone
       that is wider than the line has, so the deed on the left would
       ellipsize for half a second and then come back. Growing from nothing
       keeps the line the width it already was, and reads as the name being
       written rather than switched on. */
    .chit .rec.gain .me.in {
      display: inline-block;
      max-width: 0;
      overflow: hidden;
      vertical-align: bottom;
      white-space: nowrap;
      opacity: 0;
      transform: translateY(5px);
      transition: max-width 360ms cubic-bezier(.3,.8,.3,1),
                  opacity 300ms ease,
                  transform 340ms cubic-bezier(.3,.8,.3,1);
    }
    .chit .rec.gain.done .me.in { max-width: 9em; opacity: 1; transform: none; }
    /* The words change too when a streak is beaten, so they change with it
       rather than snapping over at some unrelated moment. Only on the line
       that actually has new words: dimming "all 11 pens", which reads the
       same before and after, would be a flicker with nothing behind it. */
    .chit .rec.gain[data-said] b { transition: opacity 200ms ease; }
    .chit .rec.gain[data-said].striking b { opacity: 0.45; }
    .chit .rec.gain[data-said].done b { opacity: 1; }

    @media (prefers-reduced-motion: reduce) {
      .chit .rec .gone,
      .chit .rec .gone::after,
      .chit .rec.gain .me.in,
      .chit .rec.gain b { transition: none; }
    }

    /* Where a climb ends. One pass of the highlighter, then gone: the row
       is already marked as yours, so this only has to say "here", and a
       mark that stays would be a second permanent state nothing else on
       the sheet has. */
    .chit .board li.landed { animation: pf-landed 1100ms ease-out 1; }
    @keyframes pf-landed {
      0%   { background: rgba(214, 77, 60, 0.22); }
      100% { background: rgba(214, 77, 60, 0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .chit .board li.landed { animation: none; }
    }
    .chit .board li.skip {
      justify-content: center; border: none; padding: 2px 0;
      color: var(--ink-3); letter-spacing: 0.3em; font-size: 13px;
    }
    /* The same mark that means "the list carries on", used where the
       question actually gets asked: at the bottom. Words, so it is read
       rather than decorative, in the ink the sheet gives to asides. */
    .chit .board li.skip.tail {
      letter-spacing: 0.04em; font-size: 14px; color: var(--ink-2);
      padding-top: 9px;
    }
    .chit .boardnote { text-align: center; font-size: 14px; margin-top: 10px; }
    /* The mark in the margin. Red for a loss because that is the ink this
       paper spends on what matters, and the same weight either way so a
       gain is never louder than the cost of a loss. */
    .chit .points {
      font-family: var(--hand); font-size: 19px; text-align: center;
      margin: 6px 0 2px; color: var(--ink);
    }
    .chit .points.down { color: var(--red); }
    /* The deal on the fixture card: what you get, what it costs, in the
       two column shape a kid writes a bet in. */
    .chit .deal { margin: 12px 0 4px; padding: 0; }
    .chit .deal div {
      display: flex; align-items: baseline; gap: 10px;
      font-family: var(--hand); font-size: 16px; padding: 4px 2px;
    }
    .chit .deal dt { flex: 1; margin: 0; color: var(--ink); }
    .chit .deal dd { margin: 0; font-size: 18px; white-space: nowrap; }
    .chit .deal .n.up { color: var(--ink); }
    .chit .deal .n.down { color: var(--red); }
    /* What each result is worth, on the sheet that explains the game. */
    .chit .scoring { margin: 12px 0 4px; padding: 0; }
    .chit .scoring div {
      display: flex; align-items: baseline; gap: 8px;
      font-family: var(--hand); font-size: 15px;
      border-bottom: 1px solid var(--ink-3); padding: 4px 2px;
    }
    .chit .scoring div:last-child { border-bottom: none; }
    .chit .scoring dt { flex: 1; margin: 0; color: var(--ink-2); }
    .chit .scoring dd { margin: 0; color: var(--ink); white-space: nowrap; }
    /* The attendance sheet is a picture and a sentence. The tin is what
       somebody stands to keep, so it is what they are shown; it does the
       work three lines of copy were doing badly. */
    .chit .attin {
      display: block; width: 100%; max-width: 186px;
      margin: 4px auto 12px;
      transform: rotate(-1.5deg);
    }
    .chit .attgift {
      width: 100%;
      max-width: 230px;
      height: 190px;
      margin: -8px auto 0;
    }
    .chit .attgift svg {
      display: block;
      width: 100%;
      height: 100%;
    }
    .chit .fineprint {
      margin: 10px 0 0;
      font-size: 12.5px; line-height: 1.3;
      color: var(--ink-2); text-align: center;
    }
    /* Two diaries. Each stamp is a game. Same shape as which-desk, stacked
       because a name and a tally need the width, not two columns. */
    .chit .pickgame {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 16px;
    }
    .chit .pickgame .stampbtn {
      margin-top: 0;
      min-height: 72px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 12px 10px 10px;
    }
    .chit .pickgame .stampbtn small {
      font-family: var(--hand);
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
      opacity: 0.78;
    }
    .chit .pickgame .stampbtn > span {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .chit .pickgame .progressahead {
      font-family: var(--stamp);
      font-style: normal;
      font-size: 10px;
      line-height: 1;
      letter-spacing: 0.08em;
      color: var(--red);
    }
    /* Two diaries, side by side down the page. The name is the loud half
       and the tally under it is what the choice is actually made on, so
       the second line is the same list without a rule between them. */
    .chit .scoring.twodiaries { margin: 12px 0 6px; }
    .chit .scoring.twodiaries div { border-bottom: none; padding-bottom: 0; }
    .chit .scoring.twodiaries dd { font-size: 18px; }
    .chit .scoring.twodiaries dd.sub {
      font-size: 13px; color: var(--ink-2); white-space: normal;
    }
    /* The ranking sheet is the one sheet in this game that is a list
       rather than a card, so it takes more of the width than an ordinary
       chit does: 92vw against 84, which on a phone is twenty-seven pixels
       of margin the names get instead. One rule, both ends. */
    .chit.wide { width: min(92vw, 604px); }

    /* ---- The champions page ----
       It had no hero and it was answering the wrong question with the
       space: a table ranked by defences, which is not a race anybody
       entered. The top of the roll now gets the certificate this game
       already prints and hands over at assembly, shrunk onto the sheet.
       Not a new surface: the same double rule, the same rubber stamp. */
    .chit .cert {
      position: relative; width: min(100%, 392px); margin: 20px auto 24px;
      padding: 20px 18px 32px;
      border: 2.4px solid var(--ink); outline: 1px solid var(--ink); outline-offset: 3px;
      background: var(--paper-hi); text-align: center;
    }
    /* The crown breaks the top rule rather than sitting inside it. A
       frame a mark sits politely within is a border; a frame the mark
       interrupts is something the mark was put on. */
    .chit .cert .crownbreak {
      position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
      padding: 0 12px; background: var(--paper-hi); line-height: 0;
    }
    .chit .cert .crownbreak .crown {
      width: 52px; height: 24px; margin: 0; transform: none; color: var(--red);
    }
    .chit .cert .tag {
      font-family: var(--hand); font-size: 11px; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--ink-2); margin: 0 0 2px;
    }
    .chit .cert .who {
      font-family: var(--hand); font-size: 34px; line-height: 1.04;
      text-transform: uppercase; margin: 0; text-align: center;
    }
    .chit .cert .who.mine { color: var(--red); }
    .chit .cert .penshot { width: 100%; max-width: 260px; margin: 8px auto 4px; }
    .chit .cert .penname {
      font-family: var(--hand); font-size: 11.5px; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--ink-2); margin: 0;
    }
    .chit .cert .figs { display: flex; justify-content: center; margin-top: 12px; }
    .chit .cert .figs div { flex: 1 1 0; padding: 0 6px; }
    .chit .cert .figs div + div { border-left: 1px solid var(--ink-3); }
    .chit .cert .figs b {
      display: block; font-family: var(--hand); font-weight: normal;
      font-size: 28px; line-height: 1;
    }
    .chit .cert .figs span {
      font-family: var(--hand); font-size: 10.5px; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--ink-2);
    }
    /* Landed across the corner, off the frame, the way a stamp actually
       lands. Nobody ever centred one inside a box. */
    .chit .cert .certstamp {
      position: absolute; right: -12px; bottom: -16px; margin: 0;
      padding: 6px 12px 4px; font-size: 12px; letter-spacing: 0.07em;
      background: var(--paper-hi); transform: rotate(-3.5deg);
    }
    /* The roll. Name over deed, the shape the records block already uses,
       because a champion is a person who did a thing and not a row of
       columns. Two rules of the paper per entry, so a roll of fourteen
       has the rhythm of a written list. */
    .chit .rollhead {
      font-family: var(--hand); font-size: 11.5px; letter-spacing: 0.17em;
      text-transform: uppercase; color: var(--ink-2); text-align: center;
      margin: 22px 0 0; padding-top: 11px; border-top: 1.5px dashed var(--ink-3);
    }
    .chit .roll { list-style: none; margin: 6px 0 0; padding: 0; }
    .chit .roll li { height: 54px; padding: 4px 2px 0; }
    .chit .roll .nm {
      display: block; font-family: var(--hand); font-size: 19px;
      line-height: 1.25; text-transform: uppercase;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .chit .roll .did {
      display: block; font-family: var(--hand); font-size: 13px;
      line-height: 1.5; color: var(--ink-2);
    }
    .chit .roll li.you .nm { color: var(--red); }
    .chit .rollwrap { text-align: center; margin-top: 6px; }
    /* Folded, not cut. Every name is in the document; these are the ones
       past what the surface carries, and the control beside them puts
       them back. Nothing here is ever removed from the page, so a list
       can never disagree with the count printed next to it. */
    .chit [data-roll-target] .over { display: none; }
    .chit ol.roll[data-roll-target].open li.over { display: block; }
    .chit p.holders[data-roll-target].open em.over { display: inline; }
    .chit .rollmore {
      display: inline-block; margin: 6px 0 0;
      font-family: var(--hand); font-size: 13px;
    }
    /* A rivalry line carries more words than a ranking line, so it is
       allowed to wrap onto a second row rather than being squeezed. */
    /* ---- The front door ----
       One page, three doors, grouped: solo on one side, the two live
       ways on the other. A card system rather than a stack, because the
       two multiplayer doors are alternatives to each other and have to
       be comparable at a glance -- which means equal height, equal
       internal rhythm, and buttons that land on the same line whatever
       the copy above them runs to.

       Every card is a flex column with fixed slots: art, title, body,
       then the button pushed to the floor by margin-top:auto. That one
       rule is what stops a two-line body and a three-line body from
       leaving their buttons at different heights. */
    .chit.chooser, .chit.queue { text-align: center; }
    .chit.chooser .pickq, .chit.queue .pickq {
      margin-bottom: 14px;
      font-family: var(--hand); font-size: 30px; line-height: 1.06;
      text-transform: uppercase; letter-spacing: 0.01em;
      color: var(--ink); margin: 0; text-align: center;
    }
    /* Section label: a rule out to each margin, the word in the middle. */
    .chooser .picksec {
      display: flex; align-items: center; gap: 8px;
      margin: 0 0 10px; color: var(--red);
      font-family: var(--hand); font-size: 13.5px; letter-spacing: 0.16em;
      line-height: 1; text-transform: uppercase; white-space: nowrap;
    }
    .chooser .picksec::before,
    .chooser .picksec::after {
      content: ''; flex: 1 1 auto; height: 1px;
      background: rgba(36, 66, 143, 0.26);
    }
    .chit.chooser .pickcol + .pickcol { margin-top: 16px; }
    .chooser .pickcol { display: flex; flex-direction: column; flex: 1 1 auto; }
    .chooser .pickduo {
      display: grid; gap: 9px; align-items: stretch;
      grid-template-columns: repeat(auto-fit, minmax(0, 1fr));
      flex: 1 1 auto;
    }
    .chooser .pick, .chit.queue .pick {
      position: relative;
      display: flex; flex-direction: column; align-items: center;
      padding: 13px 11px 13px;
      border: 1.5px solid rgba(36, 66, 143, 0.38);
      border-radius: 5px;
      text-align: center;
    }
    /* Same object as PRESENT: a rubber stamp, slightly crooked, on the
       card that is actually new. Anton, red, double-ruled. The pair of
       doors stay matched because only this one carries a mark. */
    .chooser .newtag {
      position: absolute; top: 5px; right: 5px;
      font-family: var(--stamp); font-size: 11px; line-height: 1;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: #111;
      background: #f0d24a;
      padding: 4px 7px 3px;
      border: 1.5px solid #c9a61a; border-radius: 2px;
      transform: rotate(8deg);
      transform-origin: center;
      pointer-events: none;
      animation: pfnewbounce 1.5s ease-in-out infinite;
    }
    @keyframes pfnewbounce {
      0%, 100% { transform: rotate(8deg) scale(1); }
      40% { transform: rotate(8deg) scale(1.12); }
      70% { transform: rotate(8deg) scale(0.97); }
    }
    @media (prefers-reduced-motion: reduce) {
      .chooser .newtag { animation: none; }
    }
    /* The prize, photographed, not an icon of a prize.
       A pen in this game is described exactly once and it is described
       by its photograph -- so the trophy on the championship card is the
       Trimax itself, the same file the entry form shows, at the same
       moment in the game it has always been shown: before anybody has
       agreed to anything. A generic cup drawn here was the one rendered
       object on a page whose whole promise is that nothing is. */
    .chit.chooser .pick.solo .pickpen {
      display: block; width: 100%; max-width: 210px;
      margin: 0 auto 7px;
    }
    .chooser .pickart {
      height: 34px; margin-bottom: 5px;
      display: flex; align-items: center; justify-content: center;
    }
    .chooser .pickicon {
      display: block; width: 27px; height: 27px;
      stroke: var(--ink); stroke-width: 2; fill: none;
      stroke-linecap: round; stroke-linejoin: round;
      opacity: 0.78;
    }
    .chooser .pickicon.cupbig { width: 31px; height: 31px; opacity: 0.9; }
    .chooser .pick h3 {
      font-family: var(--hand); font-size: 19px; line-height: 1.08;
      letter-spacing: 0.01em; text-transform: uppercase;
      color: var(--ink); margin: 0 0 6px; text-align: center;
    }
    .chit.chooser .pick.solo h3 { font-size: 23px; margin: 0 0 6px; }
    /* Both multiplayer titles hold two lines whether their words need
       them or not, so the body copy under them starts on the same line
       and the two cards read as a matched pair rather than two drafts. */
    .chooser .pickduo h3 {
      display: flex; align-items: center; justify-content: center;
      min-height: 2.16em;
    }
    .chooser .pickbody, .chit.queue .pickbody {
      font-family: var(--hand); font-size: 14.5px; line-height: 1.34;
      color: var(--ink-2); margin: 0 0 11px; text-align: center;
    }
    .chit.chooser .pick.solo .pickbody { font-size: 15.5px; }
    /* One primary, two seconds -- using the two stamps this game already
       owns rather than a third kind of button invented for this page.
       Every control in Pen Fight is a rubber stamp: poured red for the
       thing the page expects you to do, hollow and double-ruled for a
       real alternative to it, and both landing very slightly crooked
       because a hand holding a stamp always is. A rounded rectangle was
       the wrong object entirely.

       Both are pushed to the floor of their card, so cards whose copy
       runs to different lengths still line their actions up. */
    .chooser .gostamp,
    .chooser .stampbtn { margin-top: auto; }
    /* The two live doors carry labels of different lengths, and a button
       that wraps to a second line is a button that no longer sits level
       with the one beside it. They hold one line and step their type
       down to do it, so the pair always bottoms out together. */
    .chooser .pickduo .stampbtn {
      white-space: nowrap; font-size: 13.5px; letter-spacing: 0.03em;
      padding: 9px 4px 7px; min-height: 44px;
      outline-offset: 2px;
    }
    /* The ladder: where you are standing on the way to the Trimax. The
       rung you are on is marked in red, the ones behind it are inked in,
       the rest are empty. Drawn from the real box, so it cannot flatter. */
    .ladder {
      position: relative; width: 100%;
      display: flex; align-items: flex-start; justify-content: space-between;
    }
    .chit.chooser .ladder { margin: 2px 0 13px; }
    .ladder::before {
      content: ''; position: absolute; left: 4px; right: 13px; top: 4.5px;
      height: 1.5px; background: rgba(36, 66, 143, 0.24);
    }
    .ladder .step {
      position: relative; flex: none;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    .ladder i {
      display: block; width: 9px; height: 9px; border-radius: 50%;
      border: 1.5px solid rgba(36, 66, 143, 0.45); background: var(--paper);
    }
    .ladder i.got { background: var(--ink); border-color: var(--ink); }
    .ladder i.now { border-color: var(--red); border-width: 2px; background: var(--paper); }
    /* Numbered only where there is room to read them. */
    .ladder b {
      display: none; font-family: var(--hand); font-weight: normal;
      font-size: 9.5px; line-height: 1; color: var(--ink-3);
    }
    .ladder .cup {
      position: relative; flex: none; width: 14px; height: 16px;
      margin-top: -3px;
      stroke: var(--red); stroke-width: 1.6; fill: none;
      stroke-linecap: round; stroke-linejoin: round;
    }
    /* The queue sheets stay one narrow leaf of paper at every width.
       They were briefly given the front door's desktop override and
       became a landscape poster: one sheet asking one short question does
       not want 720px, and every proportion on it broke at once. The front
       door widens because it is laying three doors side by side; these
       are laying out two people, and two people fit on a note. */
    .chit.queue { width: min(84vw, 340px); }
    /* A note is 340px wide and a Turnstile challenge is 300px plus its
       own margins, so on the one sheet that can be interrupted by a
       check, the paper makes room for it -- and only while it is
       actually open, so the searching sheet is not permanently sized
       around a widget that usually never appears. */
    .chit.queue:has(.humancheck[data-open="true"]) {
      width: min(calc(100vw - 16px), 390px);
    }
    /* Same hand as every other heading in the game, and the same one the
       front door uses. This was briefly set in the stamp face, which gave
       the queue a different voice from the page it is opened from and put
       a third job on a face that is only meant to print the mark and the
       buttons. Two fonts, and which is which is settled by whether the
       thing was written or printed: a heading on ruled paper was
       written. */
    .chit.queue .pickq {
      font-size: 30px; line-height: 1.06; margin-bottom: 7px;
    }
    .chit.queue .pickbody {
      font-size: 16px; line-height: 1.36; color: var(--ink-2);
      margin-bottom: 15px;
    }
    /* The queue's actions are pressed, not stamped.
       A rubber stamp is what this game prints a verdict with -- it lands
       crooked, it is double ruled, it is an event. These buttons are not
       events, they are the two or three things you can do next while a
       search is running, and stamped at full width they read as three
       verdicts stacked on top of each other. So they keep the paper's
       ink and lose the theatre: one solid, the rest outlined, square to
       the page. The colour does not move -- poured red is still the
       thing the sheet expects, hollow is still a real alternative --
       because that ranking was set on the front door and a queue three
       taps later is not the place to teach a second one. */
    .chit.queue .gostamp,
    .chit.queue .stampbtn {
      display: block; width: 100%; box-sizing: border-box;
      margin: 11px 0 0; padding: 12px 10px 11px;
      border-radius: 6px; transform: none; outline: none;
      font-family: var(--stamp); font-weight: 400;
      font-size: 16px; letter-spacing: 0.05em; text-transform: uppercase;
      line-height: 1; min-height: 46px; cursor: pointer;
    }
    .chit.queue .gostamp {
      border: 0; background: var(--red); color: var(--paper);
      box-shadow: 0 3px 0 rgba(120, 34, 25, 0.8);
    }
    .chit.queue .gostamp:active {
      transform: translateY(2px); box-shadow: 0 1px 0 rgba(120, 34, 25, 0.8);
    }
    .chit.queue .stampbtn {
      border: 1.6px solid rgba(36, 66, 143, 0.55);
      background: transparent; color: var(--ink); opacity: 1;
    }
    .chit.queue .stampbtn:active { background: rgba(36, 66, 143, 0.06); transform: none; }
    /* The way out is written, not pressed. */
    .chit.queue .howlink { margin-top: 13px; }
    /* Not an offer any more -- a report. It keeps the primary's shape so
       the sheet does not jump as it changes, and loses its lift so
       nothing about it invites a tap. */
    .chit.queue .gostamp.opening {
      background: rgba(36, 66, 143, 0.09); color: var(--ink-2);
      box-shadow: none; cursor: default;
    }

    /* ---- The queue sheets ----
       Searching, found, waiting, nobody-found. They borrow the front
       door's whole kit -- boxed panel, the two stamps -- so that arriving
       here from that page feels like the same page changing rather than
       a different screen taking over. */
    .chit.queue .queuepanel {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: start;
      gap: 0 10px;
      padding: 15px 10px 16px;
      margin-bottom: 13px;
      border-color: rgba(36, 66, 143, 0.3);
      border-radius: 7px;
    }
    .chit.queue .queuepanel.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0 4px; padding-left: 6px; padding-right: 6px;
    }
    /* No middle cell here, so each gap draws its own rule. */
    .chit.queue .queuepanel.three .qside + .qside {
      border-left: 1px solid rgba(36, 66, 143, 0.22);
    }
    .chit.queue .queuepanel.three .qwho { font-size: 11px; letter-spacing: 0.07em; }
    .chit.queue .queuepanel.three .qname { font-size: 13.5px; }
    .chit.queue .queuepanel.three .qside .vspen,
    .chit.queue .queuepanel.three .qspin { width: 24px; height: 24px; }
    .chit.queue .qside {
      min-width: 0; text-align: center;
      display: flex; flex-direction: column; align-items: center;
    }
    /* A rule between the halves, because they are two people's property
       and the panel should say so. It runs the full height of the panel
       and the mark between them sits on it, which is why it is drawn
       from the middle cell rather than as a border on a side: a border
       would stop at that cell instead of passing behind it. */
    /* A rule down each side of the mark, not one through it. Two people
       each get their own half of the panel and the thing between them
       sits in the gap, which is what makes it read as a desk with two
       sides rather than a row of three cells. */
    .chit.queue .qmid { position: relative; }
    .chit.queue .qmid::before,
    .chit.queue .qmid::after {
      content: ''; position: absolute; top: -33px; bottom: -16px;
      width: 1px; background: rgba(36, 66, 143, 0.22);
    }
    .chit.queue .qmid::before { left: -7px; }
    .chit.queue .qmid::after { right: -7px; }
    /* On a three-player desk the second gap needs its own rule, and
       there is no middle cell there to hang it from. */
    .chit.queue .queuepanel.three .qside ~ .qside + .qside {
      border-left: 1px solid rgba(36, 66, 143, 0.2);
    }
    .chit.queue .qwho {
      font-family: var(--hand); font-size: 12px; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--ink-3); margin: 0 0 2px;
      max-width: 100%;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .chit.queue .qname {
      font-family: var(--hand); font-size: 15.5px; line-height: 1.1;
      color: var(--ink); margin: 0; max-width: 100%;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* The half that is still a question, in the fainter ink the rest of
       the game uses for something not settled yet. */
    .chit.queue .qname.dim { color: var(--ink-3); }
    /* One art slot of one height on both sides, whether it holds a
       photographed pen or the space where one is going to be. Without it
       the two halves sit at different heights and stop lining up, which
       is the one thing a face-off panel has to get right. */
    .chit.queue .qside .vspen {
      width: 100%; max-width: 118px; height: 26px;
      margin: 7px auto 0; object-fit: contain;
    }
    /* The seat still being filled. A loader, turning: the only thing
       this half of the panel has to say is that something is still
       happening, and it says it in the paper's own ink. It sits in the
       same box the photograph opposite does, so the two halves stay on
       one line and the pen that arrives lands exactly where this was. */
    .chit.queue .qspin {
      display: block; width: 26px; height: 26px; margin: 7px auto 0;
    }
    .chit.queue .qspin circle { fill: none; stroke-width: 2.4; stroke-linecap: round; }
    .chit.queue .qtrack { stroke: rgba(36, 66, 143, 0.16); }
    .chit.queue .qarc {
      stroke: rgba(36, 66, 143, 0.62);
      /* r=9, so the circle is about 56.5 long; a quarter of it turning. */
      stroke-dasharray: 14 43;
      transform-origin: 50% 50%;
      animation: pfspin 0.85s linear infinite;
    }
    @keyframes pfspin { to { transform: rotate(360deg); } }
    .chit.queue .qmid {
      display: flex; align-items: center; justify-content: center;
      padding: 0 3px; height: 30px; margin-top: 48px;
    }
    .chit.queue .qvs {
      position: relative;
      font-family: var(--stamp); font-size: 18px; color: var(--red);
      letter-spacing: 0.04em;
    }
    /* The little burst a kid draws round the word when two things are
       about to go at each other. */
    .chit.queue .qvs::before,
    .chit.queue .qvs::after {
      content: ''; position: absolute; top: 50%; width: 7px; height: 1.5px;
      background: var(--red); opacity: 0.5;
    }
    .chit.queue .qvs::before { right: 100%; margin-right: 3px; }
    .chit.queue .qvs::after { left: 100%; margin-left: 3px; }
    .chit.queue .qmid > * { position: relative; background: var(--paper); }
    /* The mark that means somebody is looking.
       It was a 22px hairline glyph adrift in the widest gap on the
       sheet, which is why it read as a stray tick rather than a thing.
       Now it is weighted like a drawn object -- a heavy grip, a lens
       with a gleam in it so it reads as glass -- at a size that holds
       the space between the two rules, and it sweeps the way a hand
       holding one does. */
    .chit.queue .qglass {
      width: 30px; height: 30px; padding: 4px 0;
      stroke: var(--red); fill: none;
      stroke-linecap: round; stroke-linejoin: round;
      animation: pfsweep 3.4s ease-in-out infinite;
      transform-origin: 60% 60%;
    }
    .chit.queue .qglass .qlens { stroke-width: 2.5; }
    .chit.queue .qglass .qgrip { stroke-width: 3.2; }
    .chit.queue .qglass .qgleam { stroke-width: 1.7; opacity: 0.45; }
    @keyframes pfsweep {
      0%, 100% { transform: rotate(-15deg); }
      50%      { transform: rotate(8deg); }
    }
    /* The same magnifier again, once, at the size a sheet with nothing
       else on it can carry -- and shaking slightly, the way you shake
       something you are looking through. */
    .chit.queue .qglasswrap { margin: 2px 0 15px; }
    .chit.queue .qglasswrap .qglass {
      width: 46px; height: 46px; opacity: 0.6;
      animation: pfhunt 2.8s ease-in-out infinite;
      transform-origin: 42% 42%;
    }
    @keyframes pfhunt {
      0%, 62%, 100% { transform: rotate(-7deg); }
      30%           { transform: rotate(7deg); }
    }
    /* Three facts about the match that is about to start, in one strip
       under the panel: format, mode, and what it costs. */
    .chit.queue .qfacts {
      display: grid; grid-template-columns: repeat(3, 1fr);
      align-items: center; padding: 9px 4px; margin-bottom: 12px;
    }
    .chit.queue .qfact {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      min-width: 0; padding: 0 3px;
    }
    .chit.queue .qfact + .qfact { border-left: 1px solid rgba(36, 66, 143, 0.2); }
    .chit.queue .qfact span {
      font-family: var(--hand); font-size: 11.5px; letter-spacing: 0.07em;
      text-transform: uppercase; color: var(--ink-2); line-height: 1.1;
      text-align: center;
    }
    .chit.queue .qfico {
      width: 15px; height: 16px;
      stroke: var(--red); stroke-width: 1.5; fill: none;
      stroke-linecap: round; stroke-linejoin: round; opacity: 0.75;
    }
    /* The seat filling: the panel it happens in settles, rather than the
       pen inside it, because the far pen is mirrored across the fold and
       an animation on it would have to know which side it was on. */
    .chit.queue .queuepanel.landed { animation: pfsat 420ms cubic-bezier(0.2, 0.85, 0.3, 1) both; }
    @keyframes pfsat {
      0%   { opacity: 0.35; transform: translateY(-6px); }
      100% { opacity: 1; transform: none; }
    }
    /* The queue sheets stack their actions, so the stamps go back to
       full width and the ranking reads down the page. */
    .chit.queue .queuepanel ~ .gostamp,
    .chit.queue .queuepanel ~ .stampbtn,
    .chit.queue .qfacts ~ .gostamp,
    .chit.queue .qfacts ~ .stampbtn,
    .chit.queue .qglasswrap ~ .gostamp,
    .chit.queue .qglasswrap ~ .stampbtn { margin-top: 11px; }
    .chit.queue .waitlong { display: none; }
    .chit.queue .waitlong.show { display: block; margin-top: 12px; }
    @media (prefers-reduced-motion: reduce) {
      .chit.queue .qarc,
      .chit.queue .qglass,
      .chit.queue .qglasswrap .qglass,
      .chit.queue .queuepanel.landed { animation: none; }
    }

    /* Short phones: the front door has to fit without scrolling, so the
       type steps down and the air between blocks closes up. Nothing is
       removed -- a first-timer still sees all three doors at once. */
    @media (max-height: 700px) {
      .chit.chooser .pickq { font-size: 25px; }
      .chit.chooser .pickhead { margin: 0 0 10px; }
      .chit.chooser .pick { padding: 10px 9px 11px; }
      .chit.chooser .pick h3 { font-size: 17px; margin-bottom: 4px; }
      .chit.chooser .pick.solo h3 { font-size: 20px; }
      .chit.chooser .pickbody { font-size: 13.5px; margin-bottom: 9px; }
      .chit.chooser .pick.solo .pickbody { font-size: 14px; }
      .chit.chooser .pickart { height: 28px; margin-bottom: 3px; }
      .chit.chooser .pickicon { width: 23px; height: 23px; }
      .chit.chooser .pickicon.cupbig { width: 26px; height: 26px; }
      .chit.chooser .pickduo .stampbtn { min-height: 42px; padding: 8px 4px 6px; font-size: 12.5px; }
      .chit.chooser .gostamp { padding: 10px 8px 8px; font-size: 17px; }
      .chit.chooser .pick.solo .pickpen { max-width: 170px; margin-bottom: 4px; }
      .chit.chooser .ladder { margin: 0 0 8px; }
      .chit.chooser .picksec { margin-bottom: 6px; }
      .chit.chooser .pickcol + .pickcol { margin-top: 9px; }
      /* Chrome gives way before content does: the page's own margins
         close up and the doodles go, so that all three doors still land
         above the fold on a 640px phone. */
      .chit.chooser { padding: 15px 15px 13px 27px; }
      .chit.chooser .brand { margin-bottom: 7px; }
      .chit.chooser .pickq { margin-bottom: 8px; }
    }
    /* A pen of yours in somebody else's pocket is the one line on this
       paper worth chasing, and red is what this paper already uses for
       what has gone wrong. */
    .chit .pick .who.owed { color: var(--red); }
    /* The report card holds sentences where the ranking holds names.
       The ranking clips a long name to one line on purpose, which is
       right for a name and takes the end off a sentence: "beat a real
       pen usi…". Here the line wraps and the pen it pays keeps its own
       column at the end. */
    .chit .board.card li { align-items: baseline; }
    .chit .board.card li span {
      white-space: normal; overflow: visible; text-overflow: clip;
      text-transform: none; font-size: 18px; line-height: 1.25;
    }
    .chit .board.card li em { min-width: 62px; text-align: right; font-size: 17px; }
    .chit .board.card li b { min-width: 18px; }
    /* Done is ink; still to do is the same hand, fainter. */
    .chit .board.card li:not(.got) span { color: var(--ink-2); }
    .chit .board.card li.sealed span { letter-spacing: 0.22em; color: var(--ink-3); }
    .chit .board.card li.sealed em { color: var(--ink-3); }
    /* Name and three numbers on the top row; the one sentence worth
       reading, if there is one, wraps onto its own full-width line
       underneath rather than fighting the chips for space. */
    .chit .board.rivals li { flex-wrap: wrap; row-gap: 3px; }
    .chit .board.rivals li em { min-width: 46px; }
    /* Whoever is currently winning gets warm ink; whoever it is against
       gets a cooler, cautioning one. Neither is the paper's red, which
       stays reserved for the one line that is actually a problem: a pen
       still sitting in somebody else's pocket. */
    .chit .board.rivals li em.hot u { color: var(--red); opacity: 0.75; }
    .chit .board.rivals li em.cold u { color: var(--ink-2); }
    .chit .board.rivals li .rivalnote {
      flex-basis: 100%;
      font-style: normal;
      font-family: var(--hand);
      font-size: 15px;
      color: var(--ink-2);
    }
    /* The one thing on this sheet worth chasing: a pen of yours that is
       still in somebody else's pocket. Red is the paper's own colour for
       what has gone wrong, and it is already the margin rule and the
       lost-round cross. */
    .chit .board.rivals li .rivalnote.owed { color: var(--red); }
    .chit .board.rivals li .rivalnote.ran { color: var(--ink-3); }
    /* The signature at the bottom of the notice. Written, faint, and set
       below the button so it is the last thing on the sheet rather than
       something competing with the ranking above it. */
    .chit .madeby {
      margin-top: 14px;
      text-align: center;
      font-family: var(--hand);
      font-size: 16px;
      line-height: 1.4;
      color: var(--ink-2);
    }
    .chit .madeby a {
      color: var(--ink);
      text-decoration: underline;
      text-decoration-color: var(--ink-3);
      text-underline-offset: 3px;
    }
    .chit .madeby a:active { color: var(--red); }
    .chit .madeby.legalby {
      margin-top: 11px;
      font-size: 14px;
      color: var(--ink-3);
    }
    .chit .madeby.legalby a { color: var(--ink-2); }
    .chit .fineprint a {
      color: var(--ink-2);
      text-decoration: underline;
      text-decoration-color: var(--ink-3);
      text-underline-offset: 3px;
    }
    .pf-legal-crawl {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
    .chit .standing {
      margin-top: 14px; padding-top: 11px;
      border-top: 1px solid var(--ink-3);
      text-align: center; font-size: 21px; text-transform: uppercase;
    }
    /* The countdown to the prize. Hand-written like everything else, the
       number in ink, the Trimax in the red this paper keeps for what
       matters. No box, no border: it is a line a kid mutters, not a
       panel. */
    .chit .quest {
      margin-top: 14px;
      text-align: center;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .chit .quest span { color: var(--red); white-space: nowrap; }
    /* The distance under the prize on the entry form. */
    .chit .prizeline { text-align: center; margin: 2px 0 6px; }
    /* Returning champions should discover recovery where a new journey
       begins, not four doors and a scroll later. It stays visually secondary
       to play: one handwritten line, generous touch target, no new panel. */
    .chit .returningchampion {
      width: 100%; min-height: 44px; margin-top: 7px; padding: 8px 10px 6px;
      border: 1px dashed rgba(36, 66, 143, 0.42); background: rgba(36, 66, 143, 0.035);
      color: var(--ink); font-family: var(--hand); font-size: 17px; cursor: pointer;
    }
    .chit .returningchampion span { margin-right: 5px; color: var(--ink-2); }
    .chit .returningchampion b { font-weight: normal; text-decoration: underline; text-underline-offset: 3px; }
    .chit .returningchampion:active { color: var(--red); transform: scale(0.98); }
    .chit .returningchampion:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
    /* The champion's name on the certificate, circled in red the way a
       kid circles the thing that matters on a page. */
    .chit .champname {
      position: relative;
      width: fit-content;
      margin: 12px auto 2px;
      padding: 4px 20px;
      font-family: var(--hand);
      font-size: 30px;
      text-transform: uppercase;
      text-align: center;
    }
    .chit .champname::after {
      content: '';
      position: absolute;
      inset: -4px -7px -3px -8px;
      border: 2.5px solid var(--red);
      border-radius: 52% 48% 50% 52% / 58% 55% 45% 42%;
      transform: rotate(-1.6deg);
      pointer-events: none;
    }
    /* The title, made official the only way this game makes anything
       official: a rubber stamp, in red, slightly crooked because a hand
       holding a stamp always is. */
    .chit .champstamp {
      display: block;
      width: fit-content;
      margin: 14px auto 6px;
      padding: 8px 18px 6px;
      border: 2.5px solid var(--red);
      outline: 1px solid var(--red);
      outline-offset: 3px;
      color: var(--red);
      font-family: var(--stamp);
      font-size: 21px;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      transform: rotate(-2.4deg);
      opacity: 0.92;
    }
    .chit .standing span { color: var(--ink-2); font-size: 16px; }
    /* Your own row, circled. The rows are at the pitch of the paper's
       ruling now, which is tighter than a pen goes round a name, so this
       one row is given the extra height the loop needs rather than being
       drawn as a flat lozenge across two lines of somebody else's. */
    .chit .board li.you { position: relative; height: 33px; margin: 3px 0; }
    .chit .board li.you span,
    .chit .board li.you b,
    .chit .board li.you em { color: var(--red); }
    .chit .board li.you::after {
      content: ''; position: absolute; inset: -1px -5px -1px -7px;
      border: 2.5px solid var(--red);
      border-radius: 52% 48% 50% 52% / 58% 55% 45% 42%;
      transform: rotate(-0.6deg); pointer-events: none;
    }
    .rankbtn {
      display: block; width: calc(100% - 12px); margin: 9px 6px 0;
      padding: 9px; border: none; border-radius: 2px;
      background: rgba(28,14,2,0.4);
      color: rgba(255,240,220,0.86);
      font-family: var(--hand); font-size: 16px;
      text-transform: uppercase; letter-spacing: 0.06em; cursor: pointer;
    }
    .chit .sharebtn {
      display: block; width: 100%;
      margin-top: 16px; padding: 10px;
      border: 2px dashed var(--ink-3);
      background: transparent;
      color: var(--ink-2);
      font-family: var(--stamp);
      font-size: 14px; letter-spacing: 0.09em; text-transform: uppercase;
      cursor: pointer;
    }
    /* The line that is about to go out, drafted on the rules the way you
       would write a note before passing it. 27px so it sits on them. */
    .chit .postline {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1.5px dashed var(--ink-3);
      font-size: 19px;
      line-height: 27px;
    }
    /* The other two channels. Present, and deliberately not competing with
       the stamp above them: X is the ask, these are for everywhere else,
       which on an Indian phone means WhatsApp nearly every time. */
    .chit .quietrow {
      display: flex;
      gap: 10px;
      margin-top: 13px;
      padding-top: 11px;
      border-top: 1px solid var(--ink-3);
    }
    .chit .quietbtn {
      flex: 1;
      padding: 7px 6px 6px;
      border: none;
      background: transparent;
      color: var(--ink-2);
      font-family: var(--hand);
      font-size: 16px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-decoration: underline;
      text-decoration-color: var(--ink-3);
      text-underline-offset: 4px;
      cursor: pointer;
    }
    .chit .quietbtn:active { color: var(--ink); }
    /* One of these is a real link, because a WhatsApp invite has to be
       tapped as one to reach the app. An anchor does not centre its own
       text and does not take a button's line-height, so it is given both
       and is otherwise identical to the buttons beside it. */
    .chit a.quietbtn { display: block; text-align: center; line-height: 1.25; }
    /* ---- How the shot works ----
       The gesture, played rather than written. Twice per loop: a short
       pull that barely moves the pen, then a long one that sends it off,
       so the relationship between pull and force is shown and never has
       to be said. The pen stays still while you aim, exactly as it does
       on the desk; only the pull line and the fingertip move. */
    /* The same demo, shrunk, on the sheet somebody lands on from a link.
       That sheet has one job and it is a single decision, so the button
       has to be reachable without scrolling; at full size the lesson
       pushed it off the bottom of a phone. Short enough to answer "what
       even is this" at a glance, which is all it has to do before
       somebody has agreed to play. */
    .chit .teaser .howscreen { height: 128px; }
    .chit .teaser .howto { margin-top: 10px; padding-top: 9px; }
    .chit .teaser .howsay { margin-top: 6px; font-size: 15px; }

    .chit .howto {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1.5px dashed var(--ink-3);
    }
    .chit .howtitle {
      margin: 0 0 8px;
      color: var(--ink);
      font: 20px/1 var(--hand);
      text-align: center;
      text-transform: uppercase;
    }
    /* On a short card the lesson gives up height before the button does.
       It is still the same three shots at the same pace, just a shallower
       window onto the desk. */
    @media (max-height: 720px) {
      .chit .howto { margin-top: 9px; padding-top: 8px; }
      /* Specific enough to beat the base .chit .howscreen further down
         the sheet, which is the rule this was silently losing to. */
      .chit .howto .howscreen { height: 108px; }
      .chit .howto .howsay { margin-top: 4px; font-size: 13.5px; }
      .chit .gostamp { margin-top: 10px; padding: 10px 10px 8px; font-size: 17px; }
      .chit .versus .vspen { max-height: 40px; }
    }
    /* The window onto the desk.
       Vertical, because that is the geometry of the real thing on every
       device: their pen is away from you at the top, yours is nearest at
       the bottom, you pull toward yourself and the pen travels away. The
       first version of this was a horizontal strip, which quietly taught
       a sideways flick, which is not the game. */
    .chit .howscreen {
      position: relative;
      height: 168px;
      margin: 0 2px;
      overflow: hidden;
      border: 2px solid var(--ink);
      background:
        radial-gradient(ellipse 120% 80% at 50% 20%, rgba(255,225,175,0.16), transparent 70%),
        linear-gradient(180deg, #906030 0%, #ab7a42 52%, #8d5c2c 100%);
      box-shadow: inset 0 0 22px rgba(40, 24, 8, 0.55);
    }
    .chit .howrival, .chit .howmine {
      position: absolute;
      left: 50%;
      width: 56%;
      margin-left: -28%;
      display: block;
      filter: drop-shadow(0 3px 4px rgba(30, 16, 4, 0.5));
    }
    /* Theirs, across the desk. */
    .chit .howrival {
      top: 22px;
      animation: howrival 6.2s cubic-bezier(0.25, 0.7, 0.4, 1) infinite;
    }
    /* Yours, nearest you, and sat high enough that the pull and the
       finger have somewhere to go. Everything here is anchored from the
       top, because the pull grows toward you and a bottom-anchored box
       grows the other way. */
    .chit .howmine {
      top: 96px;
      animation: howmine 6.2s cubic-bezier(0.2, 0.85, 0.3, 1) infinite;
    }
    /* The pull, in the chalk dashes the live aim uses on the desk,
       running from your pen back toward you. */
    .chit .howpull {
      position: absolute;
      left: 50%;
      top: 104px;
      width: 0;
      height: 0;
      margin-left: -1px;
      border-left: 2px dashed rgba(246, 240, 226, 0.85);
      animation: howpull 6.2s ease-in-out infinite;
    }
    /* The fingertip doing it. */
    .chit .howtip {
      position: absolute;
      left: 50%;
      top: 99px;
      width: 13px; height: 13px;
      margin-left: -6.5px;
      border-radius: 50%;
      background: rgba(246, 240, 226, 0.92);
      box-shadow: 0 0 0 3px rgba(191, 59, 43, 0.55);
      opacity: 0;
      animation: howtip 6.2s ease-in-out infinite;
    }
    /* Beat one is a soft pull that falls short of their pen; beat two is
       a real one that takes it off the desk. Power is taught by what it
       does, which is why the loop has two beats and no sentence. */
    /* One run up the desk, not three takes of the same shot.
       The pen never goes back to where it started: each shot begins from
       wherever the last one left it, which is how the game is actually
       played and what makes three shots fit in less time than two used
       to. Each is taken with a different hold, and the pulls get longer,
       so the distance covered grows with them: a nudge, a push, and then
       the one that arrives. */
    @keyframes howtip {
      /* held in the middle, barely pulled */
      0%, 2%    { transform: translate(0, 0);            opacity: 0; }
      4%        { transform: translate(0, 0);            opacity: 1; }
      13%       { transform: translate(0, 18px);         opacity: 1; }
      17%       { transform: translate(0, 18px);         opacity: 1; }
      18%       { transform: translate(0, 18px);         opacity: 0; }
      /* up near the cap, from where the pen now lies */
      30%, 32%  { transform: translate(-34px, -18px);    opacity: 0; }
      34%       { transform: translate(-34px, -18px);    opacity: 1; }
      43%       { transform: translate(-34px, 16px);     opacity: 1; }
      47%       { transform: translate(-34px, 16px);     opacity: 1; }
      48%       { transform: translate(-34px, 16px);     opacity: 0; }
      /* and down near the point, for the one that reaches */
      60%, 62%  { transform: translate(34px, -44px);     opacity: 0; }
      64%       { transform: translate(34px, -44px);     opacity: 1; }
      74%       { transform: translate(34px, 0);         opacity: 1; }
      78%       { transform: translate(34px, 0);         opacity: 1; }
      79%       { transform: translate(34px, 0);         opacity: 0; }
      100%      { transform: translate(34px, 0);         opacity: 0; }
    }
    @keyframes howpull {
      0%, 4%    { height: 0;    transform: translate(0, 0);         opacity: 1; }
      13%       { height: 18px; transform: translate(0, 0); }
      17%       { height: 18px; transform: translate(0, 0);         opacity: 1; }
      18%       { height: 18px; transform: translate(0, 0);         opacity: 0; }
      19%, 32%  { height: 0;    transform: translate(-34px, -18px); opacity: 0; }
      34%       { height: 0;    transform: translate(-34px, -18px); opacity: 1; }
      43%       { height: 34px; transform: translate(-34px, -18px); }
      47%       { height: 34px; transform: translate(-34px, -18px); opacity: 1; }
      48%       { height: 34px; transform: translate(-34px, -18px); opacity: 0; }
      49%, 62%  { height: 0;    transform: translate(34px, -44px);  opacity: 0; }
      64%       { height: 0;    transform: translate(34px, -44px);  opacity: 1; }
      74%       { height: 44px; transform: translate(34px, -44px); }
      78%       { height: 44px; transform: translate(34px, -44px);  opacity: 1; }
      79%       { height: 44px; transform: translate(34px, -44px);  opacity: 0; }
      80%, 100% { height: 44px; transform: translate(34px, -44px);  opacity: 0; }
    }
    @keyframes howmine {
      0%, 18%   { transform: translateY(0);     opacity: 1; }
      27%       { transform: translateY(-18px); opacity: 1; }  /* a nudge */
      48%       { transform: translateY(-18px); opacity: 1; }
      56%       { transform: translateY(-44px); opacity: 1; }  /* further */
      79%       { transform: translateY(-44px); opacity: 1; }
      87%       { transform: translateY(-60px); opacity: 1; }  /* and in */
      95%       { transform: translateY(-60px); opacity: 1; }
      98%       { transform: translateY(-60px); opacity: 0; }
      99%       { transform: translateY(0);     opacity: 0; }

    .boxwrap {

    /* Painted tin: enamel that catches the light along the top edge, a
       stamped seam under the lid print, and a felt-dark tray sunk into it. */
    /* The box is a display case, so it is built like one: the tin is the
       object and everything else is the card that stands beside it. On a
       wide screen that is two columns, and because the tin is sized off
       the viewport height instead of a fixed pixel width, nothing ever
       needs to scroll. What was here before was a 344px column, which is
       a phone layout that a desktop was being asked to wear: the tin could
       not breathe, the card and the buttons ran past the bottom, and the
       browser put its own scrollbars through the middle of the thing. */
    .boxstack {
      display: grid;
      grid-template-columns: auto minmax(272px, 352px);
      align-items: center;
      gap: 0 26px;
      padding: 16px;
    }

      margin: 0 2px 10px;

    .barbtn {

      border-radius: 2px;
      background: var(--paper-hi);
