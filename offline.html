      /* A quiet "more below" pill so nobody wonders whether the sheet
         actually ends where the visible fold does. Position sticky at
         the bottom of the chit's scroll box; JS hides it when the user
         is already at the bottom. */
      /* Pill sits INSIDE a sticky band; the band's fade makes text
         behind read as "there is more below" without the pill hitting
         content mid-word. Fades away when the reader hits the bottom. */
      .chit.schoolcorridorpaper .scrollcue {
        display:grid; position:sticky; bottom:0; z-index:2;
        display:grid; justify-items:center; margin:14px -22px 0 -22px;
        padding:14px 0 6px;
        background:linear-gradient(180deg, rgba(233,226,207,0) 0%, rgba(233,226,207,.94) 55%, var(--paper) 100%);
        pointer-events:none;
        transition:opacity .18s ease;
        opacity:1;
      }

        opacity:0; transform:translateY(6px);
        visibility:hidden;
        pointer-events:none;
      }
      .chit.schoolcorridorpaper .scrollcue { margin:14px auto -6px; padding:14px 0 8px; }
      .chit.schoolcorridorpaper .scrollcue > b {
        display:inline-block;
        padding:4px 12px 5px;
        background:rgba(31,49,91,.9); color:#f4f6fb;

        animation:pfscrollpulse 1.4s ease-in-out infinite;
      }
      @keyframes pfscrollpulse {
        0%, 100% { transform:translateY(0); opacity:.55; }
        50% { transform:translateY(3px); opacity:.95; }
      }
      @keyframes pfscrollpulse {
        0%, 100% { transform:translateY(0); opacity:.55; }
        50% { transform:translateY(3px); opacity:.95; }
      }

    /* The bench, as eleven steps. Used on the fixture card (where am I
       about to fight) and on the verdict (watch the marker move). One
       shape in both places, because one shape is how a player learns
       what it means. */
    .chit .climbbar { display:flex; gap:4px; justify-content:center; margin:6px 0 8px; }
    .chit .climbbar i { display:block; width:18px; height:8px; border-radius:1px; background:rgba(31,49,91,.14); box-shadow:inset 0 0 0 1px rgba(31,49,91,.16); }
    .chit .climbbar i.done { background:#22407e; box-shadow:none; }
    /* The step you are on is the one the eye should find first, so it is
       the red and it is taller than the rest of the row. */
    .chit .climbbar i.here { background:var(--red); height:12px; margin-top:-2px; box-shadow:0 0 0 2px rgba(191,59,43,.16); }
    .chit .verdictclimb { margin:10px 0 4px; }
    /* ---- The pre-match card, ranked ----
       Where you are (small) -> who is across the desk (big) -> what they
       do -> the matchup -> the tell -> both outcomes -> what you have
       left -> one action. Each said once, at the size its job earns. */
    .chit .cardwhere { margin:0 0 2px; font:10px var(--stamp); letter-spacing:.14em; text-transform:uppercase; color:var(--ink-2); text-align:center; }
    .chit h2.cardwho { margin:2px 0 0; font-size:30px; line-height:1; }
    .chit .cardwho-sub { margin:2px 0 6px; font:11px var(--stamp); letter-spacing:.14em; text-transform:uppercase; color:var(--red); text-align:center; }
    .chit.pencilmatchpaper .cardwho-sub { font:15px/1.25 var(--hand); letter-spacing:0; text-transform:none; color:var(--ink-2); }
    .chit .cardsteps { justify-content:center; margin:6px 0 2px; }
    .chit .cardoutcome { margin:8px 0 4px; }
    /* The climb, on the very first screen a stranger sees. Greyed past
       the class and never explained: a first-timer should glimpse that
       this goes somewhere before they have any idea how, and nothing
       here may slow down the sixty seconds to a first flick. */
    /* Who you play for, on every away card. Small, above the fixture, the
       way a team sheet names the side before it names the match. */
    .chit .awayframe { margin:0 0 8px; font:10.5px var(--stamp); letter-spacing:.13em; text-transform:uppercase; color:var(--ink-2); text-align:center; }
    /* The sending-off: who you represent, and where you are going. Two
       plates and an arrow, because that is how a fixture is pinned up. */
    .chit .sendoff { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; margin:16px 0 4px; }
    .chit .sendoff span { display:grid; gap:3px; padding:11px 9px; text-align:center; border:1px solid rgba(31,49,91,.24); background:rgba(255,253,244,.5); }
    .chit .sendoff small { font:10.5px var(--stamp); letter-spacing:.14em; text-transform:uppercase; color:var(--ink-2); }
    .chit .sendoff b { font:17px var(--stamp); letter-spacing:.04em; color:var(--ink); }
    .chit .sendoff .sendoff-to b { color:var(--red); }
    .chit .sendoff i { width:26px; height:2px; background:var(--ink-2); position:relative; opacity:.55; }
    .chit .sendoff i::after { content:''; position:absolute; right:-1px; top:-4px; width:9px; height:9px; border-top:2px solid var(--ink-2); border-right:2px solid var(--ink-2); transform:rotate(45deg); }
    .twinsurface-key { display:grid; grid-template-rows:1fr auto 1fr; gap:0; margin:12px 0 18px; border:1px solid rgba(31,49,91,.24); }
    .twinsurface-key.laminate { grid-template-rows:1fr; }
    .twinsurface-key.laminate .smooth i { background:linear-gradient(120deg,#ddd8c0,#cfcab1 55%,#d8d3ba); box-shadow:inset 0 1px rgba(255,255,255,.55); }
    .twinsurface-key span { display:grid; grid-template-columns:34px auto 1fr; column-gap:10px; align-items:center; padding:9px 11px; }
    .twinsurface-key span i { width:34px; height:20px; border-radius:2px; }
    .twinsurface-key span small { text-align:right; white-space:nowrap; }
    .twinsurface-key .rough i { background:linear-gradient(155deg,#6d472b,#8d633c 58%,#674227); box-shadow:inset 0 0 0 1px rgba(255,225,183,.14); }
    .twinsurface-key .smooth i { background:linear-gradient(145deg,#9a6838,#bb8b51 50%,#8f5d31); box-shadow:inset 5px 0 rgba(255,231,188,.1); }
    .twinsurface-key b { font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
    .twinsurface-key small { color:var(--ink-2); }
    .twinsurface-key em { display:grid; place-items:center; padding:3px; background:#424745; color:#fff; font:10px var(--stamp); text-transform:uppercase; font-style:normal; letter-spacing:.16em; }
    /* The three things the table does to a pencil, at one weight each,
       because they are the same kind of fact. This replaced a five-line
       paragraph of terms plus a surface key whose own text clipped. */
    .tablefacts { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1px; margin:10px 0; background:rgba(31,49,91,.18); border:1px solid rgba(31,49,91,.18); }
    .tablefacts span { display:grid; gap:1px; padding:8px 10px; background:var(--paper); }
    .tablefacts small { font:10px var(--stamp); letter-spacing:.12em; text-transform:uppercase; color:var(--ink-2); }
    .tablefacts b { font-family:var(--stamp); font-size:14px; letter-spacing:.03em; text-transform:uppercase; }
    .tablefacts em { font-style:normal; font-size:13px; line-height:1.2; color:var(--ink-2); }
    /* Plan text: the tell is the whole reason for the card, so it reads

    .pencilstakes { margin:2px 12px 8px; text-align:center; font:13px/1.4 var(--hand); color:var(--ink-2); }
    .pencilstakes b { color:var(--ink); font-weight:normal; }
    /* Inside the 9C card the two pencils are just objects on the page, not
       cards inside cards. Border, background, capped labels all off. */
    .chit.pencilmatchpaper .pencilmatchup { grid-template-columns:1fr auto 1fr; gap:14px; align-items:end; }
    .chit.pencilmatchpaper .pencilduel-side { border:0; background:transparent; padding:2px 4px 0; text-align:center; }
    .chit.pencilmatchpaper .pencilduel-side.rival { text-align:center; }

    .chit.pencilmatchpaper .pencilduel-side b { font:19px/1 var(--hand); letter-spacing:0; text-transform:none; color:var(--ink); margin-top:2px; }
    .chit.pencilmatchpaper .pencilduel-side .penshot { height:34px; margin-top:8px; transform:none; filter:drop-shadow(0 3px 4px rgba(20,22,35,.22)); }
    .chit.pencilmatchpaper .pencilduel-side.mine .penshot { transform:rotate(-1.6deg); }
    .chit.pencilmatchpaper .pencilduel-side.rival .penshot { transform:rotate(1.6deg); }
    .chit.pencilmatchpaper .pencilmatchup > strong { font-family:var(--hand); font-size:22px; color:var(--red); transform:rotate(-4deg); align-self:center; }
        .pencil-tell { padding:9px 12px; background:rgba(244,224,184,.45); box-shadow:inset 0 0 0 1px rgba(151,110,44,.22); }
    .pencil-tell small, .pencil-tell b { display:block; }
    .pencil-tell small { font:11px var(--stamp); text-transform:uppercase; letter-spacing:.1em; color:#986018; }
    .pencil-tell b { margin-top:4px; line-height:1.3; }
    .eraserbank { display:flex; align-items:center; gap:12px; padding:10px 12px; margin:14px 0; border:1px solid rgba(177,55,43,.28); background:rgba(255,242,236,.64); }
    .eraserbank > span { display:flex; gap:7px; }
    /* The reward is the same red-blue ink eraser already sitting in the 9B
       classroom, not a generic inventory lozenge. Keep its 60/40 split,
       blunt block shape and classroom-worn surface everywhere it appears. */
    .eraserbank i, .eraserreward i {

    .eraserbank i:nth-child(even), .eraserreward i:nth-child(even) { transform:rotate(4deg); }
    .eraserbank i.spent { filter:grayscale(1); opacity:.2; transform:scale(.72) rotate(2deg); }
    .eraserbank p { margin:0; }
    .eraserbank b, .eraserbank small { display:block; }

    .eraserreward > div { display:flex; gap:6px; transform:rotate(-3deg); }
    .eraserreward small, .eraserreward b { display:block; text-transform:uppercase; }
    .eraserreward small { font:11px var(--stamp); color:#986018; letter-spacing:.1em; }
    .eraserreward b { font:28px var(--stamp); color:var(--ink); }
    .eraserreward p { margin:2px 0 0; }
    .eraserhud { position:fixed; z-index:34; top:max(12px,env(safe-area-inset-top)); left:max(12px,env(safe-area-inset-left)); display:flex; align-items:center; gap:7px; min-height:34px; padding:6px 9px; border:1px solid rgba(247,235,205,.56); border-radius:3px; background:rgba(24,31,48,.88); color:#fff8df; box-shadow:0 4px 14px rgba(0,0,0,.25); opacity:0; pointer-events:none; transform:translateY(-8px); cursor:pointer; -webkit-tap-highlight-color:transparent; transition:opacity 140ms ease,transform 180ms ease; }
    .eraserhud.show { opacity:1; transform:translateY(0); pointer-events:auto; }
    .eraserhud.show:active { transform:translateY(0) scale(.96); }
    .eraserhud .eraserstock { display:flex; gap:5px; }
    /* The Nataraj: red one half, blue the other, the blue end the one that
       never rubbed out ink and only ever tore the page. Sitting on its
       long edge so the top face and the front face both show, which is
       what makes it a block rather than a swatch. */
    .eraserhud i {
      display:block; position:relative; width:26px; height:12px; border-radius:2px;
      background:linear-gradient(90deg,#cf4436 0 52%,#2f4a9c 52%);
      box-shadow:
        inset 0 1px rgba(255,255,255,.4),
        inset 0 -3px rgba(0,0,0,.28),
        0 2px 2px rgba(0,0,0,.3);
      transform:rotate(-3deg);
    }
    .eraserhud i::after {
      content:''; position:absolute; inset:3px 4px auto; height:1px;
      background:rgba(255,255,255,.34);
    }
    .eraserhud i:nth-child(2) { transform:rotate(3deg); }
    .eraserhud i.spent { opacity:.2; filter:grayscale(1); box-shadow:none; }
    .eraserhud b { font:16px var(--stamp); }
    /* ---- The eraser, shown as the object it is ----

       Tapping the count used to be nothing, and the obvious fix was to
       throw a paper chit at it. Wrong surface: paper is how this game
       talks - terms, verdicts, rankings - and an eraser is a thing you
       own, the way the pens in the tin are things you own. A game shows
       you an item by showing you the item. So this is the eraser itself,
       turning slowly in the dark, and the words are underneath it.

       Built as a real cuboid in CSS 3D rather than a picture of one,
       because it has to keep looking like a block while it turns. */
    .eraserwhat {
      position:fixed; inset:0; z-index:80; display:grid; place-items:center;
      gap:0; padding:24px; background:rgba(14,18,28,.82);
      backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
      opacity:0; pointer-events:none; transition:opacity 200ms ease;
    }
    .eraserwhat.show { opacity:1; pointer-events:auto; }
    .eraserwhat-inner { display:grid; justify-items:center; gap:26px; max-width:340px; text-align:center; }
    .eraserstage { position:relative; perspective:640px; width:210px; height:150px; display:grid; place-items:center; }
    /* Float and spin are separate elements on purpose: one transform
       property cannot carry two independent animations, and the block has
       to keep turning while it rises. */
    .eraserbob { animation:eraserbob 3.6s ease-in-out infinite; transform-style:preserve-3d; }
    .eraser3d {
      position:relative; width:132px; height:26px; transform-style:preserve-3d;
      animation:eraserturn 11s linear infinite;
    }
    /* Every face is centred on the block's own origin, then pushed out to
       its wall. Offsetting with left/top instead put the faces at three
       different depths and the block came out as flat stripes. */
    .eraser3d div {
      position:absolute; left:50%; top:50%; box-sizing:border-box;
      backface-visibility:hidden;
    }
    .eraser3d .ft, .eraser3d .bk { width:132px; height:26px; }
    .eraser3d .lf, .eraser3d .rt { width:46px; height:26px; }
    .eraser3d .up, .eraser3d .dn { width:132px; height:46px; }
    /* The long sides: red one half, blue the other. */
    .eraser3d .ft { transform:translate(-50%,-50%) translateZ(23px);
                    background:linear-gradient(90deg,#d4483a 0 50%,#31479c 50%); }
    .eraser3d .bk { transform:translate(-50%,-50%) rotateY(180deg) translateZ(23px);
                    background:linear-gradient(90deg,#31479c 0 50%,#d4483a 50%); filter:brightness(.68); }
    /* The two ends, each solid. */
    .eraser3d .rt { transform:translate(-50%,-50%) rotateY(90deg) translateZ(66px); background:#27408c; }
    .eraser3d .lf { transform:translate(-50%,-50%) rotateY(-90deg) translateZ(66px); background:#bb3a2c; }
    /* Top and bottom. */
    .eraser3d .up { transform:translate(-50%,-50%) rotateX(90deg) translateZ(13px);
                    background:linear-gradient(90deg,#e05343 0 50%,#3a53b4 50%); }
    .eraser3d .dn { transform:translate(-50%,-50%) rotateX(-90deg) translateZ(13px);
                    background:linear-gradient(90deg,#a63325 0 50%,#22357c 50%); filter:brightness(.6); }
    /* The moulded seam down the long faces, and the worn rounded corners
       every one of these had within a week. */
    .eraser3d .ft::after, .eraser3d .up::after {
      content:''; position:absolute; left:6%; right:6%; top:calc(50% - 1px);
      height:1px; background:rgba(255,255,255,.22);
    }
    .eraser3d .ft, .eraser3d .bk, .eraser3d .up, .eraser3d .dn { border-radius:3px; }
    .eraser3d .lf, .eraser3d .rt { border-radius:3px; }
    .eraserstage::after {
      content:''; position:absolute; bottom:14px; left:50%; width:118px; height:13px;
      margin-left:-59px; border-radius:50%; background:rgba(0,0,0,.5); filter:blur(8px);
      animation:erasershadow 3.6s ease-in-out infinite;
    }
    @keyframes eraserturn { from { transform:rotateX(-14deg) rotateY(0deg); }
                            to   { transform:rotateX(-14deg) rotateY(360deg); } }
    @keyframes eraserbob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-12px); } }
    @keyframes erasershadow { 0%,100% { opacity:.5; transform:scale(1); } 50% { opacity:.28; transform:scale(.84); } }
    @media (prefers-reduced-motion: reduce) {
      .eraser3d { animation:none; transform:rotateX(-14deg) rotateY(-32deg); }
      .eraserbob, .eraserstage::after { animation:none; }
    }

      84% { transform: translateY(-1vh) scale(1.035) rotate(0.4deg); }

        opacity: 1;
        transform: translateY(0) scale(1) rotate(0);

    }
    .unlockcard::after {
      content: '';

      inset: 8px -7px -10px 9px;
