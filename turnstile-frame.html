<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #widget { width: 300px; min-height: 65px; }
    body.compact #widget { width: 150px; min-height: 140px; }
  </style>
</head>
<body>
  <div id="widget"></div>
  <script>
    const params = new URLSearchParams(location.search)
    const nonce = params.get('nonce') || ''
    const sitekey = params.get('sitekey') || ''
    const action = (params.get('action') || 'multiplayer_entry').replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 32)
    const compact = params.get('size') === 'compact'
    if (compact) document.body.classList.add('compact')
    const send = (type, detail = {}) => parent.postMessage({
      source: 'pf-turnstile-frame',
      nonce,
      type,
      ...detail,
    }, location.origin)
    window.turnstileReady = () => {
      try {
        const widget = turnstile.render('#widget', {
          sitekey,
          action,
          appearance: 'always',
          execution: 'execute',
          theme: 'light',
          size: compact ? 'compact' : 'normal',
          retry: 'auto',
          'retry-interval': 2000,
          'refresh-timeout': 'auto',
          'response-field': false,
          callback: (token) => send('success', { token }),
          'error-callback': (code) => send('error', { code: String(code || '') }),
          'expired-callback': () => send('expired'),
          'timeout-callback': () => send('timeout'),
          'unsupported-callback': () => send('unsupported'),
          'before-interactive-callback': () => send('before-interactive'),
          'after-interactive-callback': () => send('after-interactive'),
        })
        send('rendered', { widget })
        turnstile.execute(widget)
        send('executed', { widget })
      } catch (error) {
        send('exception', { message: error instanceof Error ? error.message : String(error) })
      }
    }
    send('frame-ready')
  </script>
  <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=turnstileReady"
    async
    defer
    onerror="send('script-error')"
  ></script>
</body>
</html>
