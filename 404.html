<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Pen Fight</title>
  <meta name="description" content="This page was knocked off the desk." />
  <link rel="stylesheet" href="/pen-fight-tokens.css" />
  <link rel="stylesheet" href="/assets/comic-nav.css" />
  <link rel="stylesheet" href="funky-system.css" />
  <script src="/assets/comic-nav.js" defer></script>

  <style>
    .error-card-container {
      max-width: 720px;
      margin: 40px auto 90px;
      padding: 0 20px;
      text-align: center;
      position: relative;
    }

    .torn-error-box {
      background: var(--pf-paper-light);
      border: var(--pf-border-thick);
      padding: 45px 30px;
      box-shadow: 8px 8px 0px var(--pf-ink), 12px 12px 0px var(--pf-orange);
      position: relative;
      border-radius: var(--pf-radius-md);
      transform: rotate(-1.5deg);
    }

    .falling-pen-illustration {
      width: 220px;
      height: 180px;
      margin: 0 auto 20px;
      position: relative;
    }
  </style>
</head>
<body class="theme-pink">

  <!-- ==========================================================================
       404 ERROR HERO
       ========================================================================== -->
  <main class="error-card-container">
    <div class="tape-strip" style="top: -14px; left: 20px; transform: rotate(-30deg);"></div>
    <div class="tape-strip" style="top: -14px; right: 20px; transform: rotate(25deg);"></div>

    <div class="torn-error-box">
      <!-- Doodle of pen falling off the desk -->
      <div class="falling-pen-illustration">
        <svg width="220" height="180" viewBox="0 0 200 160">
          <!-- Desk corner -->
          <rect x="10" y="20" width="80" height="80" fill="#c49a6c" stroke="#1A1A1A" stroke-width="3.5"/>
          <line x1="10" y1="20" x2="90" y2="20" stroke="#1A1A1A" stroke-width="4.5"/>
          <line x1="90" y1="20" x2="90" y2="100" stroke="#1A1A1A" stroke-width="4.5"/>

          <!-- Falling 404 Pen into void -->
          <g transform="translate(130, 85) rotate(65)">
            <rect x="0" y="0" width="80" height="12" rx="3" fill="#FF6B35" stroke="#1A1A1A" stroke-width="2.5"/>
            <polygon points="80,0 92,6 80,12" fill="#1A1A1A"/>
            <circle cx="20" cy="6" r="2" fill="#FFF"/>
            <text x="25" y="10" font-family="'Space Mono', monospace" font-size="8" font-weight="bold" fill="#FFF">404</text>
          </g>

          <!-- Action motion lines -->
          <path d="M95 30 Q 120 40 140 75" stroke="#E85D75" stroke-width="3" stroke-dasharray="4 4" fill="none"/>
          <text x="110" y="35" font-family="'Bangers'" font-size="28" fill="#E85D75">WHAM!</text>
        </svg>
      </div>

      <div class="sticker-burst" style="margin-bottom: 12px; background: var(--riso-pink); color: #fff;">
        404
      </div>

      <h1 style="font-family: var(--font-display); font-size: clamp(2.6rem, 7vw, 4.8rem); line-height: 0.95; text-transform: uppercase; margin-bottom: 14px;">
        PAGE NOT <span style="color: var(--riso-pink);">FOUND</span>
      </h1>

      <p style="font-family: var(--font-hand); font-size: 1.45rem; font-weight: 700; color: #333; line-height: 1.35; margin-bottom: 30px;">
        This page was knocked off the desk.
      </p>

      <a href="/" class="btn-chunky btn-pink" style="font-size: 1.35rem; padding: 14px 34px;">
        <span>BACK TO GAME ↴</span>
      </a>
    </div>
  </main>

  <!-- ==========================================================================
       GLOBAL FOOTER
       ========================================================================== -->
  <footer class="site-footer">
    <div class="footer-backcover-box">
      <h2 style="font-family: var(--font-display); font-size: clamp(2.4rem, 5vw, 3.8rem); text-transform: uppercase;">
        READY TO <span style="color: var(--riso-pink);">PLAY?</span>
      </h2>

      <div class="footer-nav-links">
        <a href="/index.html">Arena</a>
        <a href="/pens.html">Arsenal</a>
        <a href="/rules.html">Rules</a>
        <a href="/download.html">Download</a>
      </div>

      <a href="/" class="btn-chunky btn-teal" style="font-size: 1.3rem; padding: 12px 30px;">
        <span>PLAY NOW ↴</span>
      </a>

      <div class="footer-closing-tape">
        ★ PEN FIGHT ★
      </div>
    </div>

    <p class="footer-copyright">
      Pen Fight &bull; Play Online 3D
    </p>
  </footer>

</body>
</html>
